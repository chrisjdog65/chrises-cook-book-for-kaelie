<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b8452f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kaelies recipe book">
<meta name="description" content="Kaelies recipe book sent from your amazing boyfriend Chris Jensen — 44 recipes with ingredients, cook times, step-by-step instructions and video links.">
<title>Kaelies recipe book</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E">
<style>
/* ===== Kaelie's Recipe Book — styles ===== */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg:#fbf6ee; --bg2:#ffffff; --bg3:#f4ece0;
  --ink:#2e2722; --ink2:#544a42; --muted:#87796d;
  --accent:#b8452f; --accent-ink:#fff; --accent2:#c9852f; --rose:#bf4f68;
  --line:#e9dfd1; --line2:#f2ebe0;
  --ok:#3f8b4a; --shadow:0 2px 10px rgba(70,50,32,.07), 0 12px 30px rgba(70,50,32,.06);
  --shadow-lg:0 6px 20px rgba(70,50,32,.12), 0 24px 60px rgba(70,50,32,.10);
  --r:16px; --r-sm:11px;
  --display:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --tabh:64px;
}
html[data-theme="dark"] {
  --bg:#16130f; --bg2:#211c17; --bg3:#2a231c;
  --ink:#f4ede2; --ink2:#d8cdbe; --muted:#a2937f;
  --accent:#e2765a; --accent-ink:#1a120d; --accent2:#e9b862; --rose:#e07a92;
  --line:#332b22; --line2:#2a231c;
  --shadow:0 2px 10px rgba(0,0,0,.35); --shadow-lg:0 10px 40px rgba(0,0,0,.5);
}

html { -webkit-text-size-adjust:100%; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
img,svg { max-width:100%; }
button { font:inherit; color:inherit; cursor:pointer; }
a { color:var(--accent); }
:focus-visible { outline:3px solid var(--accent2); outline-offset:2px; border-radius:6px; }
.hidden { display:none !important; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ============ COVER ============ */
#cover {
  position:fixed; inset:0; z-index:100; display:grid; place-items:center;
  padding:28px 22px calc(28px + env(safe-area-inset-bottom));
  background:
    radial-gradient(120% 80% at 50% -10%, #ffd9b0 0%, rgba(255,217,176,0) 60%),
    radial-gradient(90% 60% at 12% 105%, #f3b7a4 0%, rgba(243,183,164,0) 62%),
    linear-gradient(168deg,#fff6e9 0%,#fde4cf 42%,#f6c6ae 100%);
  text-align:center; overflow:hidden;
  transition:opacity .55s ease, visibility .55s;
}
html[data-theme="dark"] #cover {
  background:
    radial-gradient(120% 80% at 50% -10%, #4a2f22 0%, rgba(74,47,34,0) 60%),
    radial-gradient(90% 60% at 12% 105%, #46231f 0%, rgba(70,35,31,0) 62%),
    linear-gradient(168deg,#241a14 0%,#31201a 46%,#3d2620 100%);
}
#cover.gone { opacity:0; visibility:hidden; pointer-events:none; }
.cover-inner { position:relative; z-index:2; width:100%; max-width:520px; }
.cover-orn { font-size:15px; letter-spacing:.42em; text-transform:uppercase; color:#a9603f; margin-bottom:22px; }
html[data-theme="dark"] .cover-orn { color:#e0a077; }
.cover-rule { display:flex; align-items:center; gap:14px; justify-content:center; margin:22px auto; max-width:290px; color:#c1795a; }
.cover-rule::before, .cover-rule::after { content:''; flex:1; height:1px; background:currentColor; opacity:.45; }
.cover-rule span { font-size:19px; }
#coverTitle {
  font-family:var(--display); font-weight:400; margin:0;
  font-size:clamp(36px,11vw,64px); line-height:1.07; color:#5e2a1a;
  letter-spacing:-.015em; overflow-wrap:break-word; hyphens:none;
}
html[data-theme="dark"] #coverTitle { color:#ffe6d2; }
#coverFrom {
  font-family:var(--display); font-style:italic;
  font-size:clamp(18px,5.2vw,25px); line-height:1.45; color:#8a4227; margin:0 auto; max-width:19em;
}
html[data-theme="dark"] #coverFrom { color:#f0bd9c; }
#coverFrom b { font-style:normal; font-weight:600; white-space:nowrap; }
.cover-count { margin-top:26px; font-size:14px; color:#a9603f; letter-spacing:.06em; }
html[data-theme="dark"] .cover-count { color:#d29b76; }
#openBtn {
  margin-top:30px; border:0; background:#8f3520; color:#fff;
  padding:17px 40px; border-radius:999px; font-size:17px; font-weight:600;
  letter-spacing:.02em; box-shadow:0 10px 26px rgba(143,53,32,.34);
  transition:transform .16s ease, box-shadow .16s ease;
}
#openBtn:active { transform:translateY(2px) scale(.985); box-shadow:0 5px 14px rgba(143,53,32,.3); }
html[data-theme="dark"] #openBtn { background:#e2765a; color:#241009; }
.cover-deco { position:absolute; opacity:.5; font-size:30px; animation:drift 7s ease-in-out infinite; }
@keyframes drift { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-15px) rotate(5deg)} }
@media (prefers-reduced-motion:reduce){ .cover-deco{animation:none} }

/* ============ SHELL ============ */
#app { max-width:760px; margin:0 auto; padding:0 15px calc(var(--tabh) + 34px + env(safe-area-inset-bottom)); }
.topbar {
  position:sticky; top:0; z-index:40; background:var(--bg);
  padding:12px 0 10px; margin:0 -15px; padding-left:15px; padding-right:15px;
  border-bottom:1px solid var(--line);
}
.topbar-row { display:flex; align-items:center; gap:10px; }
.brand { font-family:var(--display); font-size:20px; font-weight:400; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.brand b { color:var(--accent); font-weight:400; }
.iconbtn {
  border:1px solid var(--line); background:var(--bg2); border-radius:11px;
  width:40px; height:40px; display:grid; place-items:center; font-size:18px; flex:none;
  transition:background .15s, transform .1s;
}
.iconbtn:active { transform:scale(.93); }
.backbtn { border:1px solid var(--line); background:var(--bg2); border-radius:999px;
  padding:8px 15px 8px 11px; font-size:14px; font-weight:600; display:inline-flex; gap:6px; align-items:center; }

.search { position:relative; margin-top:10px; }
.search input {
  width:100%; padding:13px 42px 13px 42px; font-size:16px; color:var(--ink);
  background:var(--bg2); border:1px solid var(--line); border-radius:13px; font-family:inherit;
}
.search input::placeholder { color:var(--muted); }
/* we draw our own clear button; suppress the native one so there aren't two */
.search input::-webkit-search-cancel-button,
.search input::-webkit-search-decoration { -webkit-appearance:none; appearance:none; display:none; }
.search .mag { position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.55; font-size:15px; pointer-events:none; }
.search .clr { position:absolute; right:7px; top:50%; transform:translateY(-50%); border:0;
  background:var(--bg3); border-radius:50%; width:27px; height:27px; font-size:15px; line-height:1; color:var(--muted); }

/* ============ TABBAR ============ */
.tabbar {
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  display:flex; background:var(--bg2); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -3px 18px rgba(60,40,25,.07);
}
html[data-theme="dark"] .tabbar { box-shadow:0 -3px 18px rgba(0,0,0,.4); }
.tabbar button {
  flex:1; border:0; background:none; padding:9px 2px 8px; height:var(--tabh);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.01em;
}
.tabbar button .ti { font-size:21px; line-height:1; }
.tabbar button.on { color:var(--accent); }
.tabbar .badge {
  position:absolute; transform:translate(15px,-13px); background:var(--accent); color:var(--accent-ink);
  border-radius:999px; font-size:10px; min-width:17px; height:17px; padding:0 5px;
  display:grid; place-items:center; font-weight:700;
}

/* ============ GENERIC ============ */
.h {
  font-family:var(--display); font-size:25px; font-weight:400; margin:26px 0 4px; line-height:1.2;
}
.h.first { margin-top:18px; }
.sub { color:var(--muted); font-size:14.5px; margin:0 0 16px; }
.empty { text-align:center; padding:52px 22px; color:var(--muted); }
.empty .big { font-size:46px; display:block; margin-bottom:12px; }

.chips { display:flex; gap:8px; overflow-x:auto; padding:2px 15px 12px; margin:0 -15px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.chips::-webkit-scrollbar { display:none; }
.chip {
  border:1px solid var(--line); background:var(--bg2); border-radius:999px;
  padding:7px 14px; font-size:13.5px; font-weight:600; white-space:nowrap; color:var(--ink2); flex:none;
}
.chip.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

/* ============ CATEGORY TILES ============ */
.catgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:11px; }
@media (min-width:620px){ .catgrid{grid-template-columns:repeat(3,1fr)} }
.catcard {
  border:1px solid var(--line); background:var(--bg2); border-radius:var(--r);
  padding:15px 13px; text-align:left; display:block; box-shadow:var(--shadow);
  transition:transform .14s ease; width:100%;
}
.catcard:active { transform:scale(.975); }
.catcard .ce { font-size:29px; line-height:1; }
.catcard .cn { font-family:var(--display); font-size:17px; margin-top:9px; line-height:1.25; }
.catcard .cc { color:var(--muted); font-size:12.5px; margin-top:3px; }

/* ============ RECIPE CARDS ============ */
.rgrid { display:grid; gap:14px; }
@media (min-width:560px){ .rgrid{grid-template-columns:repeat(2,1fr)} }
.rcard {
  border:1px solid var(--line); background:var(--bg2); border-radius:var(--r);
  overflow:hidden; box-shadow:var(--shadow); text-align:left; padding:0; width:100%; display:block;
  transition:transform .14s ease, box-shadow .14s ease;
}
.rcard:active { transform:scale(.985); }
.rcard .art { aspect-ratio:400/260; background:var(--bg3); position:relative; }
.rcard .art svg { display:block; width:100%; height:100%; }
.rcard .fav {
  position:absolute; top:9px; right:9px; width:35px; height:35px; border-radius:50%;
  border:0; background:rgba(255,255,255,.9); font-size:17px; display:grid; place-items:center;
  box-shadow:0 2px 7px rgba(0,0,0,.16); line-height:1;
}
.rcard .body { padding:13px 14px 15px; }
.rcard .t { font-family:var(--display); font-size:18px; line-height:1.28; }
.rcard .b { color:var(--muted); font-size:13.5px; margin-top:5px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.rcard .m { display:flex; gap:9px; flex-wrap:wrap; margin-top:10px; font-size:12.5px; color:var(--ink2); }
.rcard .m span { display:inline-flex; align-items:center; gap:4px; }
.dot { width:4px; height:4px; border-radius:50%; background:var(--line); align-self:center; }

.diff { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  padding:3px 8px; border-radius:999px; }
.diff.Easy { background:#e6f4e3; color:#2f6b38; }
.diff.Medium { background:#fdf0d8; color:#8a5c14; }
.diff.Advanced { background:#fbe3de; color:#983120; }
html[data-theme="dark"] .diff.Easy { background:#1e3320; color:#8fd49a; }
html[data-theme="dark"] .diff.Medium { background:#3a2e12; color:#e9c46a; }
html[data-theme="dark"] .diff.Advanced { background:#3d1e17; color:#f0a08c; }

/* ============ RECIPE DETAIL ============ */
.hero { border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow-lg); margin-top:14px; position:relative; }
.hero svg { display:block; width:100%; height:auto; }
.rtitle { font-family:var(--display); font-size:clamp(26px,7vw,34px); line-height:1.14; margin:18px 0 0; }
.rblurb { color:var(--ink2); margin:9px 0 0; font-size:15.5px; }
.rtags { display:flex; gap:7px; flex-wrap:wrap; margin-top:13px; }
.rtag { background:var(--bg3); border-radius:999px; padding:4px 11px; font-size:12.5px; color:var(--ink2); font-weight:600; }

.metagrid {
  display:grid; grid-template-columns:repeat(2,1fr); gap:1px; margin-top:18px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
}
@media (min-width:480px){ .metagrid{grid-template-columns:repeat(4,1fr)} }
.metagrid div { background:var(--bg2); padding:12px 10px; text-align:center; }
.metagrid .k { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:700; }
.metagrid .v { font-size:15px; font-weight:600; margin-top:3px; }

.actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
.act {
  border:1px solid var(--line); background:var(--bg2); border-radius:13px; padding:13px 10px;
  display:flex; align-items:center; justify-content:center; gap:8px; font-size:14.5px; font-weight:600;
  text-decoration:none; color:var(--ink); text-align:center; box-shadow:var(--shadow);
}
.act.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.act .i { font-size:17px; }
.act:active { transform:scale(.985); }

.section { margin-top:30px; }
.section > h3 {
  font-family:var(--display); font-size:21px; font-weight:400; margin:0 0 4px;
  display:flex; align-items:center; gap:9px;
}
.section > h3 .n { background:var(--accent); color:var(--accent-ink); width:27px; height:27px;
  border-radius:50%; display:grid; place-items:center; font-size:13px; font-family:var(--sans); font-weight:700; flex:none; }
.section .hint { color:var(--muted); font-size:13px; margin:0 0 13px; }

/* servings scaler */
.scaler { display:flex; align-items:center; gap:9px; margin:12px 0 14px; flex-wrap:wrap; }
.scaler .lab { font-size:13px; color:var(--muted); font-weight:600; }
.scaler .grp { display:flex; border:1px solid var(--line); border-radius:11px; overflow:hidden; background:var(--bg2); }
.scaler button { border:0; background:none; padding:8px 15px; font-size:14px; font-weight:700; color:var(--ink2); }
.scaler button + button { border-left:1px solid var(--line); }
.scaler button.on { background:var(--accent); color:var(--accent-ink); }

.igroup { margin-top:16px; }
.igroup > h4 { font-size:12.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--accent);
  margin:0 0 8px; font-weight:800; }
.ilist { list-style:none; margin:0; padding:0; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--bg2); }
.ilist li { border-bottom:1px solid var(--line2); }
.ilist li:last-child { border-bottom:0; }
.ilist label { display:flex; gap:12px; align-items:flex-start; padding:12px 14px; cursor:pointer; }
.ilist input { appearance:none; -webkit-appearance:none; width:21px; height:21px; border:2px solid var(--line);
  border-radius:6px; flex:none; margin-top:2px; position:relative; background:var(--bg2); transition:.15s; }
.ilist input:checked { background:var(--ok); border-color:var(--ok); }
.ilist input:checked::after { content:'✓'; position:absolute; inset:0; display:grid; place-items:center;
  color:#fff; font-size:13px; font-weight:800; }
.ilist input:checked + span { text-decoration:line-through; color:var(--muted); }
.ilist .amt { font-variant-numeric:tabular-nums; font-weight:700; }

.steps { list-style:none; counter-reset:s; margin:0; padding:0; }
.steps li {
  counter-increment:s; position:relative; padding:0 0 0 46px; margin-bottom:20px;
}
.steps li::before {
  content:counter(s); position:absolute; left:0; top:0; width:32px; height:32px; border-radius:50%;
  background:var(--bg3); color:var(--accent); display:grid; place-items:center;
  font-weight:800; font-size:14px; border:1px solid var(--line);
}
.steps li.done::before { content:'✓'; background:var(--ok); color:#fff; border-color:var(--ok); }
.steps li.done .st, .steps li.done .sx { opacity:.5; }
.steps .st { font-weight:700; font-size:16px; margin-bottom:3px; }
.steps .sx { color:var(--ink2); font-size:15.5px; }
.steps .tapme { position:absolute; inset:0; background:none; border:0; padding:0; }
.timerbtn {
  margin-top:9px; border:1px solid var(--line); background:var(--bg2); border-radius:999px;
  padding:6px 14px; font-size:13px; font-weight:700; color:var(--accent);
  display:inline-flex; align-items:center; gap:6px; position:relative; z-index:2;
}
.timerbtn.running { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

.callout { border-radius:var(--r); padding:15px 17px; margin-top:16px; border:1px solid var(--line);
  background:var(--bg2); box-shadow:var(--shadow); }
.callout.temp { border-left:4px solid var(--accent); }
.callout.pair { border-left:4px solid var(--accent2); }
.callout .ct { font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; font-weight:800;
  color:var(--muted); margin-bottom:5px; }
.callout .cb { font-size:15.5px; color:var(--ink); }

.tips { list-style:none; margin:0; padding:0; }
.tips li { display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line2); font-size:15.5px; color:var(--ink2); }
.tips li:last-child { border-bottom:0; }
.tips .tb { color:var(--accent2); flex:none; font-size:15px; }

/* sits just under the sticky topbar (63px); in cook mode the topbar is gone, so it goes to 0 */
.progwrap { position:sticky; top:63px; z-index:30; background:var(--bg); padding:9px 0 11px; margin:0 -15px;
  padding-left:15px; padding-right:15px; border-bottom:1px solid var(--line); }
html.cook .progwrap { top:0; }
.progbar { height:6px; background:var(--bg3); border-radius:999px; overflow:hidden; }
.progbar i { display:block; height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); width:0; transition:width .3s ease; }
.progtxt { font-size:12px; color:var(--muted); margin-top:5px; display:flex; justify-content:space-between; }

/* shopping list */
.slgroup { border:1px solid var(--line); background:var(--bg2); border-radius:var(--r); margin-bottom:13px; overflow:hidden; box-shadow:var(--shadow); }
.slgroup > header { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line2); }
.slgroup > header .t { font-family:var(--display); font-size:16.5px; flex:1; }
.slgroup > header button { border:0; background:none; color:var(--muted); font-size:19px; padding:2px 4px; }

.toast {
  position:fixed; left:50%; bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px); background:var(--ink); color:var(--bg);
  padding:11px 19px; border-radius:999px; font-size:14px; font-weight:600; z-index:80;
  opacity:0; transition:.25s; pointer-events:none; box-shadow:0 8px 26px rgba(0,0,0,.25); max-width:88vw; text-align:center;
}
.toast.show { opacity:1; transform:translate(-50%,0); }

/* cook mode */
html.cook { --tabh:0px; }
html.cook .tabbar, html.cook .topbar { display:none; }
html.cook .steps .sx { font-size:18.5px; }
html.cook .steps .st { font-size:18px; }
html.cook #app { padding-bottom:110px; }
.cookexit { position:fixed; right:14px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:60;
  background:var(--accent); color:var(--accent-ink); border:0; border-radius:999px;
  padding:14px 22px; font-weight:700; box-shadow:var(--shadow-lg); }

.foot { text-align:center; color:var(--muted); font-size:13px; padding:34px 12px 8px; }
.foot .hr { width:44px; height:1px; background:var(--line); margin:0 auto 14px; }

</style>
</head>
<body>

<!-- ============ COVER ============ -->
<div id="cover">
  <span class="cover-deco" style="left:9%;top:15%">🍅</span>
  <span class="cover-deco" style="right:11%;top:11%;animation-delay:-2s">🧄</span>
  <span class="cover-deco" style="left:15%;bottom:16%;animation-delay:-3.5s">🌿</span>
  <span class="cover-deco" style="right:13%;bottom:19%;animation-delay:-1.2s">🍋</span>
  <span class="cover-deco" style="left:47%;bottom:8%;animation-delay:-4.6s">🥄</span>
  <div class="cover-inner">
    <div class="cover-orn">Recipe Book</div>
    <h1 id="coverTitle">Kaelies recipe book</h1>
    <div class="cover-rule"><span>🤍</span></div>
    <p id="coverFrom">sent from your amazing boyfriend <b>Chris Jensen</b></p>
    <div class="cover-count">44 recipes &nbsp;·&nbsp; 4 chapters &nbsp;·&nbsp; every one worth making</div>
    <button id="openBtn">Open the book</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar">

<script id="bookdata" type="application/json">{"recipes":[{"id":"reverse-seared-ribeye","title":"Reverse-Seared Ribeye with Herb Butter","emoji":"🥩","art":"steak","blurb":"A thick ribeye brought up slowly in a low oven, then blasted in a screaming skillet for 60 seconds a side. You get wall-to-wall pink and a crust like a steakhouse, with almost no way to overshoot.","difficulty":"Medium","servings":"2 servings","prepTime":"15 min","cookTime":"1 hr","totalTime":"1 hr 25 min","ingredients":[{"group":"For the steaks","items":["2 boneless ribeye steaks (14 oz / 400 g each, 1½ to 2 in / 4 to 5 cm thick)","2 tsp (10 g) kosher salt, about ½ tsp per side per steak","1½ tsp coarsely ground black pepper","1 tbsp (15 ml) grapeseed, avocado, or other neutral high-smoke-point oil"]},{"group":"Herb butter and basting","items":["4 tbsp (55 g) unsalted butter, softened","2 garlic cloves, minced (about 2 tsp)","1 tbsp finely chopped fresh parsley","1 tsp finely chopped fresh thyme leaves, plus 4 whole sprigs for basting","½ tsp (2 g) flaky sea salt, for finishing"]}],"instructions":[{"title":"Pick the right thickness","text":"This method only works on steaks at least 1½ inches (4 cm) thick, so ask the butcher to cut them for you rather than buying two thin ones. A thin steak will race past medium-rare in the oven before you ever get to sear it. Look for ribeyes with fine white marbling threaded through the muscle, not just a fat cap on the edge, because that intramuscular fat is what bastes the meat from the inside."},{"title":"Dry brine the steaks","text":"Pat both steaks completely dry with paper towels, then season all over with the 2 tsp kosher salt, including the edges. Set them on a wire rack over a sheet pan and refrigerate uncovered for at least 45 minutes, or up to 24 hours if you are planning ahead. The salt first pulls moisture to the surface, then that seasoned liquid gets reabsorbed, and the surface dries out — which is exactly what you want for a crust."},{"title":"Make the herb butter","text":"Mash the softened butter with the minced garlic, parsley, and chopped thyme in a small bowl until it is evenly streaked green. Scrape it onto a piece of plastic wrap, roll it into a log about 1 inch (2.5 cm) thick, and chill it in the fridge while the steaks cook. Cold, firm butter melts slowly over hot meat instead of instantly turning to a greasy puddle."},{"title":"Set up a low oven","text":"Heat the oven to 250°F (120°C) with a rack in the middle. Leave the steaks on their wire rack over the sheet pan — elevating them lets hot air circulate underneath so they cook evenly instead of steaming on one side. Season them now with the black pepper; adding it before the low bake, rather than before a hard sear, keeps it from scorching and turning bitter."},{"title":"Slow-roast to 115°F","text":"Slide the pan into the oven and cook until the center of the thickest steak reads 115°F (46°C) on an instant-read thermometer, usually 40 to 55 minutes for 1½-inch steaks. Start checking at 35 minutes and probe from the side, aiming for the true center and avoiding bone or a fat seam. For medium instead of medium-rare, pull at 125°F (52°C); the searing step will add another 10 to 15°F (6 to 8°C)."},{"title":"Rest while the pan heats","text":"Take the steaks out and let them sit on the counter while you heat the skillet, about 8 to 10 minutes. Pat the surfaces dry one more time with paper towels — the oven will have drawn out a little more moisture and any wetness costs you crust. This pause is not a real rest; it is just efficient use of the time it takes to get cast iron truly hot."},{"title":"Get the skillet ripping hot","text":"Set a 12-inch (30 cm) cast-iron skillet over high heat and let it preheat for a full 5 minutes, then add the tablespoon of neutral oil. You want the oil shimmering with the first wisps of smoke curling off it, around 450 to 500°F (230 to 260°C). Turn on the exhaust fan and open a window now, not after the smoke alarm has an opinion about it."},{"title":"Sear the first side","text":"Lay the steaks away from you into the pan and press down gently for the first 5 seconds so the whole surface makes contact. Do not touch them again for 45 to 60 seconds — it should roar with a loud, steady sizzle. If the pan is silent, it was not hot enough; if the oil is billowing black smoke, pull the pan off the burner for 20 seconds before continuing."},{"title":"Flip and sear the second side","text":"Flip with tongs and sear the second side for another 45 to 60 seconds. Then stand each steak on its fat edge, holding it upright with tongs for 20 to 30 seconds, until that strip of fat turns golden and renders. Rendered fat edge is the difference between a steak that tastes finished and one that leaves a waxy ribbon on your plate."},{"title":"Butter baste with aromatics","text":"Drop the heat to medium, add 2 tbsp of the herb butter and the 4 thyme sprigs, and tilt the pan so the butter pools at the low edge. Spoon that foaming butter over the steaks continuously for 45 to 60 seconds. The butter should be tan and nutty smelling, not dark brown and acrid — if it darkens fast, pull the pan off the heat and keep spooning."},{"title":"Check the final temperature","text":"Probe the center again: 128 to 130°F (53 to 54°C) means a perfect medium-rare after resting. If you are 5°F short, give the steaks another 20 seconds per side rather than leaving them sitting in the pan, where the bottom will overcook. Trust the thermometer over the clock every single time — thickness varies more than recipes admit."},{"title":"Rest, slice, and top","text":"Move the steaks to a warm plate or cutting board and rest for 8 to 10 minutes; because they came up slowly, they need far less resting than a hard-seared steak. Slice against the grain into ½-inch (1 cm) strips, or serve whole. Lay a ¼-inch coin of the cold herb butter on top of each steak and finish with the flaky salt just before it hits the table."}],"tips":["The uncovered overnight dry brine is the single biggest upgrade here — 24 hours in the fridge on a rack gives you a noticeably better crust than 45 minutes.","No cast iron? A heavy stainless steel skillet works. Nonstick does not — it cannot safely take the 450°F+ (230°C+) heat a real crust needs.","Leftover herb butter keeps 2 weeks in the fridge or 3 months in the freezer; slice coins off the frozen log for vegetables, fish, or toast.","If your kitchen fills with smoke, you can finish the sear on a grill or outdoor burner — the technique is identical, just hotter and better ventilated.","Save the rendered beef fat left in the skillet, strain it into a jar, and use it to roast potatoes; it is the best fat in your kitchen."],"keyTemp":"This is a pull temperature: take the steaks out of the oven at 115°F (46°C). The sear plus carryover adds another 15 to 20°F (8 to 11°C), landing you at 130 to 135°F (54 to 57°C) for medium-rare. Medium is 140°F (60°C); past 150°F (66°C) a ribeye goes gray and dry.","pairing":"Creamy mashed potatoes and a wedge salad, with a big Cabernet Sauvignon or a cold dark beer.","videoQuery":"reverse sear ribeye steak cast iron","photoQuery":"reverse seared ribeye herb butter","tags":["Date Night","Cast Iron","Steakhouse"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"cast-iron-ny-strip-garlic-butter","title":"Cast-Iron New York Strip with Garlic Butter","emoji":"🧈","art":"steak","blurb":"The 30-minute steak dinner worth knowing by heart. One pan, one flip, a shower of foaming garlic-thyme butter, and you are eating in less time than delivery takes.","difficulty":"Easy","servings":"2 servings","prepTime":"10 min","cookTime":"12 min","totalTime":"30 min","ingredients":[{"group":"For the steaks","items":["2 New York strip steaks (12 oz / 340 g each, about 1¼ in / 3 cm thick)","1½ tsp (7 g) kosher salt","1 tsp freshly ground black pepper","1 tbsp (15 ml) neutral oil such as canola, grapeseed, or avocado"]},{"group":"Garlic butter baste","items":["3 tbsp (42 g) unsalted butter","4 garlic cloves, lightly smashed but left whole","5 sprigs fresh thyme (or 3 sprigs rosemary)","½ tsp (2 g) flaky sea salt, for finishing"]}],"instructions":[{"title":"Temper and dry the steaks","text":"Take the steaks out of the fridge 20 to 30 minutes before cooking and set them on a plate lined with paper towels. A steak straight from the fridge cooks unevenly, giving you a gray band around a cold center. While they sit, pat the surfaces bone dry — every drop of surface moisture has to boil off before browning can even start."},{"title":"Season generously","text":"Sprinkle the kosher salt and black pepper over both sides and the edges, holding your hand about 10 inches (25 cm) above so it lands evenly. It will look like more salt than you would put on anything else, and that is correct: a thick steak is mostly interior, and only the surface gets seasoned. Press the seasoning in gently with your palm so it sticks."},{"title":"Preheat the skillet properly","text":"Set a 10- or 12-inch (25 to 30 cm) cast-iron skillet over medium-high heat and leave it alone for 4 to 5 minutes. Test it by flicking in a few drops of water — they should skitter and evaporate in about 2 seconds. Cast iron heats slowly and unevenly at first, so this preheat is doing real work, not wasting your time."},{"title":"Add oil and lay in the steaks","text":"Pour in the tablespoon of oil and swirl to coat; it should shimmer and thin out within 15 seconds. Lay the steaks in the pan pointing away from you so any splatter goes toward the back, and leave 1 inch (2.5 cm) of space between them. Crowding drops the pan temperature and traps steam, which is how you end up with gray, sad steak."},{"title":"Sear the first side undisturbed","text":"Cook for 3½ to 4 minutes without moving, nudging, or peeking more than once. You are listening for a steady, aggressive sizzle — if it goes quiet the pan is too cool, and if the oil throws black smoke turn the burner down one notch. Lift a corner at 3 minutes: the crust should be deep brown and evenly colored, not spotty."},{"title":"Flip once and sear","text":"Flip with tongs, never a fork, and cook the second side for 3 minutes. Resist the urge to flip repeatedly; each flip resets the surface temperature and slows crust development on a pan this size. The second side always takes slightly less time because the pan and the meat are both hotter now."},{"title":"Render the fat cap","text":"Grab the steaks with tongs and stand them on their fat edge, leaning them against each other or the side of the pan. Hold for 30 to 45 seconds until the fat turns golden and translucent and you can smell it toasting. This step takes almost no time and completely changes how the strip eats — unrendered fat is chewy and cold-tasting."},{"title":"Butter baste with garlic and thyme","text":"Lower the heat to medium and add the butter, smashed garlic cloves, and thyme sprigs to the pan. Once the butter foams, tilt the skillet toward you and spoon it over the steaks nonstop for 60 to 90 seconds, aiming for the thickest part. The butter should smell nutty and look tan; if it turns dark brown and smells sharp, take the pan off the burner and keep basting off heat."},{"title":"Check with a thermometer","text":"Slide an instant-read thermometer into the side of a steak toward the center: 125°F (52°C) is your pull temperature for medium-rare, 135°F (57°C) for medium. If you are under, keep basting in 30-second bursts and re-check rather than searing harder. Carryover cooking will add 5 to 8°F (3 to 4°C) while the steak rests."},{"title":"Rest before you cut","text":"Move the steaks to a cutting board or warm plate and let them rest 8 minutes, loosely tented with foil if your kitchen is cold. Cutting immediately dumps the juices onto the board because the muscle fibers are still contracted and pressurized. Spoon the pan butter and softened garlic cloves over the top and finish with flaky salt."},{"title":"Slice against the grain","text":"Find the direction the muscle fibers run — on a strip they run the length of the steak — and cut across them at a slight angle into ½-inch (1 cm) slices. Cutting against the grain shortens those fibers so each bite is tender instead of stringy. Serve right away, and pour any board juices back over the slices."}],"tips":["If your steaks are thicker than 1½ inches (4 cm), sear both sides then finish in a 400°F (205°C) oven for 4 to 6 minutes so the center catches up without burning the crust.","Cook one steak at a time in a 10-inch skillet. Two crowded steaks steam; the first one stays perfectly warm resting while the second cooks.","Do not throw away the garlic cloves — they turn sweet and jammy in the butter and are fantastic smashed onto bread.","No fresh thyme? Rosemary works, or skip the herbs entirely; the garlic and butter carry the dish on their own."],"keyTemp":"These are pull temperatures, not serving temperatures: pull at 125°F (52°C) for medium-rare or 135°F (57°C) for medium. Carryover cooking during the 8-minute rest adds 5 to 8°F (3 to 4°C), so they finish at 130 to 143°F (54 to 62°C).","pairing":"Crispy roasted potatoes and blistered green beans, with a glass of Malbec.","videoQuery":"cast iron new york strip butter basted","photoQuery":"cast iron new york strip steak","tags":["Weeknight","30 Minutes","Cast Iron"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"filet-mignon-red-wine-pan-sauce","title":"Filet Mignon with Red Wine Pan Sauce","emoji":"🍷","art":"steak","blurb":"The most tender cut on the animal, seared hard and served under a glossy red wine sauce built from the browned bits in the pan. It looks like a special occasion and takes under an hour.","difficulty":"Medium","servings":"2 servings","prepTime":"15 min","cookTime":"35 min","totalTime":"50 min","ingredients":[{"group":"For the steaks","items":["2 center-cut filet mignon steaks (7 oz / 200 g each, about 2 in / 5 cm thick)","1 tsp (5 g) kosher salt","¾ tsp (2 g) freshly ground black pepper","1 tbsp (15 ml) neutral oil such as grapeseed or canola","1 tbsp (14 g) unsalted butter"]},{"group":"Red wine pan sauce","items":["1 large shallot, finely minced (about ¼ cup / 40 g)","1 garlic clove, minced (1 tsp)","¾ cup (180 ml) dry red wine such as Cabernet Sauvignon or Merlot","¾ cup (180 ml) low-sodium beef stock","1 tsp fresh thyme leaves","3 tbsp (42 g) cold unsalted butter, cut into cubes","¼ tsp kosher salt, plus more to taste"]}],"instructions":[{"title":"Prep and tie the filets","text":"Take the filets out of the fridge 30 minutes ahead and pat them completely dry. If they look uneven or floppy, tie a loop of kitchen twine around the equator of each one so it holds a tall, round shape. A tied filet cooks evenly and gives you a taller cylinder with more surface area to brown."},{"title":"Season on all surfaces","text":"Season the filets with the kosher salt and black pepper on the top, the bottom, and all the way around the sides. Filet is lean and mild, so it needs more seasoning than a fatty cut like ribeye to taste like anything. Let them sit at room temperature while you mince the shallot and garlic and heat the oven."},{"title":"Heat the oven and the pan","text":"Set the oven to 400°F (205°C) with a rack in the center. Put a 10-inch (25 cm) oven-safe skillet — cast iron or heavy stainless — over medium-high heat for 4 minutes, then add the tablespoon of oil. When the oil shimmers and moves like water in the pan, you are ready."},{"title":"Sear the flat sides","text":"Lay the filets flat-side down and sear for 3 minutes without moving them, until a deep brown crust forms. Flip and sear the second flat side another 3 minutes. The pan should sizzle loudly and steadily the entire time; if the sound dies down, your heat is too low and you are stewing the meat."},{"title":"Roll the sides","text":"Using tongs, stand each filet on its edge and roll it slowly around the circumference, giving each section about 30 seconds, for 1½ to 2 minutes total. That band around the outside is a third of the steak's surface and skipping it leaves a pale, bland ring. Add the tablespoon of butter in the last 30 seconds and spoon it over the tops."},{"title":"Finish in the oven","text":"Transfer the whole skillet to the 400°F (205°C) oven and roast 5 to 8 minutes, depending on thickness. Start checking at 5 minutes with an instant-read thermometer pushed into the center from the side. Pull at 125°F (52°C) for medium-rare or 135°F (57°C) for medium; filet is so lean that even 10 extra degrees turns it chalky."},{"title":"Rest the steaks","text":"Move the filets to a plate, tent loosely with foil, and rest for 10 minutes while you build the sauce. Do not skip this — filet holds a lot of water in a tight muscle and cutting early will flood your board. Snip off the twine before serving if you tied them."},{"title":"Sweat the shallot","text":"Set the skillet back over medium heat, pouring off all but about 1 tablespoon of fat but leaving every brown speck stuck to the bottom. Add the minced shallot and cook 90 seconds until soft and translucent, then add the garlic and thyme for 30 seconds more. Keep it moving so the garlic perfumes the fat without burning and turning bitter."},{"title":"Deglaze with red wine","text":"Pour in the ¾ cup red wine and immediately scrape the bottom of the pan with a wooden spoon; those stuck-on brown bits, called fond, are the entire flavor of the sauce. Let it bubble and reduce by about half, 3 to 4 minutes, until it coats the back of the spoon thinly. If it smells sharply of alcohol, it needs another minute."},{"title":"Add stock and reduce","text":"Pour in the ¾ cup beef stock along with any juices that have collected under the resting steaks. Simmer briskly for 5 to 7 minutes until the liquid has reduced to about ⅓ cup and looks syrupy. Drag your spoon through it — the sauce should leave a clear path across the pan bottom for a full second."},{"title":"Mount with cold butter","text":"Take the pan off the heat and let it cool for 20 seconds, then whisk in the cold butter cubes one or two at a time until each melts before adding more. This is called mounting, and cold butter is essential — it emulsifies into a glossy sauce instead of separating into an oil slick. Taste and add the ¼ tsp salt, adjusting if your stock was already salty."},{"title":"Plate and serve","text":"Spoon 2 to 3 tablespoons of sauce onto each warm plate and set the filet on top rather than drowning it, so the crust stays crisp. Pour any remaining sauce into a small pitcher for the table. Serve immediately, while the sauce is still glossy and warm — it will tighten as it cools."}],"tips":["Use a wine you would actually drink. Cooking wine is salted and harsh, and in a sauce reduced this far, every flaw gets concentrated.","The pan sauce can be made up to 2 days ahead through the stock reduction; reheat gently and whisk in the cold butter right before serving.","If the sauce breaks and looks oily, pull it off the heat and whisk in 1 tablespoon of cold stock or water to bring it back together.","Filet has almost no fat, so it is the one steak worth wrapping in bacon if you like — secure it with the twine and render the bacon in the pan first.","Do not use nonstick for this recipe. You need fond stuck to the pan, and nonstick is specifically designed to prevent it."],"keyTemp":"Pull at 125°F (52°C) for medium-rare — that is a pull temperature, taken the moment the skillet leaves the oven. Carryover adds 5 to 10°F (3 to 6°C) over the 10-minute rest, so the center settles at 130 to 135°F (54 to 57°C). Medium is 140°F (60°C) and is as far as filet should ever go.","pairing":"Roasted asparagus and a potato gratin, with the same red wine you used in the sauce.","videoQuery":"filet mignon red wine pan sauce","photoQuery":"filet mignon red wine sauce plated","tags":["Date Night","Pan Sauce","Special Occasion"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"steak-au-poivre","title":"Steak au Poivre with Cognac Cream","emoji":"🌶️","art":"steak","blurb":"A French bistro classic: steak pressed into cracked peppercorns and finished with a cognac cream sauce. The pepper crust goes floral and warm instead of harsh once it hits the hot pan.","difficulty":"Medium","servings":"2 servings","prepTime":"15 min","cookTime":"25 min","totalTime":"55 min","ingredients":[{"group":"For the steaks","items":["2 steaks, filet mignon or New York strip (8 oz / 225 g each, 1½ in / 4 cm thick)","3 tbsp (21 g) whole black peppercorns","1¼ tsp (6 g) kosher salt","1 tbsp (15 ml) neutral oil","1 tbsp (14 g) unsalted butter"]},{"group":"Cognac cream sauce","items":["1 large shallot, finely minced (about ¼ cup / 40 g)","⅓ cup (80 ml) cognac or brandy","½ cup (120 ml) low-sodium beef stock","¾ cup (180 ml) heavy cream","1 tsp Dijon mustard","¼ tsp kosher salt, plus more to taste"]}],"instructions":[{"title":"Crack the peppercorns coarsely","text":"Put the whole peppercorns in a zip-top bag or on a cutting board and crush them with the bottom of a heavy skillet until they are cracked into rough halves and quarters. You want coarse, uneven pieces — not powder, which turns acrid and burns. If you use a grinder, set it to the coarsest possible setting and accept that hand-cracking is genuinely better here."},{"title":"Sift out the dust","text":"Shake the cracked pepper in a fine-mesh sieve over the sink for a few seconds to lose the finest powder. That dust is what makes a badly made au poivre taste harsh and dusty rather than warm and aromatic. What stays behind in the sieve is exactly what you want pressed into the meat."},{"title":"Salt and crust the steaks","text":"Pat the steaks completely dry and season both sides with the 1¼ tsp kosher salt. Spread the cracked pepper on a plate and press each steak firmly into it, coating both flat sides but leaving the edges mostly bare. Press hard with your palm so the pepper embeds and does not fall off in the pan."},{"title":"Let them sit 15 minutes","text":"Leave the crusted steaks on a rack at room temperature for 15 minutes before cooking. The salt begins to dissolve and draw into the meat, and the steaks lose the deep chill that causes uneven cooking. Meanwhile, mince the shallot and measure out the cognac, stock, and cream so everything is within arm's reach — this sauce moves fast."},{"title":"Heat the skillet","text":"Set a 10- or 12-inch (25 to 30 cm) heavy skillet over medium-high heat for 4 minutes, then add the oil. Wait for a shimmer with just the barest wisp of smoke, around 425°F (220°C). A stainless or cast-iron pan is required; you need the fond for the sauce."},{"title":"Sear the first side","text":"Lay the steaks in and cook undisturbed for 3½ to 4 minutes. You will smell the pepper toasting almost immediately, which is the whole point — heat mellows piperine into something floral. If the pepper starts smelling scorched rather than fragrant, lower the heat one notch."},{"title":"Flip and add butter","text":"Flip and cook the second side 3 to 4 minutes, adding the tablespoon of butter in the last minute and spooning the foam over the tops. Check the center with a thermometer: pull at 125°F (52°C) for medium-rare. For steaks thicker than 1½ inches, finish them in a 400°F (205°C) oven for 4 to 5 minutes instead of pushing the sear longer."},{"title":"Rest the steaks","text":"Move the steaks to a plate and tent loosely with foil while you make the sauce, about 8 minutes. Any juices that pool go straight into the sauce later, so keep the plate handy. Pour off all but about 1 tablespoon of fat from the pan but leave every browned speck."},{"title":"Cook the shallot and add cognac","text":"Lower the heat to medium, add the shallot, and cook 90 seconds until soft. Pull the pan off the burner completely, then pour in the ⅓ cup cognac — off-heat is how you avoid a flare-up, and no, you do not need to flambé anything. Return to the heat and simmer 2 to 3 minutes, scraping up the fond, until the liquid has reduced by about two-thirds."},{"title":"Build the cream sauce","text":"Add the ½ cup beef stock and simmer 2 minutes, then stir in the ¾ cup heavy cream and the 1 tsp Dijon. Let it bubble gently for 4 to 5 minutes until it thickens enough to coat the back of a spoon and a finger swiped through leaves a clean line. Stir in any resting juices from the steak plate, then season with the ¼ tsp kosher salt, tasting as you go — the stock and the peppercorn crust already bring salt, so add the last pinch only if it needs it."},{"title":"Serve immediately","text":"Spoon a generous puddle of sauce onto each warm plate, set the steak on top or slightly off center, and pour a little extra over one end so the pepper crust stays exposed. This sauce thickens noticeably as it cools, so plate the second it looks right. A few extra cracked peppercorns on top make it look like the bistro version."}],"tips":["If cognac is not in the house, use brandy, bourbon, or even dry sherry. For an alcohol-free version, use ½ cup extra beef stock plus 1 tsp red wine vinegar for brightness.","Always add the spirit off the heat and away from the flame. Alcohol vapor ignites easily, and this is the number one way people get scared out of making pan sauces.","Crack the peppercorns up to a week ahead and keep them in a jar; it makes this a genuinely fast weeknight dish.","Heavy cream is required — half-and-half and milk will break and curdle when reduced this hard."],"keyTemp":"Pull the steaks at 125°F (52°C) for medium-rare, resting to 130 to 135°F (54 to 57°C). The sauce should simmer gently around 190°F (88°C), never at a hard boil.","pairing":"Thin French fries or buttered haricots verts, with a Côtes du Rhône.","videoQuery":"steak au poivre cognac cream sauce","photoQuery":"steak au poivre peppercorn sauce","tags":["Date Night","French","Pan Sauce"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"carne-asada-skirt-steak","title":"Citrus-Marinated Carne Asada Skirt Steak","emoji":"🌮","art":"steak","blurb":"Skirt steak soaked in orange, lime, garlic, and cumin, then grilled fast over the hottest fire you can build. Charred edges, juicy middle, and it slices into the best taco filling there is.","difficulty":"Medium","servings":"4 servings","prepTime":"20 min","cookTime":"10 min","totalTime":"2 hr 40 min","ingredients":[{"group":"For the steak","items":["2 lb (900 g) outside skirt steak, cut into 3 or 4 manageable lengths","1½ tsp (7 g) kosher salt","1 tsp freshly ground black pepper","2 tsp (10 ml) neutral oil, for wiping the grill grate"]},{"group":"Citrus marinade","items":["½ cup (120 ml) fresh orange juice, from about 2 oranges","⅓ cup (80 ml) fresh lime juice, from about 3 limes","⅓ cup (80 ml) olive oil","6 garlic cloves, minced (about 2 tbsp)","1 cup (25 g) loosely packed cilantro leaves and stems, chopped","1 jalapeño, seeded and minced (about 2 tbsp)","1½ tsp ground cumin","1 tsp dried Mexican oregano","1 tsp (5 g) kosher salt"]},{"group":"To serve","items":["12 corn tortillas (6 in / 15 cm), warmed","½ cup (60 g) finely diced white onion","⅓ cup (8 g) chopped fresh cilantro leaves","2 limes, cut into wedges"]}],"instructions":[{"title":"Buy outside skirt if you can","text":"Outside skirt is thicker, more tender, and more evenly shaped than inside skirt, which is the one most supermarkets sell. Either works, but inside skirt is thinner and needs about 30 seconds less per side. Ask the butcher to peel off the tough membrane if it is still attached; you can also pull it off yourself with a paper towel for grip."},{"title":"Whisk the marinade","text":"In a large bowl, whisk together the orange juice, lime juice, olive oil, garlic, cilantro, jalapeño, cumin, oregano, and 1 tsp salt. The oil will not fully emulsify and that is fine — just whisk it again before pouring. Taste it: it should be bright and aggressively garlicky, because most of that flavor stays behind in the bag."},{"title":"Marinate 2 to 8 hours","text":"Put the steak pieces in a large zip-top bag or a shallow dish, pour the marinade over, press out the air, and refrigerate for at least 2 hours and no more than 8. Citrus acid tenderizes at first and then starts to break the surface down into mush, so 8 hours is a real ceiling, not a suggestion. Flip the bag once halfway through so every surface gets contact."},{"title":"Build a screaming hot fire","text":"For charcoal, light a full chimney and dump the coals into one dense layer; for gas, run all burners on high with the lid closed for 12 to 15 minutes. You want a grate around 550 to 600°F (290 to 315°C) — you should only be able to hold your hand 5 inches above it for about 2 seconds. Skirt steak is thin, so heat is the only thing standing between you and a gray, boiled result."},{"title":"Dry the steak thoroughly","text":"Pull the steak out of the marinade and scrape off the clinging bits of garlic and cilantro, which will only burn on the grate. Then pat both sides very dry with paper towels — this is the step people skip and then wonder why they have no char. Discard the used marinade; it has held raw meat and is not safe to reuse as a sauce."},{"title":"Season and oil the grate","text":"Season the dried steak with the 1½ tsp kosher salt and 1 tsp black pepper right before it goes on — salting earlier would pull moisture back to the surface you just dried. Fold a paper towel into a pad, soak it with the 2 tsp neutral oil, and wipe the hot grate with it held in long tongs so the meat releases cleanly instead of tearing. Have your platter and tongs ready by the grill, because from here the cooking takes under 6 minutes."},{"title":"Grill the first side","text":"Lay the pieces directly over the coals and grill 2½ to 3 minutes without moving them. You want dark char across roughly 70 percent of the surface with the rest deep brown. Flare-ups will happen when fat drips; move the meat to a cooler patch for a few seconds rather than dousing the fire with water."},{"title":"Flip and finish","text":"Flip once and grill 2 to 3 minutes more. Check with an instant-read thermometer inserted sideways into the thickest piece: 125 to 130°F (52 to 54°C) is where skirt eats best. Past 140°F (60°C) the muscle fibers seize and skirt turns tough and dry very quickly, so pull early if you are unsure."},{"title":"Rest on a board","text":"Move everything to a cutting board and rest for 8 to 10 minutes, uncovered or very loosely tented. Foil wrapped tight will steam the char you just worked for. The juices redistribute in this window, and the internal temperature will drift up another 5°F (3°C)."},{"title":"Find the grain and cut","text":"Skirt steak has very long, obvious muscle fibers running the length of the strip. First cut the steak crosswise into 3- to 4-inch (8 to 10 cm) sections, then slice each section thinly against those fibers at a slight angle. Cutting with the grain instead of against it is the single most common way people ruin an otherwise perfect skirt steak."},{"title":"Warm the tortillas and serve","text":"Lay the corn tortillas directly on the grill grate for 20 to 30 seconds a side until they puff slightly and smell toasty, then stack them in a clean towel so they steam themselves soft. Pile the sliced steak onto a platter and scatter over the ½ cup diced white onion and the ⅓ cup chopped cilantro, with the lime wedges around the edge. Serve immediately while the meat is hot and the tortillas are still pliable — a squeeze of lime right before eating is what ties the whole thing together."}],"tips":["No grill? A cast-iron skillet or a ridged grill pan over high heat works, but open a window and run the fan — the smoke is real.","Marinate in the morning for dinner that night. Anything longer than 8 hours and the citrus turns the surface pale and mealy.","Flank steak is the best substitute; it is thicker, so grill it 4 to 5 minutes per side to the same 125 to 130°F (52 to 54°C).","Leftovers make outstanding quesadillas and steak-and-egg breakfasts; slice only what you need and keep the rest in a whole piece so it stays juicy.","Save a few tablespoons of the marinade in a separate container before it touches the meat, then brush it on after grilling for a fresh citrus hit."],"keyTemp":"Pull skirt steak off the grill at 125 to 130°F (52 to 54°C) — a pull temperature, not a serving one. Carryover over the 8- to 10-minute rest adds about 5°F (3°C), finishing at 130 to 135°F (54 to 57°C). Do not take it past 140°F (60°C) or it will turn tough.","pairing":"Charred scallions, refried beans, and a cold Mexican lager with lime.","videoQuery":"carne asada skirt steak marinade grill","photoQuery":"carne asada skirt steak sliced tacos","tags":["Grilling","Marinade","Crowd Pleaser"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"grilled-tomahawk-ribeye","title":"Grilled Tomahawk Ribeye","emoji":"🍖","art":"steak","blurb":"A two-pound ribeye on a long rib bone, cooked low over indirect heat and then finished over the coals. It is a showpiece, and the reverse-sear method makes it far easier than it looks.","difficulty":"Medium","servings":"2 to 3 servings","prepTime":"20 min","cookTime":"1 hr 15 min","totalTime":"1 hr 50 min","ingredients":[{"group":"For the steak","items":["1 tomahawk ribeye (2 to 2½ lb / 900 g to 1.1 kg, 2 to 2½ in / 5 to 6 cm thick)","1 tbsp (15 g) kosher salt","2 tsp coarsely ground black pepper","1 tsp garlic powder","2 tsp (10 ml) neutral oil, for the sear"]},{"group":"Finishing","items":["3 tbsp (42 g) unsalted butter, softened","2 sprigs fresh rosemary","1 tsp flaky sea salt"]}],"instructions":[{"title":"Dry brine the day before","text":"Pat the tomahawk dry, season it all over with the tablespoon of kosher salt, and set it on a rack over a sheet pan in the fridge, uncovered, for 12 to 24 hours. On a steak this thick, a long dry brine is the only way to get seasoning past the surface. The exterior will look dark and slightly leathery when it is ready, which is exactly right."},{"title":"Temper and season","text":"Pull the steak out 45 minutes before cooking and let it sit at room temperature; a 2½-inch steak straight from the fridge takes forever to come up and cooks unevenly. Season with the black pepper and garlic powder just before it goes on the grill. Do not add more salt — the dry brine has already handled that."},{"title":"Set up two heat zones","text":"For charcoal, bank a full chimney of lit coals against one side of the kettle, leaving the other half empty. For gas, light only the burners on one side and leave the rest off. Close the lid and let the grill stabilize at 250°F (120°C) on the cool side, adjusting the vents until the temperature holds steady for 5 minutes."},{"title":"Cook indirect, bone toward the fire","text":"Set the steak on the cool side with the exposed rib bone pointing toward the coals, since the bone can take direct heat and the meat cannot. Close the lid and leave it alone for 40 minutes before checking anything. Every time you lift the lid you lose 5 to 10 minutes of cooking time, so be patient."},{"title":"Probe toward 115°F","text":"Start checking at 40 minutes with an instant-read thermometer pushed into the thickest part of the eye, staying at least 1 inch (2.5 cm) away from the bone, which reads falsely cool. Continue until the center hits 115°F (46°C) for medium-rare, typically 50 to 75 minutes total. If your grill drifted hotter than 250°F, it will get there considerably faster — go by temperature, never by the clock."},{"title":"Rest while you build the sear fire","text":"Take the steak off and set it on a board while you open all the vents and, for charcoal, add half a chimney of fresh lit coals. You want the direct side blazing at 550°F or hotter (290°C+). This 10-minute pause is free — the steak's temperature evens out while the fire builds."},{"title":"Oil the steak, not the grate","text":"Brush the steak lightly on both sides with the 2 tsp of neutral oil and pat off any surface moisture that has beaded up. Oiling the meat instead of the grate puts the fat exactly where the browning happens and reduces flare-ups. Have long tongs and a heatproof glove ready, because you are about to stand over a very hot fire."},{"title":"Sear over direct heat","text":"Lay the steak directly over the coals and sear 60 to 90 seconds per side, moving it to a fresh hot spot if the flames get out of control. Flip it two or three times if needed to build even color without burning. You are chasing a deep mahogany crust with dark grill marks, not a black shell."},{"title":"Sear the fat cap","text":"Stand the steak on its fat edge using the bone as a handle and hold it there for 30 to 45 seconds until the fat is golden and bubbling. Expect flare-ups here and be ready to lift it away for a second. Rendering that thick ribeye fat cap is what makes the outer edge delicious instead of chewy."},{"title":"Check the final temperature","text":"Probe the center again: 130 to 132°F (54 to 56°C) is a finished medium-rare, and 138°F (59°C) is medium. If it is still under 125°F, move it back to the cool side with the lid closed for 3 to 5 minutes rather than searing longer and burning the crust. Remember the temperature will climb another 3 to 5°F (2 to 3°C) as it rests."},{"title":"Rest, butter, and hold","text":"Move the steak to a cutting board with a groove, smear the softened butter over the top, and lay the rosemary sprigs across it. Rest 12 to 15 minutes uncovered — a steak this big holds heat easily and will still be hot when you cut it. The butter will melt down into the crust and pick up the rosemary as it goes."},{"title":"Carve off the bone and slice","text":"Run a sharp knife along the rib bone to release the entire eye of the steak in one piece, then turn it and slice across the grain into ½-inch (1 cm) strips. Fan the slices back along the bone for presentation and pour the board juices over the top. Finish with the flaky salt right before serving — it should crunch."}],"tips":["This same reverse-sear works in the oven: 250°F (120°C) until 115°F (46°C) internal, then sear in a ripping-hot cast-iron skillet 90 seconds a side.","One tomahawk feeds 2 hungry people or 3 normal ones — a lot of that dramatic weight is bone, so plan on 12 to 14 oz of actual meat per person.","Buy a leave-in probe thermometer if you cook big cuts often; opening the grill to check costs you far more than the thermometer does.","Do not trim the fat cap before cooking. Render it on the grill and trim any leftover heavy pieces after slicing.","Reheat leftovers gently in a 250°F (120°C) oven to 110°F (43°C), then flash them in a hot pan — microwaving turns great steak into gray rubber."],"keyTemp":"Pull off indirect heat at 115°F (46°C) — that is a pull temperature. The direct sear plus carryover through the 12- to 15-minute rest adds 15 to 20°F (8 to 11°C), landing at 130 to 135°F (54 to 57°C) for medium-rare. Keep the probe 1 inch away from the bone or it will read low.","pairing":"Grilled asparagus and a loaf of garlic bread, with a bold Zinfandel or Syrah.","videoQuery":"grilled tomahawk steak reverse sear charcoal","photoQuery":"grilled tomahawk ribeye sliced board","tags":["Grilling","Showstopper","Weekend"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"beef-wellington","title":"Classic Beef Wellington","emoji":"🥧","art":"roast","blurb":"Tenderloin wrapped in mushroom duxelles, prosciutto, and golden puff pastry. It is the most impressive thing in this book, and the trick is simply chilling it hard at every stage.","difficulty":"Advanced","servings":"6 servings","prepTime":"1 hr","cookTime":"1 hr 15 min","totalTime":"3 hr 50 min","ingredients":[{"group":"For the beef","items":["2 lb (900 g) center-cut beef tenderloin, trimmed, in one even log","1½ tsp (7 g) kosher salt","1 tsp freshly ground black pepper","1 tbsp (15 ml) neutral oil","2 tbsp (30 g) Dijon mustard"]},{"group":"Mushroom duxelles","items":["1½ lb (680 g) cremini mushrooms, quartered","2 shallots, roughly chopped (about ½ cup / 80 g)","3 tbsp (42 g) unsalted butter","3 sprigs fresh thyme, leaves picked","¼ cup (60 ml) dry sherry or dry white wine","1 tsp (5 g) kosher salt","½ tsp (1 g) black pepper"]},{"group":"Wrapping and finishing","items":["10 to 12 thin slices prosciutto (about 6 oz / 170 g)","1 lb (450 g) all-butter puff pastry, thawed but cold","2 tbsp (16 g) all-purpose flour, for dusting the counter","2 large egg yolks beaten with 1 tbsp (15 ml) heavy cream","1 tsp flaky sea salt, for the crust"]}],"instructions":[{"title":"Shape and tie the tenderloin","text":"Trim any silverskin off the tenderloin with a thin knife and tie it with kitchen twine at 1½-inch (4 cm) intervals so it forms an even cylinder. An even log cooks evenly and wraps neatly; a tapered one will be overcooked at the thin end. Season all over with the 1½ tsp salt and 1 tsp pepper and let it sit 20 minutes."},{"title":"Sear hard and fast","text":"Heat the oil in a large skillet over high heat until it just smokes, then sear the tenderloin on all sides, about 90 seconds per side, 6 minutes total. You are only building color and flavor here — the inside should still be completely raw. Move it to a plate, snip off the twine, and let it cool for 10 minutes."},{"title":"Paint it with mustard","text":"While the beef is still warm but no longer hot, brush the entire surface with the 2 tbsp Dijon mustard in a thin, even coat. The mustard adds a sharp backbone that cuts the richness of the pastry and prosciutto. Refrigerate the beef uncovered while you make the duxelles."},{"title":"Chop the mushrooms fine","text":"Pulse the mushrooms and shallots in a food processor in two batches, about 10 short pulses each, until they look like coarse crumbs. Do not run it continuously or you will get mushroom purée that never dries out. If you have no processor, chop by hand as finely as you have patience for — it takes about 15 minutes."},{"title":"Cook the duxelles completely dry","text":"Melt the butter in a wide skillet over medium heat, add the mushroom mixture, thyme, 1 tsp salt, and ½ tsp pepper, and cook 20 to 25 minutes, stirring often. The mushrooms will release a shocking amount of liquid, then that liquid must fully evaporate — keep going until the pan is dry and the mixture pulls away from the sides. Any remaining moisture will turn your pastry into paste, so this is the most important step in the recipe."},{"title":"Deglaze and cool the duxelles","text":"Pour in the ¼ cup sherry and cook 2 to 3 minutes more, scraping the pan, until it too has evaporated completely. Spread the duxelles on a plate or sheet pan and refrigerate until fully cold, at least 20 minutes. Warm duxelles will melt the pastry butter and soften the prosciutto, so it must be cold before it touches anything."},{"title":"Build the prosciutto blanket","text":"Lay a large sheet of plastic wrap on the counter and arrange the prosciutto slices in two overlapping rows, forming a rectangle roughly 12 by 14 inches (30 by 36 cm) — big enough to wrap the beef with a small overlap. Spread the cold duxelles over the prosciutto in an even ¼-inch (6 mm) layer, leaving a ½-inch border on the long sides. Press it down gently so it sticks."},{"title":"Roll and chill the log","text":"Set the mustard-coated beef along one long edge and use the plastic wrap to roll it up tightly, pulling the wrap taut like you are rolling sushi. Twist the ends of the plastic in opposite directions to compact it into a tight, even cylinder. Refrigerate for at least 30 minutes — this chill sets the shape and is what keeps the finished slices round instead of collapsed."},{"title":"Wrap in puff pastry","text":"Dust the counter with the 2 tbsp all-purpose flour and roll the cold puff pastry into a rectangle about 14 by 16 inches (36 by 40 cm) and ⅛ inch (3 mm) thick, working quickly so it does not warm and get sticky. Unwrap the chilled log, set it on the pastry, brush the pastry borders with egg wash, and roll it up, trimming any excess so the seam overlaps by only 1 inch. Press the seam and both ends closed, tuck the ends underneath, and set it seam-side down on a parchment-lined sheet pan."},{"title":"Chill again, then decorate","text":"Refrigerate the wrapped Wellington for 30 minutes, uncovered, so the pastry firms up completely. Brush the whole surface with egg wash, then score a shallow crosshatch or herringbone pattern with the back of a paring knife, cutting no more than 1 mm deep so you do not pierce through. Sprinkle with the flaky salt and put it back in the fridge until the oven is ready."},{"title":"Bake hot","text":"Heat the oven to 425°F (220°C) with a rack in the lower third. Bake the Wellington for 40 to 45 minutes, rotating the pan once at the 20-minute mark, until the pastry is deep golden brown and firm. Start checking the internal temperature at 35 minutes with a thermometer pushed through the end into the center of the beef."},{"title":"Pull at the right temperature","text":"Remove the Wellington when the beef center reads 125 to 128°F (52 to 53°C) for medium-rare, or 135°F (57°C) for medium. Carryover in a wrapped roast this insulated is significant — expect it to climb 8 to 10°F (4 to 6°C) while it rests. If the pastry is browning too fast before the beef is ready, tent it loosely with foil."},{"title":"Rest 15 minutes, then slice","text":"Let the Wellington rest on a cutting board for a full 15 minutes; slicing early will send pink juices flooding through the pastry. Use a long serrated knife and cut with a gentle sawing motion rather than pressing down, so the crust shatters cleanly instead of crushing. Cut into 1½-inch (4 cm) slices and serve two per person."}],"tips":["You can build the entire Wellington through the pastry wrap up to 24 hours ahead. Keep it uncovered in the fridge, egg wash and score just before baking, and add 5 minutes to the bake time.","Soggy bottom is the classic failure and it always traces back to wet duxelles. Cook them until the pan is genuinely dry — if you are unsure, cook 5 minutes more.","All-butter puff pastry is worth the extra few dollars here; shortening-based pastry bakes up pale and tastes waxy under all that beef.","A leave-in probe thermometer, inserted through the end of the log before baking, removes all the guesswork on the one dish where guessing is most expensive.","Serve with a simple red wine sauce or a spoonful of horseradish cream — the Wellington itself is rich enough that it does not need a heavy gravy."],"keyTemp":"Pull at 125 to 128°F (52 to 53°C) for medium-rare; it rises to 133 to 138°F (56 to 59°C) during the 15-minute rest. Bake at 425°F (220°C).","pairing":"Buttered green beans and a glass of Bordeaux or a good Pinot Noir.","videoQuery":"beef wellington duxelles puff pastry technique","photoQuery":"beef wellington sliced pink center","tags":["Showstopper","Holiday","Advanced"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"classic-pot-roast","title":"Classic Sunday Pot Roast","emoji":"🥘","art":"roast","blurb":"Chuck roast braised until a spoon goes through it, with carrots, potatoes, and gravy made right in the pot. It takes three hours and about twenty minutes of actual work.","difficulty":"Easy","servings":"6 servings","prepTime":"25 min","cookTime":"3 hr 30 min","totalTime":"3 hr 55 min","ingredients":[{"group":"For the roast","items":["1 boneless beef chuck roast (3½ to 4 lb / 1.6 to 1.8 kg)","1 tbsp (15 g) kosher salt","1½ tsp freshly ground black pepper","2 tbsp (30 ml) vegetable oil","2 tbsp (32 g) tomato paste","1 cup (240 ml) dry red wine such as Merlot or Cabernet","3 cups (720 ml) low-sodium beef broth","4 sprigs fresh thyme and 2 bay leaves"]},{"group":"Vegetables","items":["2 yellow onions, cut into 1-inch (2.5 cm) wedges","6 garlic cloves, peeled and smashed","3 celery stalks, cut into 2-inch (5 cm) pieces","1½ lb (680 g) carrots, peeled and cut into 2-inch (5 cm) chunks","1½ lb (680 g) baby Yukon gold potatoes, halved if large"]},{"group":"To finish","items":["2 tbsp (16 g) all-purpose flour mixed with 3 tbsp (45 ml) cold water","2 tbsp chopped fresh parsley","½ tsp kosher salt, plus more to taste"]}],"instructions":[{"title":"Salt the roast early","text":"Pat the chuck roast completely dry and season it all over with the tablespoon of kosher salt and the black pepper. If you have time, do this the night before and leave it uncovered on a rack in the fridge; even 45 minutes on the counter helps. Chuck is a thick, dense cut and salt needs time to move past the surface."},{"title":"Heat the oven and the pot","text":"Set the oven to 325°F (165°C) with a rack in the lower third. Heat the 2 tbsp oil in a 6- to 7-quart Dutch oven over medium-high heat until it shimmers and just begins to smoke. A heavy pot with a tight lid is important here — thin pots scorch and loose lids let all your braising liquid escape."},{"title":"Sear all six sides","text":"Lower the roast into the pot and sear 4 to 5 minutes per side, including the ends, until every surface is deeply browned — 15 to 20 minutes total. Do not rush this; browning is where the deep, roasty flavor of pot roast actually comes from, and pale meat makes pale, thin gravy. If the pot starts smoking hard or the bits on the bottom look black rather than brown, drop the heat a notch."},{"title":"Brown the aromatics","text":"Move the roast to a plate and pour off all but about 2 tablespoons of fat. Add the onion wedges, celery, and smashed garlic and cook 5 to 6 minutes over medium heat, stirring and scraping, until the onions have soft brown edges. The vegetables will release moisture that helps lift the fond off the bottom of the pot."},{"title":"Cook the tomato paste","text":"Push the vegetables aside, add the tomato paste to the bare spot, and cook it for 90 seconds, stirring, until it darkens from bright red to brick. Raw tomato paste tastes tinny; cooked paste tastes deep and savory. Stir it through the vegetables once it has darkened."},{"title":"Deglaze with wine","text":"Pour in the cup of red wine and scrape the bottom of the pot hard with a wooden spoon until nothing is stuck. Let it bubble and reduce by half, about 4 minutes, so the raw alcohol edge cooks off. Everything you scrape up now becomes gravy later."},{"title":"Add broth and braise","text":"Return the roast and any accumulated juices to the pot, add the 3 cups beef broth, and tuck in the thyme sprigs and bay leaves. The liquid should come about two-thirds of the way up the roast, not cover it — pot roast is a braise, not a boil. Bring it to a bare simmer on the stove, then cover and move it to the oven."},{"title":"Cook low for 2½ hours","text":"Braise for 2½ hours, flipping the roast once at the halfway point so both halves spend time submerged. Keep the lid on the whole time otherwise; every peek drops the pot temperature. The kitchen will start smelling right after about an hour, which is a good sign but not a doneness cue."},{"title":"Add the root vegetables","text":"After 2½ hours, add the carrots and potatoes, nestling them into the liquid around the roast. Cover and return to the oven for 45 to 60 minutes more, until the vegetables are tender when pierced with a paring knife. Adding them late is the difference between vegetables with texture and vegetables that have dissolved into the sauce."},{"title":"Test for fork-tender","text":"The roast is done when a fork slides in and twists with almost no resistance and the internal temperature reads 200 to 205°F (93 to 96°C). This is far above any steak temperature and that is the point — at this heat the collagen has melted into gelatin. If it still fights the fork, give it another 30 minutes; undercooked chuck is tough, not rare."},{"title":"Rest and make the gravy","text":"Move the roast and vegetables to a platter and tent with foil. Skim the fat off the top of the braising liquid with a wide spoon, bring it to a simmer on the stove, and whisk in the flour-and-water slurry. Simmer 3 to 5 minutes until it thickens enough to coat a spoon, then taste and add the ½ tsp salt as needed."},{"title":"Pull apart and serve","text":"Pull the roast into large chunks with two forks, following the natural seams, and discard any big pockets of hard fat. Arrange the meat and vegetables on the platter, ladle the gravy generously over everything, and scatter the parsley on top. Serve straight from the platter with the rest of the gravy on the side."}],"tips":["Pot roast is better on day two. Cool it in its liquid, refrigerate overnight, lift off the solid fat cap, and reheat gently at 300°F (150°C) for 45 minutes.","Chuck roast is the right cut — it has the connective tissue that melts into richness. Round or sirloin roasts will come out dry and stringy no matter how long you cook them.","No wine? Use an extra cup of beef broth plus 1 tbsp balsamic vinegar or Worcestershire for depth.","If it is tough after 3 hours, it is undercooked, not overcooked. Put the lid back on and keep going — chuck needs to pass 200°F (93°C) to give up.","This works in a slow cooker too: sear on the stove first, then 8 hours on low, adding the potatoes and carrots in the last 2 hours."],"keyTemp":"Braise at 325°F (165°C) until the roast reads 200 to 205°F (93 to 96°C) and shreds with a fork. Anything under 195°F (90°C) will still be tough.","pairing":"Crusty bread for the gravy and a simple green salad, with a glass of Merlot.","videoQuery":"classic pot roast dutch oven recipe","photoQuery":"pot roast carrots potatoes gravy","tags":["Comfort Food","Sunday Dinner","One Pot"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"red-wine-braised-short-ribs","title":"Red Wine Braised Short Ribs","emoji":"🍲","art":"ribs","blurb":"Bone-in short ribs braised in a whole bottle of red until the meat slumps off the bone. The sauce reduces down into something dark and glossy that tastes like a restaurant made it.","difficulty":"Medium","servings":"4 to 6 servings","prepTime":"30 min","cookTime":"3 hr 15 min","totalTime":"3 hr 45 min","ingredients":[{"group":"For the ribs","items":["5 lb (2.3 kg) bone-in English-cut beef short ribs, cut into 3-inch (8 cm) pieces","1 tbsp (15 g) kosher salt","1½ tsp freshly ground black pepper","3 tbsp (45 ml) vegetable oil","¼ cup (32 g) all-purpose flour, for dredging"]},{"group":"Braising liquid","items":["2 yellow onions, diced (about 3 cups / 400 g)","3 carrots, diced (about 1½ cups / 200 g)","3 celery stalks, diced (about 1 cup / 130 g)","6 garlic cloves, smashed","3 tbsp (48 g) tomato paste","1 bottle (750 ml) dry red wine such as Cabernet Sauvignon or Syrah","3 cups (720 ml) low-sodium beef stock","6 sprigs fresh thyme, 2 bay leaves, and 4 sprigs parsley, tied together"]},{"group":"To finish","items":["1 tbsp (15 ml) red wine vinegar","2 tbsp (28 g) cold unsalted butter","½ tsp flaky sea salt, plus more to taste"]}],"instructions":[{"title":"Salt the ribs ahead","text":"Pat the short ribs dry and season them all over with the tablespoon of kosher salt and the black pepper. Refrigerate uncovered on a rack for 8 to 24 hours if you can, or at minimum leave them at room temperature for 45 minutes. Short ribs are thick and heavily marbled, and early salting is what gets seasoning into the middle."},{"title":"Dredge lightly in flour","text":"Just before searing, roll each rib in the ¼ cup flour and shake off the excess so only a thin dusting remains. The flour helps build a deeper crust and slightly thickens the finished sauce. Do not do this ahead — sitting flour turns gummy and will not brown properly."},{"title":"Sear in batches","text":"Heat the oil in a 7-quart Dutch oven over medium-high until shimmering, then sear the ribs in two or three batches, 2 to 3 minutes per side, until every side is deep brown. Never crowd the pot; ribs packed together drop the temperature and steam instead of searing. Move each finished batch to a plate and expect the whole process to take 20 minutes."},{"title":"Heat the oven and cook the vegetables","text":"Set the oven to 325°F (165°C). Pour off all but 3 tablespoons of fat, add the onions, carrots, celery, and garlic to the pot, and cook over medium heat for 8 to 10 minutes until softened and lightly browned at the edges. Scrape the bottom as they release moisture — the fond lifting off is exactly what you want."},{"title":"Darken the tomato paste","text":"Stir in the 3 tbsp tomato paste and cook for 2 minutes, spreading it across the bottom of the pot so it toasts. It should go from bright red to a deep brick color and smell sweet rather than raw. This small step adds a surprising amount of body to the finished sauce."},{"title":"Reduce the wine hard","text":"Pour in the entire bottle of red wine and bring it to a strong simmer, scraping the bottom clean. Reduce it by about half, 12 to 15 minutes, until the harsh alcohol smell is gone and the liquid smells like fruit and wood. Skipping this reduction is the reason home braises sometimes taste sour and thin."},{"title":"Add the ribs and stock","text":"Return the ribs and any juices to the pot, bone-side up, and add the 3 cups beef stock and the tied herb bundle. The liquid should come about three-quarters of the way up the meat; add a splash more stock if needed but do not submerge them. Bring everything to a bare simmer on the stovetop."},{"title":"Braise covered for 2½ hours","text":"Cover with a tight lid and transfer to the 325°F (165°C) oven for 2½ to 3 hours. Check once at the 2-hour mark and add a little water if the level has dropped below halfway up the ribs. The liquid should be barely burbling when you peek, not boiling — if it is boiling, lower the oven by 25°F."},{"title":"Test for doneness","text":"The ribs are ready when the meat has pulled back from the bone by about ½ inch (1 cm) and a fork twists in it with no resistance, around 200 to 205
