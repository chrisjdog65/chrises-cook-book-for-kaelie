 flicked onto the surface skitters and vanishes instantly rather than sitting and boiling. A thin or lightweight pan will not hold enough heat and the fish will steam instead of blacken."},{"title":"Butter the fish, not the pan","text":"Dip each fillet in the 6 tbsp melted butter, coating both sides completely and letting the excess drip back into the bowl. The butter carries the spices onto the fish and its milk solids are what blacken in the pan. Do not add oil or butter directly to the skillet — it will scorch and smoke before the fish goes in."},{"title":"Coat heavily with the spices","text":"Press each buttered fillet into the spice mixture on both sides, pressing firmly so a thick, even coat sticks — you want the fish fully covered, not dusted. Use all the seasoning across the four fillets; a thin coat gives you a spicy fish instead of a proper crust. Set them on a plate ready to go, because from here it moves quickly."},{"title":"Lay the fillets down","text":"Set the fillets in the dry hot skillet away from you, leaving 1 in (2.5 cm) between them, and do not touch them for 2 to 3 minutes. The pan will smoke heavily and the sound should be a loud, constant sizzle. Cook in two batches if all four will not fit with space — crowding drops the heat and you lose the crust."},{"title":"Flip once","text":"Slide a thin metal spatula under a fillet and lift a corner to look: the crust should be deep mahogany brown with black flecks, not gray and not uniformly charcoal. Flip and cook the second side 2 to 3 minutes more. Mahi at 3/4 in (2 cm) thick needs about 5 minutes total, so resist the urge to keep flipping and checking."},{"title":"Check doneness","text":"The fish is done at 145°F (63°C) at the thickest point, or when a fork twisted into the center flakes the meat cleanly and it is opaque throughout. Mahi is lean and firm and turns dry and cottony if you push much past that. If a fillet is thicker than the rest, move it to a 400°F (205°C) oven for 2 to 3 minutes rather than leaving it in the pan."},{"title":"Finish with butter and lemon","text":"Move the fillets to warm plates and top each with a small knob of the remaining 2 tbsp butter so it melts into the crust. Scatter the parsley over the top and serve with lemon wedges. The cold butter and the squeeze of lemon tame the cayenne and turn the spice crust into a sauce."},{"title":"Clean the pan while it is hot","text":"Carefully pour off any burnt spice, run the still-warm skillet under hot water, and scrub with a stiff brush or chain mail — no soap needed on well-seasoned cast iron. Dry it on the burner over low heat for 2 minutes and wipe with a teaspoon of oil. Blackening leaves behind carbon that is far harder to remove once it cools and sets."}],"tips":["Redfish is the original for this dish and works exactly the same way. Snapper, grouper, and catfish take the same seasoning and the same 5 minutes total. Chicken breast pounded to 1/2 in (1.3 cm) also blackens beautifully, but it is a different food-safety rule: give it 4 to 5 minutes per side and cook it all the way to 165°F (74°C) in the center.","Cut the cayenne to 1/4 tsp for a milder crust — you will still get all the color and the toasted-spice flavor, just less heat.","The spice blend keeps for 6 months in a sealed jar. Make a triple batch now and you are ten minutes from dinner any night.","Do not use a nonstick pan for this. The temperatures involved are above what nonstick coatings are rated for and they break down.","Serve with something cool and creamy — a slaw, a rice pilaf, or a spoonful of sour cream — to balance the heat."],"keyTemp":"Cook to 145°F (63°C) at the thickest point; the fish should flake with a fork and be opaque all the way through.","pairing":"An ice-cold light beer or a citrusy Sauvignon Blanc, with dirty rice and a crunchy slaw.","videoQuery":"blackened mahi mahi cast iron recipe","photoQuery":"blackened mahi mahi fillet lemon","tags":["30 Minutes","Cast Iron","Spicy"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"low-country-shrimp-boil","title":"Low Country Shrimp Boil","emoji":"🌽","art":"shrimp","blurb":"Shrimp, sausage, corn, and potatoes cooked in one seasoned pot and dumped straight onto a newspaper-covered table. It is less a recipe than a way to feed people you like.","difficulty":"Medium","servings":"6 servings","prepTime":"20 min","cookTime":"50 min","totalTime":"1 hr 10 min","ingredients":[{"group":"The pot","items":["4 qt (3.8 L) water","1 bottle (12 oz / 355 ml) light lager beer, optional","1/2 cup (60 g) Old Bay seasoning, plus 2 tbsp for finishing","1/4 cup (72 g) kosher salt","2 lemons (about 8 oz / 225 g total), halved","1 head garlic, halved crosswise","1 large yellow onion (about 10 oz / 280 g), quartered","3 bay leaves"]},{"group":"The food","items":["1 1/2 lb (680 g) small red potatoes, about 1 1/2 in (4 cm) across","1 lb (450 g) smoked andouille or kielbasa, cut into 2 in (5 cm) lengths","4 ears fresh corn, husked and halved","2 lb (900 g) large shell-on shrimp (16-20 count), deveined if you like"]},{"group":"To serve","items":["8 tbsp (115 g) unsalted butter, melted","1 lemon (about 4 oz / 115 g), cut into wedges","1/4 cup (10 g) chopped fresh parsley","1/2 cup (120 ml) cocktail sauce"]}],"instructions":[{"title":"Build the seasoned broth","text":"Combine the 4 qt water, the beer if using, 1/2 cup Old Bay, 1/4 cup kosher salt, the halved lemons squeezed in and dropped in, the garlic head, quartered onion, and bay leaves in a 12 qt (11 L) stockpot. Bring it to a rolling boil over high heat, which takes about 15 minutes. The water should taste aggressively seasoned, almost too salty to drink — this is the only chance you have to season the food from the inside."},{"title":"Let it steep","text":"Once it hits a boil, drop to a strong simmer and let the aromatics steep for 10 minutes before any food goes in. Old Bay dumped in at the last minute sits on the surface instead of flavoring anything. You will smell it fill the kitchen when it is ready."},{"title":"Start the potatoes","text":"Add the 1 1/2 lb red potatoes and return to a boil, then cook 12 to 15 minutes. They are the longest cooking item, so they go first and everything else is timed off them. Test with a paring knife — it should slide into the center with only slight resistance, since they will keep cooking in the residual heat."},{"title":"Add the sausage","text":"Add the 1 lb of andouille and cook 5 minutes. The sausage is already cooked, so this is about warming it through and letting its smoky paprika-heavy fat bleed into the broth, which seasons everything that follows. Keep the pot at a steady boil the whole time."},{"title":"Add the corn","text":"Add the 8 half-ears of corn and cook 5 minutes more. Fresh summer corn is sweet enough to eat raw and only needs to be heated through. If you press a kernel with your thumbnail it should burst with milky juice rather than feeling starchy."},{"title":"Kill the heat before the shrimp","text":"Turn the burner completely off, then add the 2 lb of shrimp and stir once to submerge them. This is the most important step in the recipe. Shrimp cook in 2 to 3 minutes in water that is off the boil, and if you leave the flame on you will have rubber before you can drain the pot."},{"title":"Watch the shrimp closely","text":"Cover the pot and let the shrimp sit for 2 to 3 minutes, checking at 2. They are done when the shells have turned coral pink, the flesh at the thick end is opaque, and they have curled into a loose C. Pull one out and cut into it if you are unsure — an extra 30 seconds of watching beats two pounds of overcooked shrimp."},{"title":"Drain immediately","text":"Set a large colander in the sink or use a spider strainer and get everything out of the water the second the shrimp are done. Residual heat in 4 quarts of hot broth will keep cooking the shrimp for several minutes. Discard the lemon halves, onion, garlic, and bay leaves as you go."},{"title":"Season and toss","text":"Dump everything into a very large bowl or straight onto a table lined with newspaper or parchment. Drizzle with the 8 tbsp melted butter, sprinkle the remaining 2 tbsp Old Bay over the top, and scatter the parsley. Toss gently with your hands or two spoons so the butter and seasoning coat everything."},{"title":"Serve family style","text":"Put out lemon wedges, cocktail sauce, extra melted butter for dipping, plenty of paper towels, and a bowl for the shells. Serve while everything is still hot, with cold beer and no plates if you are doing it right. Eating with your hands over a covered table is the entire tradition here."},{"title":"Save the broth","text":"Strain and cool the leftover cooking liquid, then freeze it in quart containers for up to 3 months. It makes a superb base for gumbo, shrimp and grits, or the cioppino in this chapter. Cool it in a shallow pan first so it drops below 40°F (4°C) within two hours."}],"tips":["Shell-on shrimp are worth the mess. The shells protect the meat from the hot water and add real flavor to the broth as everything cooks.","Scale by the pot: figure roughly 1/3 lb (150 g) shrimp, 1/4 lb (115 g) sausage, 1 half-ear of corn, and 4 oz (115 g) potatoes per person.","If your potatoes are bigger than 2 in (5 cm), halve them so they cook in the same 15 minutes. Mismatched sizes are the usual reason something comes out raw in the middle.","Add 2 lb (900 g) of live crawfish or snow crab clusters with the corn for a bigger spread — they need about 5 minutes.","Everything can be prepped hours ahead. Potatoes scrubbed, sausage cut, corn husked, shrimp in a bowl on ice, and the pot goes from cold water to table in about 50 minutes."],"keyTemp":"Shrimp are done at 145°F (63°C) — pink shells, opaque flesh, loose C shape. The smoked sausage is already fully cooked and only needs to be reheated to 165°F (74°C), which the boiling broth does in a couple of minutes. Potatoes should offer no resistance to a paring knife.","pairing":"Cold light beer or sweet tea, with plenty of paper towels and nothing else on the table.","videoQuery":"low country boil shrimp sausage corn potatoes","photoQuery":"low country shrimp boil table","tags":["Crowd Pleaser","One Pot","Summer"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"mussels-white-wine-garlic","title":"Mussels in White Wine and Garlic","emoji":"🦪","art":"soup","blurb":"Moules mariniere the way a bistro does it — shallots, wine, butter, and a pile of shells over a broth you will fight over. Twenty minutes, and cheaper than almost anything else in this chapter.","difficulty":"Easy","servings":"2 servings as a main, 4 as a starter","prepTime":"15 min","cookTime":"10 min","totalTime":"25 min","ingredients":[{"group":"Ingredients","items":["4 lb (1.8 kg) live mussels, preferably farmed rope-grown","3 tbsp (45 g) unsalted butter","2 large shallots (about 4 oz / 115 g), finely diced","6 garlic cloves, thinly sliced","1/2 tsp kosher salt","1/4 tsp red pepper flakes","1 1/2 cups (360 ml) dry white wine such as Muscadet or Sauvignon Blanc","2 sprigs fresh thyme","1/2 cup (120 ml) heavy cream, optional","1/2 cup (20 g) chopped fresh flat-leaf parsley","1 lemon (about 4 oz / 115 g), cut into wedges","1 baguette (about 12 oz / 340 g), sliced thick and toasted"]}],"instructions":[{"title":"Keep them alive until you cook","text":"Mussels are sold alive and must stay that way until they hit the pot. Store them in the fridge in a bowl covered with a damp towel, never sealed in a plastic bag or sitting in fresh water, both of which suffocate them. Cook them the day you buy them, or the next day at the latest."},{"title":"Sort and tap test","text":"Tip the mussels into a colander and look them over. Any shell that is cracked or crushed goes in the trash. Any that is gaping open, tap firmly on the counter — a live mussel will slowly draw its shell closed within 30 seconds, and one that stays open is dead and gets thrown out. This takes five minutes and it is the whole safety step for this dish."},{"title":"Scrub and debeard","text":"Rinse the mussels under cold running water, scrubbing away any grit or barnacles with a stiff brush. If you see a fibrous tuft poking out of the shell, grip it and pull firmly toward the hinge end of the shell to tear it free. Farmed mussels usually need very little of this, but wild ones can be beardy — and debearding kills the mussel, so do it right before cooking."},{"title":"Get everything ready","text":"Dice the shallots, slice the garlic, chop the parsley, and pour the wine before you turn on a burner. This recipe cooks in under ten minutes with no downtime once it starts. Toast the baguette slices now too, under the broiler for 2 minutes a side."},{"title":"Sweat the shallots","text":"Melt the 3 tbsp butter in a wide 6 qt (5.7 L) Dutch oven or pot with a tight lid over medium heat. Add the shallots and the 1/2 tsp salt and cook 3 to 4 minutes, stirring, until soft and translucent but with no color. You want them sweet and melting, not browned — browned shallots make the broth taste heavy."},{"title":"Add garlic and chile","text":"Add the sliced garlic and 1/4 tsp red pepper flakes and cook just 60 seconds more, stirring constantly, until the garlic smells sweet and is barely blonde. Garlic burns in seconds at this heat and bitter garlic will ruin an entire pot of broth. Have the wine in your other hand."},{"title":"Reduce the wine","text":"Pour in the 1 1/2 cups white wine, add the thyme sprigs, raise the heat to high, and boil hard for 2 minutes. This burns off the raw alcohol bite and concentrates the wine so the finished broth tastes round rather than sharp. Scrape the bottom of the pot as it bubbles."},{"title":"Steam the mussels","text":"Add all the mussels at once, clamp the lid on tight, and cook over high heat for 5 to 7 minutes, shaking the pot firmly by the handles once or twice to redistribute them. The mussels on the bottom cook first, so this shake matters. Do not lift the lid before 4 minutes — you need the trapped steam."},{"title":"Check that they have opened","text":"Lift the lid: nearly all the shells should be wide open with plump orange or cream-colored meat inside. If a third of them are still shut, cover and cook 2 minutes more. Throw away any mussel that is still tightly closed after the rest have opened — it was almost certainly dead before it went in."},{"title":"Finish the broth","text":"Use a slotted spoon or tongs to pile the mussels into warm serving bowls. If you want a richer broth, stir the 1/2 cup cream into the liquid left in the pot and simmer 1 minute. Taste it — if it is gritty, pour it through a fine strainer, leaving the last tablespoon of sand behind in the pot."},{"title":"Pour and serve","text":"Stir the 1/2 cup parsley into the broth and ladle it generously over the mussels, then serve immediately with lemon wedges, toasted baguette, and an empty bowl for shells. Eat them the traditional way: use the first empty shell as a pincer to pull the rest of the meat out. Dunk the bread until the broth is gone."}],"tips":["Buy about 1 lb (450 g) of mussels per person for a starter and 2 lb (900 g) for a main. They are mostly shell, and they are usually the cheapest shellfish at the counter.","The old rule about discarding unopened mussels is worth following. A stubborn one can occasionally just be a strong hinge, but it is not worth the gamble.","Swap the wine for 1 1/2 cups (360 ml) of light beer for a Belgian version, or use dry hard cider with the cream for a Normandy spin.","Add 1/2 lb (225 g) of littleneck clams with the mussels if you like, but give them a 3 minute head start since they take longer to open.","Leftover broth freezes well and is a beautiful base for a seafood pasta sauce or a quick chowder."],"keyTemp":"No thermometer here — mussels are done when the shells open wide, in 5 to 7 minutes. Discard any that stay tightly shut.","pairing":"The same crisp dry white you cooked with, and hot salted fries if you want the full bistro treatment.","videoQuery":"moules mariniere mussels white wine garlic","photoQuery":"mussels white wine broth bowl","tags":["30 Minutes","Budget","Date Night"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"sesame-crusted-seared-ahi-tuna","title":"Sesame-Crusted Seared Ahi Tuna","emoji":"🍣","art":"fish","blurb":"Ninety seconds a side, a toasted sesame shell, and a cool ruby center. The cooking is the easy part — buying the right piece of tuna is what makes it.","difficulty":"Medium","servings":"2 servings","prepTime":"15 min","cookTime":"5 min","totalTime":"20 min","ingredients":[{"group":"For the tuna","items":["2 sashimi-grade ahi tuna steaks, 6-8 oz (170-225 g) each, 1 1/4 in (3 cm) thick","1 tsp kosher salt","1/2 tsp freshly ground black pepper","2 tbsp (18 g) white sesame seeds","2 tbsp (18 g) black sesame seeds","1 tbsp (15 ml) grapeseed or avocado oil"]},{"group":"Soy ginger dipping sauce","items":["3 tbsp (45 ml) soy sauce or tamari","1 tbsp (15 ml) rice vinegar","2 tsp (10 ml) toasted sesame oil","1 tsp (5 ml) honey","1 tsp (3 g) finely grated fresh ginger","1 scallion, thinly sliced","1/2 tsp wasabi paste, optional"]}],"instructions":[{"title":"Buy tuna you would eat raw","text":"Ask specifically for sashimi-grade or sushi-grade ahi, which means it was handled and frozen to a standard that makes it safe to eat rare. It should be deep ruby to rose, translucent and glossy, with no brown edges, rainbow sheen, or sour smell. If the fishmonger hesitates when you ask whether it can be eaten rare, cook the steaks all the way to 145°F (63°C) instead."},{"title":"Make the dipping sauce","text":"Whisk the 3 tbsp soy sauce, 1 tbsp rice vinegar, 2 tsp sesame oil, honey, and grated ginger together in a small bowl until the honey dissolves. Stir in the sliced scallion and the wasabi if you are using it. Make this first and let it sit for at least 10 minutes so the ginger has time to bloom into the soy."},{"title":"Bring the tuna to temperature","text":"Take the steaks out of the fridge 15 minutes before cooking and blot them completely dry on all sides with paper towels. A fridge-cold steak will still be icy in the center after 90 seconds a side, and surface moisture will steam the sesame seeds instead of toasting them. They should feel dry and tacky."},{"title":"Season the fish","text":"Season the steaks all over with the 1 tsp kosher salt and 1/2 tsp black pepper, including the sides. Season a little more generously than feels natural — only a thin outer layer gets cooked and seasoned, and the raw interior stays bare. The salt also helps the sesame seeds stick."},{"title":"Coat in sesame seeds","text":"Mix the white and black sesame seeds on a plate and press each steak firmly into them, rolling to cover all four faces and both flat sides. Press hard enough that the seeds embed rather than just resting on the surface. A complete, even coat is what gives you that clean striped crust when you slice it."},{"title":"Heat the pan hard","text":"Set a heavy 10 in (25 cm) skillet over high heat for 2 to 3 minutes, then add the 1 tbsp grapeseed oil and swirl. You want the oil shimmering with the first thread of smoke — this is one of the few times you genuinely want the pan that hot. A cool pan means the heat creeps deep into the steak before the crust forms and you lose the rare center."},{"title":"Sear the first side","text":"Lay the steaks in the pan away from you and do not move them for 60 to 90 seconds. Listen for a sharp, loud sizzle from the moment they touch down. Watch the side of the steak: you want the pale cooked band to come no more than 1/4 in (6 mm) up from the bottom."},{"title":"Sear the second side and edges","text":"Flip and sear the second side another 60 to 90 seconds. Then use tongs to stand each steak on its edges, rolling it for about 15 seconds per edge to toast the sesame all the way around. The whole steak should be in the pan for no more than 3 to 3 1/2 minutes."},{"title":"Rest very briefly","text":"Move the steaks to a cutting board and let them sit for exactly 2 minutes, no longer and no foil. This lets the seared exterior stop cooking inward. Rest it too long and the residual heat will creep further into the center, turning your rare tuna gray and chalky."},{"title":"Slice against the grain","text":"Look for the faint lines running through the steak and slice across them with a very sharp knife, cutting pieces about 1/4 in (6 mm) thick in single confident strokes. A sawing motion tears the delicate flesh and drags sesame seeds through the ruby center. Wipe the blade between cuts for clean slices."},{"title":"Plate and serve cold-center","text":"Fan the slices on chilled plates so the outer 1/4 in ring of pale cooked fish frames the deep red center, and pour the dipping sauce into small bowls alongside. Serve right away while the crust is warm and the middle is still cool. Sliced tuna dries out fast, so slice at the table if you can."}],"tips":["Rare tuna is raw in the center. Anyone pregnant, very young, elderly, or immunocompromised should have the steaks cooked through to 145°F (63°C), which takes about 4 minutes per side.","Frozen-at-sea tuna is often a safer and better buy than fresh at the counter. Thaw it overnight in the fridge, still sealed, then dry it very well.","Serve with a cucumber salad, sushi rice, or a pile of dressed greens. Avocado and pickled ginger both belong on the plate.","If your steaks are only 3/4 in (2 cm) thick, cut the sear to 45 seconds a side or you will cook right through the middle.","Leftovers do not reheat. Slice them cold into a salad or a rice bowl the next day instead."],"keyTemp":"Rare center reads about 110°F (43°C) with a 1/4 in cooked band; the FDA fully-cooked guideline for fish is 145°F (63°C). Use sashimi-grade tuna if serving rare.","pairing":"Chilled sake, a dry Riesling, or a cold lager, with steamed rice and cucumber salad.","videoQuery":"sesame crusted seared ahi tuna steak","photoQuery":"seared ahi tuna sliced sesame crust","tags":["30 Minutes","Date Night","No Cook Center"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"beer-battered-fish-and-chips","title":"Beer-Battered Fish and Chips","emoji":"🍟","art":"fish","blurb":"Shatteringly crisp battered cod and proper double-fried chips, the way a good chippy in England does it. It is a project, but the payoff is fish you cannot get from a restaurant near you.","difficulty":"Advanced","servings":"4 servings","prepTime":"30 min","cookTime":"45 min","totalTime":"1 hr 45 min (includes 30 min potato soak)","ingredients":[{"group":"For the chips","items":["2 1/2 lb (1.1 kg) russet potatoes, peeled and cut into 1/2 in (1.3 cm) batons","2 qt (2 L) peanut, canola, or vegetable oil, for frying","1 tbsp (18 g) kosher salt, for finishing","1 tbsp (18 g) fine sea salt, for the soaking water"]},{"group":"For the fish and batter","items":["2 lb (900 g) skinless cod or haddock loin, cut into 4 equal pieces about 8 oz (225 g) each","1 1/2 cups (180 g) all-purpose flour, plus 1/2 cup (60 g) for dredging","1/2 cup (60 g) cornstarch","1 tsp baking powder","1 1/2 tsp kosher salt","1/2 tsp freshly ground black pepper","12 oz (355 ml) very cold lager or pale ale"]},{"group":"Tartar sauce and serving","items":["1 cup (220 g) mayonnaise","3 tbsp (30 g) minced dill pickle or cornichons","1 tbsp (10 g) minced shallot","1 tbsp (15 ml) fresh lemon juice","1 tbsp (4 g) chopped fresh dill","2 tsp (10 g) capers, minced","1 lemon (about 4 oz / 115 g), cut into wedges","2 tbsp (30 ml) malt vinegar, for sprinkling"]}],"instructions":[{"title":"Soak the potatoes","text":"Cut the potatoes into even 1/2 in (1.3 cm) batons and drop them straight into a bowl of cold water with the 1 tbsp fine sea salt as you go. Soak at least 30 minutes, or up to overnight in the fridge, then change the water once if it looks cloudy. This rinses off surface starch that would otherwise make the chips gummy and cause them to stick together in the fryer."},{"title":"Make the tartar sauce","text":"Stir the 1 cup mayonnaise, pickles, shallot, 1 tbsp lemon juice, dill, and capers together and refrigerate for at least 30 minutes. Made ahead, the pickle and shallot flavors spread through the mayonnaise instead of sitting in it as separate bites. It keeps a week in the fridge."},{"title":"Dry the fish and the potatoes","text":"Drain the potatoes and dry them thoroughly in a clean towel — genuinely dry, because water and 350°F (175°C) oil react violently. Blot the cod pieces on all sides with paper towels and check for stray bones. Any moisture on the fish will make the batter slide off in the fryer."},{"title":"Set up the fry station","text":"Pour the 2 qt oil into a heavy 6 qt (5.7 L) Dutch oven — it should come no more than a third of the way up the sides, leaving room for the bubbling. Clip on a deep-fry thermometer and set two wire racks over sheet pans nearby, plus a spider strainer and tongs. Never fill a pot more than a third full with oil, and never leave hot oil unattended."},{"title":"Blanch the chips at low heat","text":"Heat the oil to 325°F (163°C) and fry the potatoes in two batches for 5 to 6 minutes each, until they are soft and floppy but still pale blond with no browning. This first fry cooks the interior through and drives out water. Lift them onto a rack and let them cool for at least 20 minutes — they can sit for up to 2 hours."},{"title":"Mix the batter cold and late","text":"Whisk the 1 1/2 cups flour, cornstarch, baking powder, 1 1/2 tsp salt, and 1/2 tsp pepper in a bowl, then pour in the very cold beer and stir with chopsticks or a fork just until it comes together with a few small lumps. It should be the consistency of thin pancake batter and coat a spoon in a thin veil that you can just see the metal through; if it feels like paste, splash in another 1 to 2 tbsp (15-30 ml) of cold beer. Do not whisk it smooth — overmixing builds gluten and gives you a tough, bready crust instead of a shattering one."},{"title":"Dredge the fish","text":"Put the extra 1/2 cup flour in a shallow dish and toss each piece of cod in it, patting off all the excess so only a fine haze remains. The dry flour gives the wet batter something to grip. Skipping this is the number one reason batter slides off in the oil."},{"title":"Bring the oil to frying temperature","text":"Raise the oil to 375°F (190°C) for the fish. Too cool and the batter absorbs oil and goes greasy; too hot and the crust darkens before the fish is cooked through. Keep the thermometer in and adjust the burner between batches, since dropping cold food in will pull the temperature down 25 to 50 degrees."},{"title":"Fry the fish two pieces at a time","text":"Dip a floured piece of cod into the batter, let the excess run off for 3 seconds, then lower it into the oil, holding the end for a couple of seconds before releasing so it sets and does not sink and stick. Fry 2 pieces at a time — two batches for the four pieces — for 6 to 8 minutes, turning once halfway, until deep golden and crisp. An 8 oz (225 g) loin piece is thick, so give it the full time rather than pulling it at first color. Drain on a wire rack, never on paper towels, which steam the bottom soft."},{"title":"Check the fish temperature","text":"Slide a thermometer into the thickest part of a fried piece; it should read 145°F (63°C) and the fish should flake into big white curds when you nudge it with a fork. Keep finished pieces warm on a rack in a 200°F (95°C) oven while you fry the rest, up to 20 minutes. Between batches, skim out any loose bits of batter, which burn and taste bitter."},{"title":"Fry the chips again","text":"Bring the oil back to 375°F (190°C) and fry the blanched potatoes in two batches for 3 to 4 minutes each, until deep golden and audibly crisp when you shake the strainer. The second fry sets a hard, glassy shell around the fluffy interior. Salt them with the 1 tbsp kosher salt the second they come out, while the surface oil can still hold it."},{"title":"Serve immediately","text":"Pile the fish and chips on a paper-lined tray or plates, sprinkle the malt vinegar over the chips, and serve with the tartar sauce and lemon wedges. This is food with a ten-minute window before the crust starts to soften. Have everyone at the table before the last batch comes out."}],"tips":["Cod and haddock are the classics. Pollock and hake are cheaper and work well; avoid thin, delicate fish like sole, which falls apart in the batter.","Keep the beer in the fridge until the second you pour it. Cold batter hitting hot oil creates a bigger steam burst, which is what makes the crust light and full of bubbles.","Substitute cold club soda or sparkling water for the beer if you want it alcohol free — you lose a little flavor but the texture is nearly identical.","The blanched chips can be fried, cooled, and refrigerated a day ahead, or frozen on a sheet pan and fried straight from frozen. This turns a project into a weeknight.","Let the oil cool completely, strain it through a coffee filter into a jar, and it is good for two or three more fries."],"keyTemp":"Fry oil at 325°F (163°C) for the first chip fry and 375°F (190°C) for the fish and the second chip fry. Fish is done at 145°F (63°C) and flakes cleanly.","pairing":"A pint of the same lager you used in the batter, with mushy peas and a lot of malt vinegar.","videoQuery":"beer battered fish and chips crispy recipe","photoQuery":"beer battered fish and chips basket","tags":["Weekend Project","Fried","Classic"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"baked-cod-with-lemon-butter","title":"Baked Cod with Lemon Butter","emoji":"🍋","art":"fish","blurb":"Thick cod loin baked in a lemon-garlic butter that turns into its own sauce in the pan. This is the quiet Tuesday dinner that tastes like you tried much harder than you did.","difficulty":"Easy","servings":"4 servings","prepTime":"10 min","cookTime":"15 min","totalTime":"25 min","ingredients":[{"group":"For the fish","items":["4 skinless cod loin fillets, 6 oz (170 g) each, about 1 1/4 in (3 cm) thick","1 tsp kosher salt","1/2 tsp freshly ground black pepper","1/4 tsp sweet paprika"]},{"group":"Lemon butter","items":["5 tbsp (70 g) unsalted butter, melted","4 garlic cloves, minced","3 tbsp (45 ml) fresh lemon juice, plus 1 tsp finely grated zest","2 tbsp (18 g) capers, drained, optional","3 tbsp (12 g) chopped fresh flat-leaf parsley","1/2 cup (25 g) panko breadcrumbs, optional","1 lemon (about 4 oz / 115 g), thinly sliced"]}],"instructions":[{"title":"Heat the oven and the dish","text":"Position a rack in the upper third of the oven and preheat to 400°F (205°C), giving it a full 15 minutes to come up to temperature. Ovens routinely read hot or cold by 25 degrees, so an oven thermometer is worth the six dollars. A hot oven cooks cod fast enough that it stays juicy rather than slowly weeping liquid into the dish."},{"title":"Dry and inspect the cod","text":"Pat the fillets completely dry on both sides with paper towels and run a finger over each one, feeling for pin bones or bits of skin. Look for loin cuts — the thick, even front section — rather than the thin tail end, which overcooks in half the time. Frozen-at-sea cod is often the best quality available and should be thawed overnight in the fridge, then dried very well."},{"title":"Season the fish","text":"Season both sides with the 1 tsp kosher salt, 1/2 tsp pepper, and 1/4 tsp paprika. Let the fillets sit for 10 minutes at room temperature while you make the butter. The paprika is mostly for color, since a baked white fish comes out pale without a little help."},{"title":"Mix the lemon butter","text":"Stir the 5 tbsp melted butter with the minced garlic, 3 tbsp lemon juice, the zest, capers if using, and 2 tbsp of the parsley. It will look broken and separated, which is fine — it comes together in the pan as the fish releases its juices. Taste it and add a pinch of salt if the lemon feels sharp."},{"title":"Assemble the baking dish","text":"Choose a baking dish that holds the fillets with about 1 in (2.5 cm) between them, roughly a 9 by 13 in (23 by 33 cm) pan for four pieces. Too large a dish lets the butter spread thin and burn; too small and the fish steams. Lay the lemon slices down first and set the fillets on top so they do not stick."},{"title":"Pour and top","text":"Spoon the lemon butter evenly over and around the fillets, making sure the tops are well coated. If you want a crisp top, toss the 1/2 cup panko with 1 tbsp of the butter from the dish and press it onto the fillets. The crumb layer is optional but adds a nice contrast against the soft flakes."},{"title":"Bake without covering","text":"Slide the dish into the upper third of the oven and bake, uncovered, for 12 to 15 minutes for 1 1/4 in (3 cm) fillets. The general rule is about 10 minutes per inch of thickness at this temperature. Covering the dish traps steam and gives you a soggy, poached texture instead of a lightly roasted one."},{"title":"Baste once at the halfway point","text":"At the 7 minute mark, pull the dish out and spoon the butter from the corners back over the fish, then return it to the oven. This keeps the top from drying and redistributes the garlic, which likes to settle. It takes ten seconds and it is the difference between good and very good."},{"title":"Test for doneness","text":"The cod is done at 145°F (63°C) at the thickest point, or when the tip of a knife slid into the center meets no resistance and the flakes separate in large opaque curds. Slightly translucent in the very center is fine — it finishes on the plate. Cod goes from silky to dry and chalky in about 90 seconds, so check early."},{"title":"Rest and sauce","text":"Let the fish sit in the dish for 2 to 3 minutes while the butter, lemon juice, and fish juices pool together into a light pan sauce. Tilt the dish and spoon that sauce over each fillet as you serve. Scatter the remaining 1 tbsp parsley over the top."},{"title":"Plate with something to soak it up","text":"Move the fillets carefully with a wide spatula — cod is fragile once cooked and will break if you use tongs. Serve over rice, orzo, or crushed potatoes so nothing of that lemon butter is wasted. A roasted green vegetable on the side finishes the plate."}],"tips":["Halibut, haddock, pollock, and striped bass all work in this recipe. Halibut over 1 in (2.5 cm) thick needs 2-3 extra minutes since it is denser than cod.","If your fillets are thin tail pieces under 1 in (2.5 cm), start checking at 8 minutes. Thickness, not weight, determines the time.","Cod releases water as it bakes. If yours looks like it is swimming, the fish was previously frozen and not dried enough — drain the excess before saucing.","The lemon butter can be mixed up to 3 days ahead and refrigerated; melt it gently before using or it will not spread evenly.","Add 1 pint (about 300 g) of cherry tomatoes and 1 bunch of trimmed asparagus to the dish around the fish to make it a sheet pan dinner. Give the vegetables a 6 minute head start."],"keyTemp":"Bake at 400°F (205°C) until the fish reaches 145°F (63°C) and flakes cleanly with a fork, about 12-15 minutes for 1 1/4 in fillets.","pairing":"A crisp Pinot Grigio or Vinho Verde, with rice pilaf and roasted asparagus.","videoQuery":"baked cod lemon garlic butter oven recipe","photoQuery":"baked cod lemon butter dish","tags":["30 Minutes","Weeknight","Light"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"coconut-shrimp-sweet-chili","title":"Coconut Shrimp with Sweet Chili Sauce","emoji":"🥥","art":"shrimp","blurb":"Big shrimp in a crunchy coconut and panko jacket, fried golden and dunked in sweet chili sauce. They taste like a vacation and disappear faster than you can fry them.","difficulty":"Medium","servings":"4 servings","prepTime":"25 min","cookTime":"15 min","totalTime":"55 min (includes 15 min chill)","ingredients":[{"group":"For the shrimp","items":["1 1/2 lb (680 g) large shrimp (16-20 count), peeled and deveined, tails on","1/2 cup (60 g) all-purpose flour","1 tsp kosher salt, plus 1/2 tsp for finishing","1/2 tsp freshly ground black pepper","1/4 tsp cayenne pepper","2 large eggs","2 tbsp (30 ml) canned coconut milk or whole milk","1 1/2 cups (120 g) sweetened shredded coconut","1 cup (55 g) panko breadcrumbs","6 cups (1.4 L) canola, peanut, or vegetable oil, for frying"]},{"group":"Dipping sauce and serving","items":["1/2 cup (120 ml) Thai sweet chili sauce","2 tbsp (40 g) apricot preserves","1 tbsp (15 ml) fresh lime juice","1/4 tsp red pepper flakes","1 tbsp (4 g) chopped fresh cilantro, optional","1 lime (about 2 oz / 60 g), cut into wedges, for serving"]}],"instructions":[{"title":"Stir together the sauce","text":"Whisk the 1/2 cup sweet chili sauce, apricot preserves, 1 tbsp lime juice, and 1/4 tsp red pepper flakes in a small bowl until smooth, then stir in the cilantro. The preserves add body so the sauce clings to the shrimp instead of running off, and the lime keeps it from being cloying. Set it aside at room temperature — cold sauce dulls the flavor."},{"title":"Prep and dry the shrimp","text":"Peel the shrimp but leave the tail segment on, which gives you a handle for dipping and eating. Butterfly each one by cutting about halfway through along the back curve and pressing it open, which makes them lie flat and look twice as big. Blot them completely dry on paper towels — wet shrimp will not hold a breading."},{"title":"Set up three stations","text":"In the first shallow dish, whisk the 1/2 cup flour with the 1 tsp salt, 1/2 tsp black pepper, and cayenne. In the second, beat the 2 eggs with the 2 tbsp coconut milk until completely uniform. In the third, toss the 1 1/2 cups shredded coconut with the 1 cup panko — the panko is not traditional but it keeps the coconut from burning and adds real crunch."},{"title":"Bread with one wet hand","text":"Hold each shrimp by the tail, dredge in flour and shake off every bit of excess, dip in the egg and let it drip for 3 seconds, then press firmly into the coconut mixture on both sides. Use one hand for the dry dishes and one for the egg or you will end up with clubs of batter on your fingers. Set the breaded shrimp on a parchment-lined sheet pan without touching."},{"title":"Chill the breading","text":"Refrigerate the breaded shrimp uncovered for 15 minutes before frying, or up to 4 hours. This lets the flour hydrate and the coating set so it does not slide off in the oil. It is the same reason breaded cutlets rest before they cook."},{"title":"Heat the oil to temperature","text":"Pour the 6 cups oil into a heavy 4 qt (3.8 L) pot so it is about 2 in (5 cm) deep and no more than a third of the way up the sides. Clip on a thermometer and heat to 350°F (175°C) over medium-high, which takes about 10 minutes. This is a lower temperature than most frying because sweetened coconut contains sugar and will darken fast."},{"title":"Test with one shrimp","text":"Fry a single shrimp first and watch it: it should bubble vigorously the second it hits the oil and turn light gold in about 60 seconds. If it browns instantly, drop the heat; if it sits quietly and soaks, raise it. That one test shrimp saves the whole batch."},{"title":"Fry in small batches","text":"Lower 5 or 6 shrimp into the oil at a time, never crowding, and fry 2 to 3 minutes total, turning once with a spider strainer after about 90 seconds. They are done when the coconut is a warm golden brown and the shrimp have curled into a loose C. Let the oil come back up to 350°F (175°C) between batches, checking the thermometer each time."},{"title":"Drain on a rack","text":"Lift the shrimp onto a wire rack set over a sheet pan and season them with the reserved 1/2 tsp kosher salt right away, dividing it across the batches. Salt sticks to hot fried food and slides off cold, so this has to happen in the first few seconds. Paper towels trap steam under the shrimp and turn the bottom coating soggy within a minute. Keep finished batches warm in a 200°F (95°C) oven for up to 20 minutes."},{"title":"Check one for doneness","text":"Cut into the thickest shrimp of the first batch — it should be opaque white all the way through with no gray translucent center, which is 145°F (63°C). Large shrimp cook in under 3 minutes, so if the coating is dark before the inside is done, your oil is too hot. Adjust and keep going."},{"title":"Serve hot with the sauce","text":"Pile the shrimp on a platter with the dipping sauce in the middle and the lime wedges around the edge. These are best within ten minutes of leaving the oil, while the coconut still crackles. If they do soften, five minutes on a rack in a 400°F (205°C) oven brings them right back."}],"tips":["Sweetened shredded coconut browns better and tastes more like the restaurant version. Unsweetened works and is less sweet, but watch it closely because it toasts faster.","To bake instead of fry, arrange on a greased rack over a sheet pan, spray generously with oil, and bake at 425°F (220°C) for 12-14 minutes, flipping once. Less crisp but far less work.","An air fryer at 400°F (205°C) for 8-10 minutes works well, but spray the coating with oil or the coconut stays chalky and pale.","Bread the shrimp up to 4 hours ahead and keep them uncovered in the fridge on a sheet pan. Do not stack or cover them or the coating will go soft.","Save 1/4 cup (60 ml) of the frying oil after it cools and strain it — it will taste faintly of coconut and is great for the next batch."],"keyTemp":"Fry at 350°F (175°C); shrimp are done at 145°F (63°C) — opaque throughout and curled into a loose C.","pairing":"A cold pilsner or a rum punch, with a crunchy cabbage and lime slaw.","videoQuery":"crispy coconut shrimp fried recipe","photoQuery":"coconut shrimp sweet chili dipping sauce","tags":["Appetizer","Fried","Crowd Pleaser"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"shrimp-and-grits","title":"Charleston Shrimp and Grits","emoji":"🍤","art":"shrimp","blurb":"Slow-cooked cheesy grits under shrimp in a bacon and lemon pan gravy. This is Sunday morning food that is just as good at nine at night.","difficulty":"Medium","servings":"4 servings","prepTime":"15 min","cookTime":"45 min","totalTime":"1 hr","ingredients":[{"group":"For the grits","items":["1 cup (170 g) stone-ground grits, not instant","2 cups (480 ml) water","2 cups (480 ml) whole milk","1 1/2 tsp kosher salt","4 tbsp (55 g) unsalted butter","1 cup (110 g) sharp cheddar, freshly grated","1/4 tsp freshly ground black pepper"]},{"group":"For the shrimp","items":["1 1/4 lb (570 g) large shrimp (21-25 count), peeled and deveined","1 tsp kosher salt","1/2 tsp freshly ground black pepper","1/2 tsp sweet paprika","5 slices thick-cut bacon (about 6 oz / 170 g), cut into 1/2 in pieces","3 garlic cloves, minced","1 tbsp (8 g) all-purpose flour","3/4 cup (180 ml) chicken or seafood stock","2 tbsp (30 ml) fresh lemon juice","1 tsp (5 ml) hot sauce such as Crystal or Tabasco","3 scallions, thinly sliced"]}],"instructions":[{"title":"Rinse and skim the grits","text":"Put the 1 cup of stone-ground grits in a bowl, cover with cold water, swish, and pour off the chaff and hulls that float to the top. Real stone-ground grits carry bits of the corn hull that can taste bitter and never soften. Drain them well in a fine sieve — this takes two minutes and improves the texture noticeably."},{"title":"Start the grits low and slow","text":"Bring the 2 cups water, 2 cups milk, and 1 1/2 tsp salt to a bare simmer in a heavy 3 qt (2.8 L) saucepan, then rain the grits in while whisking constantly. Whisking as they go in is what prevents lumps, which you cannot whisk out later. Once they start to thicken, drop the heat to the lowest setting your stove has."},{"title":"Cook and stir for 35 minutes","text":"Cover and cook the grits 30 to 40 minutes, stirring well with a wooden spoon every 5 minutes and scraping the bottom corners of the pan where they catch and scorch. They are done when each grain is fully tender with no chalky center and the mixture falls slowly from the spoon in a thick ribbon. If they get too thick before they are tender, whisk in hot water 1/4 cup (60 ml) at a time."},{"title":"Season the shrimp","text":"While the grits cook, pat the shrimp dry and toss with the 1 tsp kosher salt, 1/2 tsp pepper, and 1/2 tsp paprika. Let them sit at room temperature for 15 minutes so they cook evenly. Dry, seasoned shrimp will pick up color in the bacon fat instead of steaming."},{"title":"Render the bacon","text":"Cook the bacon pieces in a cold 12 in (30 cm) skillet over medium heat for 8 to 10 minutes, stirring occasionally, until crisp and deeply browned. Starting in a cold pan renders the fat slowly instead of seizing the meat, which gives you both crisper bacon and more fat to cook in. Lift the bacon to a paper towel and leave 3 tbsp of the fat in the pan."},{"title":"Sear the shrimp fast","text":"Raise the heat to medium-high and cook the shrimp in the bacon fat in a single layer for about 60 seconds a side, until pink at the edges but still slightly translucent in the center. Work in two batches if they do not fit with space between them. Move them to a plate immediately — they finish in the gravy and will turn rubbery if you cook them fully now."},{"title":"Build the gravy","text":"Lower the heat to medium, add the minced garlic to the pan, and stir for 30 seconds until fragrant but not brown. Sprinkle the 1 tbsp flour over the fat and cook, stirring, for 1 minute — you are making a small blond roux that will thicken the gravy and take away the raw flour taste. It should smell faintly like toast."},{"title":"Deglaze and simmer","text":"Pour in the 3/4 cup stock while whisking, scraping up every browned bit from the bottom of the pan. Simmer 2 to 3 minutes until it thickens enough to coat the back of a spoon and leaves a clear line when you draw a finger through it. If it gets too thick, loosen it with another splash of stock."},{"title":"Finish the grits with cheese","text":"Off the heat, beat the 4 tbsp butter into the finished grits until it disappears, then add the 1 cup grated cheddar in two handfuls, stirring until smooth, and season with the 1/4 tsp pepper. Grate the cheese yourself — pre-shredded is coated in starch that makes grits grainy. Taste for salt; grits need more than you expect."},{"title":"Bring the shrimp back","text":"Add the 2 tbsp lemon juice, the hot sauce, the shrimp with any juices on the plate, and most of the bacon to the gravy. Toss over medium heat for 1 to 2 minutes, just until the shrimp are opaque throughout at 145°F (63°C) and curled into a loose C. Taste the gravy and adjust the lemon and hot sauce."},{"title":"Serve in warm bowls","text":"Spoon a generous ladle of grits into each warm bowl and make a shallow well in the center with the back of the spoon. Pile the shrimp and gravy into the well and scatter the reserved bacon and the sliced scallions over the top. Serve immediately, because grits set up like concrete as they cool."}],"tips":["Instant or quick grits will work in a pinch, following their package timing, but stone-ground grits are the whole point of this dish. Anson Mills and Geechie Boy are worth ordering.","Leftover grits set firm in the fridge. Cut them into squares and pan-fry in butter until crisp for one of the best breakfasts there is.","If your grits go lumpy, an immersion blender for 10 seconds saves them. Do not overdo it or they turn gluey.","Buy shell-on shrimp and simmer the shells in the 3/4 cup stock for 15 minutes, then strain. It costs you nothing and makes the gravy taste like a restaurant made it.","The grits can be made up to 2 days ahead. Reheat over low heat with a splash of milk, whisking until they loosen back up."],"keyTemp":"Shrimp are done at 145°F (63°C) — opaque and loosely curled. Grits are ready when each grain is tender with no chalky center, about 35 minutes.","pairing":"A cold beer or a Bloody Mary, with hot sauce on the table and nothing else required.","videoQuery":"charleston shrimp and grits recipe bacon gravy","photoQuery":"shrimp and grits bowl bacon","tags":["Comfort Food","Southern","Brunch"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"san-francisco-cioppino","title":"San Francisco Cioppino","emoji":"🍲","art":"stew","blurb":"A big red tomato and wine broth loaded with clams, mussels, shrimp, and fish, invented by Italian fishermen in North Beach. Serve it with bread and a stack of napkins.","difficulty":"Advanced","servings":"6 servings","prepTime":"30 min","cookTime":"1 hr","totalTime":"1 hr 30 min","ingredients":[{"group":"The broth","items":["1/4 cup (60 ml) olive oil","1 large fennel bulb (about 12 oz / 340 g), cored and thinly sliced","1 large yellow onion (about 10 oz / 280 g), diced","6 garlic cloves, minced","1 tsp red pepper flakes","2 tsp kosher salt","2 tbsp (32 g) tomato paste","1 1/2 cups (360 ml) dry white wine such as Pinot Grigio","1 can (28 oz / 795 g) crushed San Marzano tomatoes","3 cups (720 ml) fish stock or bottled clam juice","2 bay leaves","1 tsp dried oregano","1/4 tsp saffron threads, optional"]},{"group":"The seafood","items":["2 tbsp (36 g) kosher salt, for purging the clams","1 lb (450 g) littleneck clams, scrubbed","1 lb (450 g) mussels, scrubbed and debearded","1 lb (450 g) large shrimp (16-20 count), peeled and deveined, shells reserved","1 lb (450 g) firm white fish such as halibut, cod, or sea bass, cut into 1 1/2 in (4 cm) chunks","8 oz (225 g) sea scallops, side muscle removed, optional","1 cooked Dungeness crab (about 2 lb / 900 g), cleaned and cracked, optional"]},{"group":"To finish","items":["1/2 cup (20 g) chopped fresh flat-leaf parsley","2 tbsp (5 g) chopped fresh basil","1 lemon (about 4 oz / 115 g), cut into wedges","1 loaf (about 1 lb / 450 g) sourdough bread, sliced and grilled"]}],"instructions":[{"title":"Purge and check the shellfish","text":"Soak the clams in 2 qt (1.9 L) of cold water stirred with the 2 tbsp kosher salt — roughly 1 tbsp (18 g) per quart, about as salty as seawater — for 20 to 30 minutes so they spit out their sand, then lift them out rather than pouring, leaving the grit behind. Scrub and debeard the mussels, and tap any gaping shell on the counter; if it does not slowly close within 30 seconds, throw it away. Discard anything cracked. Sandy cioppino is the classic failure of this dish."},{"title":"Make a quick shrimp stock","text":"If you bought shell-on shrimp, simmer the shells in the 3 cups of fish stock or clam juice for 15 minutes, then strain and discard the shells. This costs you nothing and adds a sweet shellfish depth that bottled clam juice alone does not have. Keep the stock warm on a back burner."},{"title":"Sweat the fennel and onion","text":"Heat the 1/4 cup olive oil in a 7 qt (6.6 L) Dutch oven over medium heat and add the sliced fennel, diced onion, and 2 tsp kosher salt. Cook 10 to 12 minutes, stirring often, until everything is completely soft and translucent with just a little golden color at the edges. Do not rush this on high heat — the sweetness that develops here is the backbone of the broth."},{"title":"Bloom the garlic and chile","text":"Add the minced garlic and 1 tsp red pepper flakes and cook 1 minute more, stirring constantly, until the garlic smells sweet and the chile perfumes the oil. Fat-soluble flavors need hot oil to release, which is why this happens before any liquid goes in. Watch it closely; garlic burns in seconds."},{"title":"Caramelize the tomato paste","text":"Stir in the 2 tbsp tomato paste and cook it for 2 to 3 minutes, smearing it against the bottom of the pot, until it darkens from bright red to a deep brick color. This step drives off the tinny raw taste and builds a savory backbone. It should smell rich and slightly sweet, not sharp."},{"title":"Deglaze with wine","text":"Pour in the 1 1/2 cups white wine and scrape the bottom of the pot hard with a wooden spoon to release everything stuck there. Boil for 4 to 5 minutes until reduced by about half and the harsh alcohol smell is gone. If you can still smell raw wine, keep going — this stew has nowhere to hide it."},{"title":"Simmer the broth","text":"Add the crushed tomatoes, the warm stock, bay leaves, oregano, and the saffron if using. Bring to a boil, then reduce to a gentle simmer with the lid ajar and cook 30 to 40 minutes, stirring occasionally. The broth should reduce slightly and taste round and unified rather than like tomatoes and wine sitting next to each other. Taste and adjust the salt now, because you cannot stir the pot much once the seafood is in."},{"title":"Get everything ready to go in","text":"Cut the fish into even 1 1/2 in (4 cm) chunks, pat the shrimp and scallops dry, and have all the shellfish within arm's reach of the stove. From this point the whole thing takes about 12 minutes and each item goes in on a timer. Set out warm bowls and grill your bread now."},{"title":"Clams first","text":"Bring the broth to a strong simmer, add the clams and the crab pieces if using, cover, and cook 5 minutes. Clams have the thickest shells and take the longest to open, which is why they lead. Do not stir the pot from here on — use the lid and the simmer to move the heat around."},{"title":"Then mussels and fish","text":"Add the mussels and the chunks of white fish, nestling the fish into the broth without stirring, cover, and cook 3 minutes. The fish is fragile and stirring will break it into shreds. You should see most of the mussel shells beginning to gap open."},{"title":"Shrimp and scallops last","text":"Scatter the shrimp and scallops over the top, cover, and cook 2 to 3 minutes more, until the shrimp are pink and curled and the scallops are just opaque. Everything in the pot should now be done at once. Discard any clams or mussels that are still tightly shut."},{"title":"Check and finish","text":"The fish should flake at 145°F (63°C) and the shrimp should be opaque at 145°F (63°C). Turn off the heat, stir in the 1/2 cup parsley and the basil as gently as you can, and taste one last time for salt and heat. A squeeze of lemon at the end lifts the whole pot."},{"title":"Serve in wide bowls","text":"Ladle into warm wide bowls, making sure everyone gets some of each kind of seafood and plenty of broth. Serve with grilled sourdough, lemon wedges, an empty bowl for shells, and a bib if you own one. This is a stew you eat with your hands and a spoon at the same time."}],"tips":["The tomato broth is the make-ahead half of this dish. Make it up to 3 days ahead or freeze it for 3 months, then reheat and add seafood the night you serve it.","Use whatever is good and fresh at the counter. Squid, halibut cheeks, king crab legs, and rockfish all belong here; skip delicate flounder, which disintegrates.","The order matters more than the exact species: thickest shells first, then fish, then shrimp and scallops last. That is the whole technique.","If the broth tastes flat, it needs salt or acid before it needs anything else. Try 1/2 tsp of salt or a squeeze of lemon before reaching for more herbs.","Grill the bread with olive oil and a raw garlic clove rubbed over the hot surface. It sounds fussy and takes 90 seconds."],"keyTemp":"Fish and shrimp are done at 145°F (63°C); clams and mussels are done when their shells open wide. Discard any shellfish that stays shut.","pairing":"A bold Italian white or a light Sangiovese, with grilled sourdough and a green salad after.","videoQuery":"san francisco cioppino seafood stew recipe","photoQuery":"cioppino seafood stew bowl sourdough","tags":["Weekend Project","Crowd Pleaser","One Pot"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"grilled-swordfish-steaks","title":"Grilled Swordfish with Salmoriglio","emoji":"🐟","art":"fish","blurb":"Meaty swordfish steaks over a hot grill, finished with the Sicilian lemon, oregano, and olive oil sauce called salmoriglio. It eats like a steak but cooks in ten minutes.","difficulty":"Easy","servings":"4 servings","prepTime":"10 min","cookTime":"10 min","totalTime":"45 min (includes 20 min marinade and 5 min rest)","ingredients":[{"group":"For the fish","items":["4 swordfish steaks, 6-8 oz (170-225 g) each, 1 in (2.5 cm) thick","3 tbsp (45 ml) extra-virgin olive oil","2 garlic cloves, smashed","1 tsp dried oregano","1 1/2 tsp kosher salt","3/4 tsp freshly ground black pepper","1 tsp finely grated lemon zest"]},{"group":"Salmoriglio sauce","items":["1/3 cup (80 ml) extra-virgin olive oil","3 tbsp (45 ml) fresh lemon juice","1 tbsp (15 ml) warm water","1 garlic clove, finely grated","2 tsp dried oregano, preferably Sicilian on the branch","2 tbsp (8 g) chopped fresh flat-leaf parsley","1/2 tsp kosher salt","1/4 tsp red pepper flakes"]},{"group":"To serve","items":["2 lemons (about 8 oz / 225 g total), halved crosswise, for grilling","2 medium zucchini (about 12 oz / 340 g), cut lengthwise into 1/2 in (1.3 cm) planks, optional","1 tbsp (15 ml) extra-virgin olive oil, for the vegetables"]}],"instructions":[{"title":"Pick good steaks","text":"Look for swordfish that is firm, moist, and pale ivory to pink with a tight, close grain and no gaps between the muscle layers. The dark bloodline running through one edge is normal but strong tasting, so trim it if you are sensitive to it. Steaks under 3/4 in (2 cm) thick dry out on a grill, so ask the counter to cut them a full inch."},{"title":"Marinate briefly","text":"Rub the steaks all over with the 3 tbsp olive oil, the smashed garlic, 1 tsp dried oregano, the lemon zest, 1 1/2 tsp kosher salt, and 3/4 tsp pepper, then let them sit at room temperature for 20 minutes. Twenty minutes is long enough for the salt to season the outer layer and for the chill to come off, which is what keeps the center from staying cold while the surface overcooks. Do not add lemon juice to the marinade and do not go past 30 minutes — acid starts to cure the surface of the fish and turns it opaque and mealy before it ever hits heat. The zest gives you the perfume of lemon without any of that risk."},{"title":"Whisk the salmoriglio","text":"In a bowl, whisk the 3 tbsp lemon juice, 1 tbsp warm water, grated garlic, 1/2 tsp salt, and 2 tsp oregano, then drizzle in the 1/3 cup olive oil while whisking until it thickens slightly and looks creamy. The warm water is the traditional trick that helps it emulsify. Stir in the parsley and red pepper flakes and let it sit 15 minutes for the oregano to soften."},{"title":"Get the grill hot and clean","text":"Heat a gas grill on high or build a charcoal fire for direct high heat, aiming for around 500°F (260°C) at the grate, and give it 10 to 15 minutes with the lid closed. Scrape the grates with a wire brush until they are shiny, then oil them by wiping with a tongs-held paper towel dipped in neutral oil. Clean and oiled grates are the only reason fish does not stick."},{"title":"Blot the fish before it goes on","text":"Wipe the excess marinade off the steaks with a paper towel, leaving them lightly oiled but not dripping. Excess oil causes flare-ups that char the outside and leave the middle raw. Discard the smashed garlic, which would burn on the grate."},{"title":"Lay the steaks down and leave them","text":"Set the steaks on the hottest part of the grate at a 45 degree angle to the bars and close the lid. Cook 4 to 5 minutes without touching them — you should hear a steady sizzle and see the edges turn opaque and creep upward. Moving the fish before a crust forms is what tears it apart."},{"title":"Flip once with confidence","text":"Slide a wide metal spatula fully under a steak and lift; if it resists, give it another 30 seconds and it will release. Flip and grill the second side 3 to 4 minutes. Swordfish is dense and forgiving compared to flaky fish, but it still only wants about 8 to 9 minutes total for a 1 in steak."},{"title":"Check the temperature early","text":"Slide an instant-read thermometer in from the side into the center. The FDA guideline for fully cooked fish is 145°F (63°C); many cooks pull swordfish at 130-135°F (54-57°C) for a moister, faintly pink center and let carryover do the rest. Swordfish is lean and dries out fast, so start checking at the 7 minute mark."},{"title":"Rest the steaks","text":"Move the steaks to a warm platter and let them rest 3 to 5 minutes, loosely tented if your kitchen is cold. Like beef, swordfish is muscular enough that resting lets the juices settle back through the meat instead of running out onto the plate. They will climb about 5°F (3°C) as they sit."},{"title":"Sauce at the table","text":"Whisk the salmoriglio once more to bring it back together and spoon it generously over the rested steaks. Do not sauce them before resting or the lemon will make the surface soggy. Any leftover sauce is excellent on grilled vegetables or bread."},{"title":"Serve with something charred","text":"While the fish rests, brush the zucchini planks with the 1 tbsp olive oil and lay them on the still-hot grate along with the 2 lemons, cut side down. Give them 2 to 3 minutes per side for the zucchini and 2 to 3 minutes total for the lemons, until both carry dark grill marks. Grilled lemon squeezed over the fish at the table is sweeter and rounder than raw, because the heat caramelizes some of its sugar and knocks the sharp edge off the acid. Serve everything family style on one big platter."}],"tips":["No grill? A cast iron grill pan or a heavy skillet over medium-high heat gives you the same result. Preheat it for 5 minutes and use the same timing.","Mahi mahi, tuna, halibut steaks, and thick salmon fillets all work with this method and this sauce.","Salmoriglio keeps 3 days in the fridge, but the garlic gets sharper each day. Bring it back to room temperature and whisk before serving.","If a steak has a tough band of skin around the outside, cut through it in two or three places so the steak does not curl on the grill.","Swordfish is a high-mercury fish. It is worth knowing if you are pregnant or feeding small children, in which case cod or salmon is the better choice for this dish."],"keyTemp":"Grill to 145°F (63°C) for the FDA fully-cooked guideline; pull at 130-135°F (54-57°C) for a moister, faintly pink center.","pairing":"A chilled Sicilian white like Grillo, with grilled vegetables and roasted potatoes.","videoQuery":"grilled swordfish steaks salmoriglio recipe","photoQuery":"grilled swordfish steak lemon herbs","tags":["Grilling","30 Minutes","Summer"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"seafood-paella","title":"Seafood Paella with Saffron Rice","emoji":"🥘","art":"rice","blurb":"Saffron rice cooked flat and undisturbed until a crackling golden crust forms on the bottom, crowded with shrimp, mussels, and squid. This is the weekend showpiece of the chapter.","difficulty":"Advanced","servings":"6 servings","prepTime":"30 min","cookTime":"50 min","totalTime":"1 hr 30 min (includes 10 min rest)","ingredients":[{"group":"The base","items":["5 cups (1.2 L) fish or shellfish stock","1/2 tsp saffron threads (about 0.5 g)","1/4 cup (60 ml) extra-virgin olive oil","1 large yellow onion (about 10 oz / 280 g), finely diced","1 red bell pepper (about 6 oz / 170 g), cut into strips","5 garlic cloves, minced","2 tsp smoked Spanish paprika (pimenton dulce)","1 1/2 cups (270 g) grated fresh tomato, or canned crushed tomatoes","2 tsp kosher salt"]},{"group":"The rice and seafood","items":["2 cups (400 g) bomba, Calasparra, or other Spanish short-grain rice","1 lb (450 g) large shrimp (16-20 count), shell-on or peeled","1 lb (450 g) mussels or littleneck clams, scrubbed and debearded","8 oz (225 g) cleaned squid, bodies cut into 1/2 in (1.3 cm) rings","1 cup (140 g) frozen peas, optional"]},{"group":"To finish","items":["1/4 cup (10 g) chopped fresh flat-leaf parsley","2 lemons (about 8 oz / 225 g total), cut into wedges","1/2 tsp flaky sea salt"]}],"instructions":[{"title":"Bloom the saffron","text":"Warm the 5 cups of stock in a saucepan until steaming but not boiling, crumble the 1/2 tsp saffron threads between your fingers, and stir them in. Let it steep at least 10 minutes while you prep everything else, until the liquid glows deep orange-gold. Saffron needs warmth and time to release its color and its honeyed, hay-like aroma, and adding threads directly to the rice wastes most of it."},{"title":"Prep every ingredient first","text":"Dice the onion, slice the pepper, mince the garlic, grate the tomatoes, scrub the mussels, and cut the squid before you light a burner. Paella has no pauses once it starts, and you cannot stop to chop an onion halfway through. Set everything in bowls around the stove in the order you will use it."},{"title":"Pick the right pan","text":"Use a 15 in (38 cm) paella pan or the widest, shallowest skillet you own — the goal is rice no more than 1/2 in (1.3 cm) deep, which is what lets it cook without stirring. A deep Dutch oven will give you rice pudding, not paella. If your burner is smaller than the pan, plan to rotate it every few minutes so the whole base heats evenly."},{"title":"Sear the seafood and pull it out","text":"Heat the 1/4 cup olive oil over medium-high and sear the shrimp for 60 seconds a side and the squid for about 60 seconds total, just until they take on a little color. Move both to a plate — they are only 70 percent cooked and will finish on top of the rice at the end. Cooking them now leaves shellfish flavor in the oil that carries through the whole dish."},{"title":"Build the sofrito","text":"Lower the heat to medium, add the onion, bell pepper, and 2 tsp salt to the same pan, and cook 8 to 10 minutes until very soft and lightly golden. Add the garlic and cook 1 minute more. This slow-cooked vegetable base is called sofrito and it is where most of the flavor in a paella actually lives, so do not shortcut it."},{"title":"Add paprika and tomato","text":"Stir in the 2 tsp smoked paprika and cook for just 30 seconds — paprika scorches almost instantly and turns acrid. Immediately add the 1 1/2 cups grated tomato and cook 8 to 10 minutes, stirring, until the mixture darkens to brick red and the oil separates and pools at the edges. That separation is your signal the sofrito is finished."},{"title":"Toast the rice","text":"Add the 2 cups of rice and stir for 2 minutes so every grain is coated in the oil and sofrito. Toasting the exterior of the grain helps it stay separate and absorb liquid evenly instead of turning creamy. Spread the rice into a flat, even layer across the whole pan."},{"title":"Add the stock and stop stirring","text":"Pour in all 5 cups of the saffron stock, shake the pan gently to level the rice, and bring it to a strong boil. From this moment on, do not stir the rice again — stirring releases starch and makes risotto, and it destroys the crust you are building. Taste the broth now and add salt if it needs it; this is your last chance to season."},{"title":"Boil hard, then simmer","text":"Boil hard for 5 minutes, rotating the pan a quarter turn every minute or two if your burner is smaller than the pan. Then reduce to a steady medium-low simmer and cook 10 minutes more, uncovered. You should see the liquid level dropping to just below the surface of the rice."},{"title":"Add the shellfish","text":"Nestle the mussels or clams hinge-down into the rice so they will open upward and keep their juices, and scatter the peas over the top. Cook 5 minutes more, until the shells open wide. Any shell still shut at the end gets thrown out."},{"title":"Return the shrimp and squid","text":"Arrange the seared shrimp and squid over the surface of the rice and cook 3 to 5 minutes more, until the shrimp are opaque at 145°F (63°C) and the rice is tender with no chalky center. Taste a grain from the middle of the pan rather than the edge. If the rice is still hard and the pan is dry, add 1/4 cup (60 ml) of hot stock around the edges."},{"title":"Make the socarrat","text":"Turn the heat to high for 60 to 90 seconds and listen closely — you want a crackling, popping sound and the smell of toasting rice, but stop the second it smells sharp or burnt. This forms the socarrat, the caramelized crust of rice on the bottom of the pan that is the most prized part of the dish. Scrape gently with a spoon at the edge to check for a golden brown layer."},{"title":"Rest before serving","text":"Take the pan off the heat, cover it loosely with a clean kitchen towel or foil, and let it rest 10 minutes. The rice finishes absorbing the last of the liquid and firms up so it does not fall apart when you serve it. Skipping this rest is why home paella often tastes wet."},{"title":"Serve from the pan","text":"Uncover, scatter the 1/4 cup parsley and the 1/2 tsp flaky salt over the top, and tuck the lemon wedges around the edge. Bring the whole pan to the table and let everyone serve themselves straight from it, digging down for a piece of the crust. Traditionally people eat from the wedge of the pan directly in front of them."}],"tips":["Bomba rice absorbs three times its volume in liquid without falling apart, which is why the ratio here is 2 1/2 cups of stock per cup of rice. Arborio works but needs about 1/2 cup less liquid and turns creamier.","Do not use long-grain or basmati rice. It will not absorb the broth the same way and you will never get a socarrat.","Homemade stock from shrimp shells simmered 20 minutes with an onion, a bay leaf, and 6 cups of water is a huge upgrade over bottled clam juice.","If your stovetop cannot heat the whole pan evenly, finish the paella uncovered in a 400°F (205°C) oven for the last 10 minutes, then do the socarrat over a burner for 90 seconds.","Leftovers reheat surprisingly well in a covered skillet with a splash of stock over low heat, or make excellent arancini-style rice cakes the next day."],"keyTemp":"Shrimp are done at 145°F (63°C); mussels and clams are done when they open wide. The rice should be tender with no chalky center and a crisp golden socarrat underneath.","pairing":"A cold Spanish rosado or dry cava, with an olive oil and sherry vinegar green salad.","videoQuery":"authentic spanish seafood paella socarrat","photoQuery":"seafood paella pan mussels shrimp","tags":["Weekend Project","Crowd Pleaser","Special Occasion"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"chicken-parmesan","title":"Crispy Chicken Parmesan","emoji":"🍗","art":"chicken","blurb":"Thin cutlets fried until they shatter, a bright five-ingredient tomato sauce, and just enough mozzarella to melt into ropes. The trick is sauce and cheese only on top, so the crust never goes soggy.","difficulty":"Medium","servings":"4 servings","prepTime":"25 min","cookTime":"35 min","totalTime":"1 hr","ingredients":[{"group":"For the cutlets","items":["2 large boneless skinless chicken breasts (about 1 1/2 lb / 680 g total)","1 1/2 tsp kosher salt","1/2 tsp freshly ground black pepper","1 cup (125 g) all-purpose flour","3 large eggs","1 tbsp (15 ml) water","1 1/2 cups (90 g) panko breadcrumbs","1/2 cup (50 g) finely grated Parmigiano-Reggiano","1 tsp dried oregano","3/4 cup (180 ml) neutral oil, such as canola or grapeseed, for frying"]},{"group":"Quick tomato sauce","items":["2 tbsp (30 ml) extra-virgin olive oil","4 garlic cloves, thinly sliced","1 can (28 oz / 794 g) whole peeled San Marzano tomatoes, crushed by hand","3/4 tsp kosher salt","1/4 tsp red pepper flakes","6 large fresh basil leaves"]},{"group":"To finish","items":["8 oz (225 g) low-moisture whole-milk mozzarella, coarsely shredded","1/4 cup (25 g) grated Parmigiano-Reggiano","1/4 cup (10 g) fresh basil leaves, torn"]}],"instructions":[{"title":"Make the sauce first","text":"Warm the 2 tbsp olive oil and sliced garlic in a saucepan over medium-low heat for 2 to 3 minutes, until the garlic is pale gold and smells sweet but has no brown edges. Add the hand-crushed tomatoes, 3/4 tsp salt, and the red pepper flakes, then simmer uncovered over medium-low for 20 to 25 minutes, stirring now and then. It is ready when a spoon dragged through the pan leaves a track that fills in slowly. Stir in the basil leaves off the heat and set aside; making the sauce first means it is done before the fried cutlets have a chance to get cold."},{"title":"Cut the breasts into cutlets","text":"Lay a chicken breast flat and press one palm on top, then run a sharp knife horizontally through the middle to split it into two thin pieces. Repeat with the second breast so you have 4 cutlets. Thin cutlets cook through in the same few minutes it takes the crust to brown, which is the entire secret to chicken parm that is not dry in the middle."},{"title":"Pound them even","text":"Put each cutlet between two sheets of plastic wrap or in a zip-top bag and pound with a flat meat mallet, a small skillet, or a rolling pin until it is an even 1/4 in (6 mm) thick. Work from the center outward with firm taps rather than hard smacks, which tear the meat. Even thickness matters more than thinness — a cutlet that is thin at one end and fat at the other will always overcook somewhere. Season both sides with the 1 1/2 tsp kosher salt and 1/2 tsp pepper."},{"title":"Set up three stations","text":"Line up three shallow dishes: flour in the first, the 3 eggs beaten with 1 tbsp water in the second, and the panko tossed with the 1/2 cup grated Parmigiano and 1 tsp oregano in the third. Keep one hand for dry and one hand for wet so your fingers do not turn into breaded clubs. Putting cheese directly into the crumbs means the crust itself tastes like Parmesan, not just the topping."},{"title":"Bread the cutlets","text":"Dredge a cutlet in flour and shake off every loose speck, dip it in egg and let the excess run off for 3 seconds, then press it firmly into the panko on both sides. Real pressure here is what makes the crust stick instead of sliding off in the pan. Set the breaded cutlets on a rack and let them rest 10 minutes if you have the time, which lets the coating hydrate and glue itself on."},{"title":"Heat the oil correctly","text":"Pour the 3/4 cup oil into a 12 in (30 cm) skillet — it should come about 1/4 in (6 mm) up the sides — and heat over medium-high to 350°F (175°C). Without a thermometer, drop in a pinch of panko: it should sizzle steadily and float, not sit still and not crackle violently. Oil that is too cool soaks in and goes greasy; oil that is smoking burns the crumbs before the chicken is done."},{"title":"Fry two at a time","text":"Lay 2 cutlets in the oil away from you and fry 3 to 4 minutes on the first side, until the edges you can see are deep golden. Flip once with tongs and fry 2 to 3 minutes more. Do not crowd the pan; four at once drops the oil temperature and you get pale, oily breading. Move the finished cutlets to a wire rack, never paper towels, so the underside stays crisp while the second batch fries."},{"title":"Check the temperature","text":"Slide an instant-read thermometer sideways into the thickest part of a cutlet — it should read 165°F (74°C). Pounded cutlets almost always get there during the fry, so if one reads low, the broiler step will finish it. Never rely on the color of the crust to tell you the chicken is cooked."},{"title":"Sauce and cheese the tops only","text":"Heat the broiler with a rack 6 in (15 cm) below the element. Arrange the cutlets on a foil-lined sheet pan, spoon about 3 tbsp of sauce onto the center of each, and leave a wide border of bare crust all the way around. Divide the shredded mozzarella and 1/4 cup Parmigiano over the sauce. Sauce touching the crust is the number one reason chicken parm turns soggy, so resist the urge to drown it."},{"title":"Broil just until bubbling","text":"Broil for 2 to 4 minutes, watching the whole time, until the mozzarella is melted with a few brown blisters. Broilers vary wildly and cheese goes from perfect to burnt in about 30 seconds, so do not walk away or check your phone. Pull the pan the moment the cheese stops looking rubbery and starts to bubble at the edges."},{"title":"Rest, then serve","text":"Let the cutlets sit for 3 minutes so the molten cheese sets enough to slice without sliding off. Scatter the torn basil over the top and serve the remaining sauce warm in a bowl on the side for dipping or for a small pile of spaghetti. Serve immediately — chicken parm is at its best about four minutes out of the broiler and never really comes back."}],"tips":["Bread the cutlets up to 6 hours ahead and keep them on a rack in the fridge, uncovered. The coating dries slightly and fries up even crisper.","No San Marzano tomatoes? Any can of whole peeled tomatoes works better than pre-crushed, which is usually made from lower-grade fruit and tastes tinny.","Fresh mozzarella in water releases too much liquid under a broiler and floods the crust. Use the firm low-moisture block and shred it yourself.","If the breading slides off in the pan, the cutlets were wet or the flour layer was too thick. Pat them dry and tap off the flour like you mean it.","Leftovers reheat well at 375°F (190°C) on a rack for 10 minutes. The microwave will turn that crust into a wet paper towel."],"keyTemp":"Chicken is safe and still juicy at 165°F (74°C) measured at the thickest point of the cutlet.","pairing":"A simple arugula salad with lemon and a glass of Chianti Classico, with garlic bread for the extra sauce.","videoQuery":"crispy chicken parmesan cutlets from scratch","photoQuery":"chicken parmesan melted mozzarella plate","tags":["Comfort Food","Date Night","Fried"],"cat":"Italian Classics","catSlug":"italian-classics","catEmoji":"🍝"},{"id":"chicken-piccata","title":"Chicken Piccata with Lemon and Capers","emoji":"🍋","art":"chicken","blurb":"Golden cutlets under a sharp, buttery lemon-caper pan sauce that comes together in the same skillet in about four minutes. This is the weeknight dinner that tastes like you tried much harder than you did.","difficulty":"Easy","servings":"4 servings","prepTime":"15 min","cookTime":"15 min","totalTime":"30 min","ingredients":[{"group":"For the chicken","items":["2 large boneless skinless chicken breasts (about 1 1/2 lb / 680 g total)","1 tsp kosher salt","1/2 tsp freshly ground black pepper","1/2 cup (65 g) all-purpose flour","2 tbsp (30 ml) extra-virgin olive oil","1 tbsp (14 g) unsalted butter"]},{"group":"Lemon caper pan sauce","items":["1/2 cup (120 ml) dry white wine, such as Pinot Grigio","3/4 cup (180 ml) low-sodium chicken stock","3 tbsp (45 ml) fresh lemon juice (about 1 1/2 lemons)","3 tbsp (27 g) capers, drained and rinsed","4 tbsp (55 g) cold unsalted butter, cut into 4 pieces","3 tbsp (12 g) chopped fresh flat-leaf parsley","1 lemon, cut into thin rounds, for serving"]}],"instructions":[{"title":"Split and pound the breasts","text":"Press one hand flat on a chicken breast and slice it horizontally into two thin pieces, then repeat with the second breast for 4 cutlets total. Put each between plastic wrap and pound to an even 1/4 in (6 mm) with a mallet or small skillet. At that thickness the cutlets cook in about 6 minutes total, which is the whole point of piccata."},{"title":"Season and dredge","text":"Season the cutlets on both sides with the 1 tsp kosher salt and 1/2 tsp pepper, then dredge each in the 1/2 cup flour and shake off the excess until you see only a thin, dusty film. Too much flour goes gummy in the sauce and tastes raw. Dredge right before cooking, because flour sitting on damp chicken turns into paste within a few minutes."},{"title":"Heat the skillet","text":"Set a 12 in (30 cm) stainless steel skillet over medium-high heat, add the 2 tbsp olive oil and 1 tbsp butter, and wait until the butter foam subsides and the fat
