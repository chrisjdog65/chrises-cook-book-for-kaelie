°F (93 to 96°C) internal. If they are still firm, they need more time, not more heat. Fully done short ribs will almost slide off the bone when lifted with tongs."},{"title":"Rest and defat the sauce","text":"Carefully lift the ribs out onto a platter and tent with foil. Strain the braising liquid through a fine-mesh sieve into a wide saucepan, pressing gently on the vegetables to extract flavor, then discard the solids and herb bundle. Let it settle 5 minutes and skim the fat off the top with a wide spoon or a fat separator — there will be a lot."},{"title":"Reduce and finish the sauce","text":"Simmer the strained liquid over medium-high heat for 10 to 15 minutes until it has reduced to about 2 cups and coats the back of a spoon. Take it off the heat, whisk in the red wine vinegar and the cold butter until glossy, and taste for salt. The vinegar is not optional — it lifts a sauce this rich out of heaviness."},{"title":"Serve over something soft","text":"Spoon the ribs over creamy polenta, mashed potatoes, or buttered egg noodles and ladle the sauce generously over the top. Finish with the flaky salt and a little chopped parsley if you have it. Serve in shallow bowls so nobody loses any of the sauce."}],"tips":["Make this a day ahead. Cool the ribs in their strained liquid, refrigerate overnight, lift off the solid fat cap, and reheat covered at 325°F (165°C) for 30 minutes — the flavor is noticeably better.","Ask for English-cut short ribs, thick blocks with one bone each, not flanken-cut cross-sections, which are meant for grilling.","Use a dry, full-bodied red you would drink. It reduces to a quarter of its volume, so anything unpleasant becomes four times as unpleasant.","If the finished sauce tastes flat, it needs acid or salt, not more cooking. Add vinegar ½ teaspoon at a time until it snaps into focus.","The strained braising vegetables can be blended with a ladle of sauce into a thick purée if you would rather not waste them."],"keyTemp":"Braise at 325°F (165°C) until the meat reads 200 to 205°F (93 to 96°C) and a fork twists freely. Bring the finished sauce to a simmer of about 200°F (93°C) to reduce.","pairing":"Creamy parmesan polenta and a glass of the same Cabernet you braised with.","videoQuery":"red wine braised short ribs dutch oven","photoQuery":"braised short ribs polenta sauce","tags":["Comfort Food","Make Ahead","Braise"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"beef-stroganoff","title":"Beef Stroganoff over Egg Noodles","emoji":"🍜","art":"noodles","blurb":"Quick-seared strips of sirloin in a sour cream and mushroom sauce, spooned over buttered egg noodles. The whole thing comes together in under an hour and tastes like it took all day.","difficulty":"Medium","servings":"4 servings","prepTime":"20 min","cookTime":"30 min","totalTime":"50 min","ingredients":[{"group":"For the beef","items":["1½ lb (680 g) beef sirloin or tenderloin tips, sliced ¼ in (6 mm) thick against the grain","1 tsp (5 g) kosher salt","½ tsp (1 g) freshly ground black pepper","2 tbsp (30 ml) vegetable oil"]},{"group":"Sauce","items":["4 tbsp (55 g) unsalted butter, divided","1 lb (450 g) cremini mushrooms, sliced ¼ in (6 mm) thick","1 large yellow onion, thinly sliced (about 2 cups / 250 g)","3 garlic cloves, minced (1 tbsp)","3 tbsp (24 g) all-purpose flour","2 cups (480 ml) low-sodium beef stock","1 tbsp (15 g) Dijon mustard","1½ tsp (7 ml) Worcestershire sauce","¾ cup (180 g) full-fat sour cream, at room temperature","½ tsp kosher salt, plus more to taste"]},{"group":"To serve","items":["12 oz (340 g) wide egg noodles","2 tbsp (28 g) butter, for the noodles","3 tbsp chopped fresh dill or parsley"]}],"instructions":[{"title":"Slice the beef properly","text":"Firm the beef in the freezer for 15 minutes, which makes thin slicing far easier, then cut it across the grain into strips about ¼ inch (6 mm) thick and 2 inches (5 cm) long. Cutting against the grain shortens the muscle fibers so quick-cooked beef stays tender. Pat the strips very dry and season with the 1 tsp salt and ½ tsp pepper."},{"title":"Get the pan very hot","text":"Heat the 2 tbsp oil in a large 12-inch (30 cm) skillet over high heat until it shimmers and just wisps smoke. A large pan matters here — you need surface area so the beef browns instead of steaming. Set a plate next to the stove because the beef comes out fast."},{"title":"Sear the beef in two batches","text":"Add half the beef in a single layer with space between the pieces and sear 45 to 60 seconds per side, just until browned. Do not cook it through; it will finish in the sauce at the end and overcooked sirloin turns to leather. Move it to the plate and repeat with the second batch, adding a little more oil if the pan is dry."},{"title":"Brown the mushrooms","text":"Lower the heat to medium-high, add 2 tbsp of the butter, and add the sliced mushrooms in as close to a single layer as you can. Let them sit undisturbed for 3 minutes so they brown, then stir and cook 5 to 6 minutes more until they have released their liquid and it has cooked away. Mushrooms that are pale and swimming will make a watery, gray sauce."},{"title":"Soften the onion and garlic","text":"Add the remaining 2 tbsp butter and the sliced onion and cook 5 to 6 minutes over medium heat until soft and golden at the edges. Stir in the minced garlic for the last 45 seconds, just until it smells sweet. Scrape the bottom of the pan as you go to lift up the browned beef fond."},{"title":"Boil the noodles","text":"Around now, start a large pot of well-salted water — about 1 tablespoon of salt per 4 quarts — and cook the egg noodles according to the package, usually 7 to 9 minutes. Drain them and toss with the 2 tbsp butter so they do not clump. Timing the noodles to finish with the sauce keeps them from turning gluey."},{"title":"Make the roux","text":"Sprinkle the 3 tbsp flour over the mushrooms and onions and stir constantly for 90 seconds so the raw flour taste cooks out. The mixture will look dry and pasty and cling to the vegetables, which is exactly right. This is what will give the sauce its body."},{"title":"Add the stock gradually","text":"Pour in about a third of the beef stock and stir hard until it thickens into a smooth paste, then add the rest in two more additions, stirring between each. Adding liquid in stages is how you avoid lumps — dumping it all in at once almost guarantees them. Bring it to a gentle simmer and cook 4 to 5 minutes until it thickly coats a spoon."},{"title":"Season the sauce","text":"Stir in the Dijon mustard and Worcestershire sauce and taste. It should taste savory and slightly sharp; add the ½ tsp salt as needed, remembering that sour cream will mute it slightly. If the sauce is thicker than heavy cream, loosen it with a splash of stock."},{"title":"Temper in the sour cream","text":"Take the pan completely off the heat and let it cool for 60 seconds. Whisk a ladle of the hot sauce into the room-temperature sour cream in a small bowl, then stir that mixture back into the pan. Sour cream curdles above about 180°F (82°C), and tempering it like this is the only reliable way to keep the sauce smooth."},{"title":"Return the beef and warm through","text":"Add the seared beef and all its resting juices back to the pan and set it over low heat for 2 to 3 minutes, just until everything is hot. Do not let it boil again or the sour cream will break and the beef will toughen. The beef should be barely pink in the center when you serve it."},{"title":"Serve over the noodles","text":"Spoon the stroganoff over the buttered egg noodles in wide shallow bowls and scatter the dill or parsley on top. Serve immediately — the sauce is at its best right off the heat and will tighten as it sits. A crack of black pepper at the table finishes it."}],"tips":["Full-fat sour cream only. Low-fat and nonfat versions have less fat to stabilize them and will split the moment they meet the hot sauce.","Take the sour cream out of the fridge when you start cooking. Cold dairy hitting a hot pan is the other main cause of a broken sauce.","Ground beef makes a fine weeknight shortcut version: brown 1½ lb (680 g), drain the fat, and continue from the mushroom step.","Leftovers reheat best on the stove over low heat with a splash of stock. Microwaving on high will break the sauce every time.","A splash of brandy or dry sherry, about 3 tbsp, added to the mushrooms before the flour is a traditional and very good addition."],"keyTemp":"Keep the sauce below 180°F (82°C) once the sour cream goes in or it will curdle. The beef should reach 130 to 135°F (54 to 57°C) and no more.","pairing":"A crisp cucumber and dill salad, with a dry Riesling or a light Pinot Noir.","videoQuery":"beef stroganoff sour cream egg noodles","photoQuery":"beef stroganoff egg noodles bowl","tags":["Weeknight","Comfort Food","Skillet"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"salisbury-steak-mushroom-gravy","title":"Salisbury Steak with Mushroom Gravy","emoji":"🍄","art":"steak","blurb":"Seasoned beef patties simmered in a deep onion-mushroom gravy. This is old-school American diner food done properly, and it is genuinely one of the best cheap dinners going.","difficulty":"Easy","servings":"4 servings","prepTime":"15 min","cookTime":"30 min","totalTime":"45 min","ingredients":[{"group":"For the patties","items":["1½ lb (680 g) ground chuck, 80/20","⅓ cup (35 g) panko breadcrumbs","¼ cup (60 ml) whole milk","1 large egg yolk","½ small yellow onion, grated on a box grater (about ¼ cup / 45 g)","1 tbsp (15 g) ketchup","2 tsp (10 ml) Worcestershire sauce","1¼ tsp (6 g) kosher salt","½ tsp (1 g) freshly ground black pepper","1 tbsp (15 ml) vegetable oil"]},{"group":"Mushroom onion gravy","items":["3 tbsp (42 g) unsalted butter","8 oz (225 g) cremini or white mushrooms, sliced","1 large yellow onion, thinly sliced (about 2 cups / 250 g)","3 tbsp (24 g) all-purpose flour","2½ cups (600 ml) low-sodium beef broth","1 tbsp (15 ml) Worcestershire sauce","1 tsp Dijon mustard","½ tsp kosher salt, plus more to taste"]}],"instructions":[{"title":"Make a panade","text":"Stir the panko and milk together in a large bowl and let it sit for 5 minutes until the crumbs have swelled into a thick paste. This is called a panade, and it is what keeps ground beef patties tender and juicy even after simmering in gravy. Without it, the patties turn dense and springy."},{"title":"Mix the patty base","text":"Add the egg yolk, grated onion, ketchup, 2 tsp Worcestershire, 1¼ tsp salt, and ½ tsp pepper to the panade and whisk until smooth. Grating the onion instead of chopping it releases juice and eliminates raw crunchy bits in the finished patty. Having everything combined before the beef goes in means less handling of the meat."},{"title":"Combine gently","text":"Add the ground chuck and mix with your hands or a fork just until no dry streaks remain, about 30 seconds. Overworking ground beef develops the proteins and gives you a bouncy, sausage-like texture. Stop while the mixture still looks a little rough."},{"title":"Shape four ovals","text":"Divide the mixture into 4 equal portions, roughly 7 oz (200 g) each, and shape each into an oval about 5 inches long and ¾ inch (2 cm) thick. Press a shallow dimple into the center of each with your thumb so they do not dome up as they cook. Set them on a plate and chill for 10 minutes if your kitchen is warm."},{"title":"Sear the patties","text":"Heat the tablespoon of oil in a 12-inch (30 cm) skillet over medium-high heat until shimmering, then add the patties without crowding. Sear 3 to 4 minutes per side until a solid brown crust forms, flipping only once. They will not be cooked through and should not be — they finish in the gravy."},{"title":"Set the patties aside","text":"Move the seared patties to a plate and pour off all but about 1 tablespoon of fat, leaving the browned bits behind. Those bits are the flavor base of the gravy, so do not wipe the pan out. Lower the heat to medium."},{"title":"Brown the mushrooms","text":"Add the 3 tbsp butter and the sliced mushrooms and cook 6 to 7 minutes, stirring occasionally, until they have given up their water and started to brown. They will look sad and shrunken halfway through, which is normal — keep going until the pan is dry again. Browned mushrooms taste meaty, boiled ones taste like nothing."},{"title":"Soften the onions","text":"Add the sliced onion and cook 6 to 8 minutes more, scraping the fond off the bottom as the onions release moisture. You are looking for limp, golden onions with browned edges, not translucent ones. This is where a diner-style gravy gets its sweetness."},{"title":"Make the roux","text":"Sprinkle the 3 tbsp flour over the vegetables and stir constantly for 90 seconds, coating everything evenly. The mixture will look dry and clumpy, which is exactly what you want before liquid goes in. Cooking the flour now prevents the pasty raw-flour taste that ruins a lot of homemade gravy."},{"title":"Build the gravy","text":"Pour in the beef broth in three additions, stirring smooth after each one, then add the 1 tbsp Worcestershire and the Dijon. Bring it to a simmer and cook 3 to 4 minutes until it thickens to the consistency of heavy cream. Taste and add the ½ tsp salt if it needs it."},{"title":"Simmer the patties through","text":"Nestle the patties and any juices from the plate back into the gravy, spooning some over the tops. Cover and simmer gently on low for 10 to 12 minutes, flipping once at the halfway point. Ground beef must reach 160°F (71°C) in the center for safety — check with an instant-read thermometer rather than guessing."},{"title":"Rest briefly and serve","text":"Take the pan off the heat and let it sit 3 to 4 minutes so the gravy thickens slightly and the patties settle. Serve over mashed potatoes or buttered egg noodles with plenty of gravy spooned over the top. A little chopped parsley brightens the whole plate if you have some."}],"tips":["80/20 ground chuck is the right choice. Leaner beef, 90/10 or above, makes dry, crumbly patties no matter how good your panade is.","The patties can be shaped up to a day ahead and kept covered in the fridge, which actually helps them hold together in the pan.","This freezes beautifully. Cool completely, freeze patties and gravy together in a container for up to 3 months, and reheat covered at 325°F (165°C).","If the gravy gets too thick while simmering, thin it with a splash of broth; if it is thin, uncover and simmer 3 minutes longer.","For a richer version, swap 1 cup of the beef broth for a dark beer or ½ cup dry red wine plus ½ cup broth."],"keyTemp":"Ground beef must reach 160°F (71°C) in the center — this is a food-safety temperature, not a preference. The gravy should simmer gently, around 190°F (88°C).","pairing":"Buttery mashed potatoes and steamed peas, with a cold amber ale.","videoQuery":"salisbury steak mushroom onion gravy","photoQuery":"salisbury steak mushroom gravy mashed potatoes","tags":["Weeknight","Comfort Food","Budget"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"marinated-london-broil","title":"Marinated London Broil","emoji":"🥩","art":"steak","blurb":"A lean top round soaked overnight in soy, balsamic, and garlic, then broiled hard and sliced paper-thin. It feeds a crowd for very little money and makes outstanding sandwiches the next day.","difficulty":"Easy","servings":"4 to 6 servings","prepTime":"15 min","cookTime":"20 min","totalTime":"6 hr 45 min","ingredients":[{"group":"For the beef","items":["2 lb (900 g) top round or flank steak, 1½ to 2 in (4 to 5 cm) thick","1 tsp (5 g) kosher salt","1 tsp freshly ground black pepper"]},{"group":"Marinade","items":["⅓ cup (80 ml) soy sauce","¼ cup (60 ml) balsamic vinegar","¼ cup (60 ml) olive oil","2 tbsp (30 ml) fresh lemon juice","1 tbsp (15 ml) Worcestershire sauce","1 tbsp (21 g) honey","5 garlic cloves, minced (about 1½ tbsp)","1 tsp dried oregano","1 tsp coarsely ground black pepper"]}],"instructions":[{"title":"Understand the cut","text":"London broil is a cooking method, not a cut — most stores sell top round or sometimes flank under that name. It is very lean and has almost no marbling, which means two rules are absolute: do not cook past medium-rare, and slice it as thin as you possibly can. Everything else in this recipe exists to support those two rules."},{"title":"Score the surface","text":"Using a sharp knife, cut a shallow diamond crosshatch about ⅛ inch (3 mm) deep into both sides of the meat, spacing the cuts 1 inch (2.5 cm) apart. Scoring gives the marinade more surface to work on and helps the lean muscle stay flat under high heat instead of curling. Keep the cuts shallow so you do not create channels for juice to escape."},{"title":"Whisk the marinade","text":"In a bowl, whisk together the soy sauce, balsamic vinegar, olive oil, lemon juice, Worcestershire, honey, garlic, oregano, and 1 tsp pepper until the honey has dissolved. The soy provides salt, the acid tenderizes the surface, and the honey helps it brown under the broiler. Taste it — it should be salty and tangy, almost too strong on its own."},{"title":"Marinate 6 to 24 hours","text":"Put the beef in a zip-top bag, pour in the marinade, press out the air, and refrigerate for at least 6 hours and up to 24. Flip the bag two or three times so both sides get equal contact. This cut genuinely needs the full time — 30 minutes will do almost nothing to a piece of meat this dense."},{"title":"Bring it to room temperature","text":"Pull the beef out of the fridge 45 minutes before cooking and leave it in the marinade on the counter. A cold, dense roast under a broiler will burn on the outside before the center gets anywhere near done. Meanwhile, set an oven rack so the top of the meat will sit about 4 inches (10 cm) below the broiler element."},{"title":"Preheat the broiler fully","text":"Turn the broiler to high and let it preheat for a full 10 minutes with the pan you will use already inside. A screaming-hot pan means the underside starts browning immediately instead of steaming. Use a heavy sheet pan or a cast-iron skillet, never glass, which can shatter under a broiler."},{"title":"Dry and season the meat","text":"Lift the beef out of the marinade and pat it thoroughly dry with paper towels, wiping away any garlic bits that would burn. Season both sides with the 1 tsp kosher salt and 1 tsp black pepper. Discard the used marinade — it has held raw meat and should not be reused."},{"title":"Broil the first side","text":"Set the meat on the preheated pan and broil for 6 to 7 minutes without opening the door. You are looking for a dark, well-browned surface with some charred spots at the edges. If your broiler is weak, this may take 8 or 9 minutes; watch through the window rather than trusting the clock."},{"title":"Flip and finish","text":"Turn the meat with tongs and broil the second side 5 to 7 minutes more, then start checking the internal temperature. Pull it at 125 to 128°F (52 to 53°C) for medium-rare. This cut has no fat to protect it, so 140°F (60°C) is already dry and 150°F (66°C) is beyond saving."},{"title":"Rest a full 10 minutes","text":"Move the beef to a cutting board and rest it for 10 minutes, tented loosely with foil. Lean meat holds its juices precariously, and cutting into it early will leave a puddle on the board and a dry steak on the plate. The temperature will drift up about 5°F (3°C) during the rest."},{"title":"Slice paper-thin against the grain","text":"Find the direction the muscle fibers run, then hold your knife at a 45-degree angle and slice across them as thinly as you can manage, ⅛ to ¼ inch (3 to 6 mm). Thin slicing across the grain is what turns an inexpensive, chewy cut into something tender. Thick slices of top round will feel like leather no matter how perfectly you cooked it."},{"title":"Dress with the board juices","text":"Tilt the cutting board and spoon the collected juices back over the sliced meat, which reseasons it and keeps the surface glossy. Serve immediately on a warm platter. If you want a sauce, a spoonful of chimichurri or a simple horseradish cream is perfect here."}],"tips":["A sharp, long knife matters more here than in any other recipe in this chapter. A dull knife tears lean beef into shreds instead of slicing it.","No broiler you trust? Grill it over high direct heat for the same times, or sear in a cast-iron skillet and finish in a 425°F (220°C) oven.","Leftovers make the best steak sandwiches — pile the cold thin slices on a roll with horseradish mayo, arugula, and red onion.","Do not marinate past 24 hours. The acid will start breaking down the surface into a soft, mushy layer that never browns properly."],"keyTemp":"Pull at 125 to 128°F (52 to 53°C) for medium-rare, resting to 130 to 133°F (54 to 56°C). Lean top round is unpleasantly dry above 140°F (60°C).","pairing":"Roasted potatoes and a sharp arugula salad, with a Chianti or a dry rosé.","videoQuery":"london broil marinade broiler top round","photoQuery":"london broil sliced thin platter","tags":["Budget","Make Ahead","Crowd Pleaser"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"santa-maria-tri-tip","title":"Santa Maria Grilled Tri-Tip","emoji":"🧂","art":"roast","blurb":"Central California barbecue at its simplest: salt, pepper, garlic, and a hot fire. Tri-tip has a beefy, almost mineral flavor and slices into thin, juicy fans if you read the grain right.","difficulty":"Medium","servings":"6 servings","prepTime":"15 min","cookTime":"45 min","totalTime":"2 hr 15 min","ingredients":[{"group":"For the roast","items":["1 tri-tip roast (2½ to 3 lb / 1.1 to 1.4 kg), fat cap trimmed to ¼ in (6 mm)","2 tsp (10 ml) neutral oil"]},{"group":"Santa Maria rub","items":["1 tbsp (15 g) kosher salt","1 tbsp coarsely ground black pepper","2 tsp garlic powder","1 tsp onion powder","1 tsp sweet paprika","1 tsp dried rosemary, crumbled","½ tsp (1 g) cayenne pepper"]}],"instructions":[{"title":"Trim and inspect the roast","text":"Trim the fat cap down to about ¼ inch (6 mm) and remove any silverskin, which is the thin, shiny membrane that never renders and turns rubbery. Notice the shape: a tri-tip is a triangle with a thick end and a thin tail, which is why the tail always cooks faster. Pat it completely dry before seasoning."},{"title":"Mix the Santa Maria rub","text":"Stir together the kosher salt, black pepper, garlic powder, onion powder, paprika, crumbled rosemary, and cayenne in a small bowl. Traditional Santa Maria rub is nothing but salt, pepper, and garlic, and the rest here is a light modern touch. Coarse pepper is important — it forms a crust rather than dissolving in."},{"title":"Season and let it rest","text":"Coat the tri-tip on all sides with the rub, pressing it in firmly with your hands so it adheres. Let it sit on a rack at room temperature for 1 hour, or refrigerate uncovered for up to 24 hours for a deeper dry brine. You will see the surface go from dry to wet to tacky as the salt does its work — tacky is when it is ready."},{"title":"Build a two-zone fire","text":"For charcoal, bank a full chimney of lit coals to one side; for gas, light half the burners on high and leave the other half off. Close the lid and let the grill settle so the indirect side reads about 350°F (175°C). Red oak is the traditional Santa Maria wood, and a couple of chunks on the coals is a genuine upgrade if you can find it."},{"title":"Start on the cool side","text":"Brush the tri-tip with the 2 tsp oil and set it on the indirect side, fat cap up, with the thin tail pointed away from the fire. Close the lid and cook for 20 to 30 minutes without opening it. Keeping the thin end away from the heat is how you avoid a well-done tail attached to a rare center."},{"title":"Cook to 115°F","text":"Start checking at 20 minutes with an instant-read thermometer in the thickest part of the roast. Continue until it reads 115°F (46°C), which usually takes 25 to 35 minutes total at 350°F. Grill temperatures vary a lot, so the thermometer decides when to move on, not the clock."},{"title":"Sear over direct heat","text":"Move the roast directly over the coals and sear 2 to 3 minutes per side, rotating as needed to build an even dark crust. Expect flare-ups from the rendering fat cap — slide the meat to a cooler spot for a few seconds rather than fighting the flames. The rub will darken noticeably, which is exactly what you want."},{"title":"Check the final temperature","text":"Pull the tri-tip when the thickest part reads 130°F (54°C) for medium-rare or 138°F (59°C) for medium. Remember that the thin tail will already be 10 to 15 degrees hotter, which is convenient if you are feeding people who like different doneness. Anything past 145°F (63°C) makes this cut noticeably chewy."},{"title":"Rest 15 minutes","text":"Move the roast to a cutting board and rest it uncovered for 15 minutes. This is a big, dense piece of meat and needs the full time for the juices to settle back into the fibers. Do not tent it tightly with foil, which will steam the crust you just built."},{"title":"Find where the grain changes","text":"Look closely at the surface: a tri-tip has two muscle groups whose fibers run in different directions, meeting roughly at the middle of the triangle. Cut the roast in half along that line first, separating the two sections. This one step is what separates good tri-tip from tough tri-tip, and almost everybody gets it wrong the first time."},{"title":"Slice each half against its grain","text":"Turn each half so its fibers run left to right, then slice across them at a slight angle, about ¼ inch (6 mm) thick. You will notice the two halves need to be turned differently, which is the whole point of separating them. Fan the slices out on a warm platter and pour the board juices over the top."},{"title":"Serve family style","text":"Santa Maria style means the meat goes on the table with pinquito or pinto beans, grilled garlic bread, and a simple fresh salsa. Serve immediately while the slices are hot and the crust is still crisp. Any leftovers should be kept in a whole piece and sliced to order so they stay juicy."}],"tips":["This works in the oven too: 350°F (175°C) until 115°F (46°C) internal, roughly 30 to 40 minutes, then sear in a screaming-hot cast-iron skillet for 90 seconds a side.","Tri-tip is common in the western United States and harder to find elsewhere; ask the butcher for a bottom sirloin triangle roast and they will know what you mean.","The dry rub can be mixed in a big batch and stored in a jar for 6 months — it is excellent on steaks, chicken, and potatoes.","Do not slice the whole roast at once if you are not serving it all. Sliced beef dries out within minutes on a platter.","If you cannot find red oak, a chunk of hickory or a couple of soaked oak chips in a foil packet will get you close."],"keyTemp":"Move to the sear at 115°F (46°C) and pull at 130°F (54°C) for medium-rare, resting to 133 to 135°F (56 to 57°C). Above 145°F (63°C) tri-tip gets tough.","pairing":"Pinquito beans, grilled garlic bread, and a big Zinfandel.","videoQuery":"santa maria tri tip grill slicing grain","photoQuery":"santa maria tri tip sliced platter","tags":["Grilling","Barbecue","Crowd Pleaser"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"hanger-steak-chimichurri","title":"Hanger Steak with Chimichurri","emoji":"🌿","art":"steak","blurb":"The butcher's cut, seared hard and drowned in a sharp green herb sauce. Hanger has more flavor than almost anything on the animal, and chimichurri cuts straight through the richness.","difficulty":"Easy","servings":"4 servings","prepTime":"20 min","cookTime":"12 min","totalTime":"40 min","ingredients":[{"group":"For the steak","items":["1¾ lb (800 g) hanger steak, center sinew removed, in 2 lobes","1½ tsp (7 g) kosher salt","1 tsp freshly ground black pepper","1 tbsp (15 ml) neutral oil such as grapeseed"]},{"group":"Chimichurri","items":["1 cup (30 g) finely chopped flat-leaf parsley, packed","2 tbsp finely chopped fresh oregano (or 2 tsp dried)","4 garlic cloves, very finely minced (about 1½ tbsp)","1 small shallot, minced (about 3 tbsp / 30 g)","½ tsp (1 g) red pepper flakes","¼ cup (60 ml) red wine vinegar","⅔ cup (160 ml) extra-virgin olive oil","1 tsp (5 g) kosher salt","½ tsp (1 g) freshly ground black pepper"]}],"instructions":[{"title":"Make the chimichurri first","text":"Combine the parsley, oregano, garlic, shallot, and red pepper flakes in a bowl, then stir in the red wine vinegar and the 1 tsp salt. Let that sit for 10 minutes before adding the oil — the vinegar takes the raw bite off the garlic and shallot in that time. Chop everything by hand rather than using a food processor, which bruises the herbs into a dark paste."},{"title":"Finish and rest the sauce","text":"Whisk in the ⅔ cup olive oil and the ½ tsp black pepper. It should be loose and spoonable, more herbs than liquid, not a smooth emulsion. Let it sit at room temperature for at least 20 minutes while you cook, and taste it again before serving — chimichurri changes noticeably as it sits."},{"title":"Trim the hanger steak","text":"A hanger steak is two lobes joined by a thick line of sinew down the middle. If your butcher has not already done it, run a boning knife down each side of that sinew to release two long, roughly cylindrical pieces. That center line is inedible and will not soften with cooking, so it has to come out."},{"title":"Season and temper","text":"Pat the lobes completely dry and season them all over with the 1½ tsp kosher salt and 1 tsp black pepper. Let them sit at room temperature for 20 minutes; hanger is thick and irregular, so tempering matters. Dry them one more time right before they hit the pan."},{"title":"Heat the skillet hard","text":"Set a 12-inch (30 cm) cast-iron skillet over high heat for 4 to 5 minutes, then add the tablespoon of oil and swirl it. Wait for the first wisp of smoke, around 450°F (230°C). Hanger is coarse-grained and needs an aggressive sear to develop the crust that balances its very beefy flavor."},{"title":"Sear the first side","text":"Lay the lobes in the pan with space between them and sear undisturbed for 3 minutes. It should sizzle loudly and steadily, not sputter quietly. If your pan is not big enough for both pieces with room to spare, cook them one at a time — crowding is the fastest way to lose your crust."},{"title":"Turn and build color all around","text":"Because hanger is roughly cylindrical, turn the lobes a quarter turn every 90 seconds to brown all four sides, 5 to 7 minutes total after the first side. Use tongs and lean the pieces against the pan wall if they will not stay put. The goal is even brown color all the way around, not a crust on two sides only."},{"title":"Check the temperature","text":"Slide a thermometer lengthwise into the thickest lobe and pull the steak at 125 to 128°F (52 to 53°C) for medium-rare. Hanger is one cut you genuinely should not take past medium — the coarse grain that makes it so flavorful also makes it tough and livery when overcooked. If a piece is thinner, pull it earlier and let it rest longer."},{"title":"Rest on a board","text":"Move the steaks to a cutting board and rest 8 to 10 minutes uncovered. Hanger has a loose grain and releases juice readily, so this rest does real work. Do not wrap it in foil, which will steam away the crust you just built."},{"title":"Slice against the very obvious grain","text":"Hanger has the most visible grain of any steak — long, coarse fibers running the length of each lobe. Slice across them at a sharp angle into ¼-inch (6 mm) pieces so each slice shows a wide, marbled face. Cutting with the grain here produces something genuinely difficult to chew."},{"title":"Sauce and serve","text":"Fan the slices on a warm platter, spoon about half the chimichurri over the top, and put the rest in a bowl on the table. The sauce should pool a little and run into the meat, so do not be shy with it. Serve immediately, while the steak is still warm enough to melt slightly into the oil."}],"tips":["Chimichurri keeps in the fridge for up to 5 days and is better after a few hours. Bring it back to room temperature before serving or the olive oil will be cloudy and thick.","Skirt, flank, or flat iron all substitute directly for hanger; adjust the searing time to their thickness and use the same pull temperature.","If your butcher does not carry hanger, ask ahead — there is only one per animal, which is why it used to be the cut butchers took home.","Do not skip the 10-minute vinegar soak for the garlic and shallot. Raw garlic straight into oil stays harsh and can overwhelm the herbs.","Leftover chimichurri is excellent on eggs, roasted potatoes, grilled chicken, and crusty bread."],"keyTemp":"Pull at 125 to 128°F (52 to 53°C) for medium-rare, resting to 130 to 133°F (54 to 56°C). Hanger becomes tough and livery past 140°F (60°C).","pairing":"Blistered shishito peppers and roasted potatoes, with a Malbec.","videoQuery":"hanger steak chimichurri cast iron sear","photoQuery":"hanger steak sliced chimichurri sauce","tags":["Weeknight","Cast Iron","Sauce"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"steak-frites","title":"Steak Frites with Herb Butter","emoji":"🍟","art":"steak","blurb":"Twice-fried French fries and a seared steak under a melting disc of maitre d'hotel butter. The double fry is the whole secret, and once you have done it you will never bake a fry again.","difficulty":"Advanced","servings":"2 servings","prepTime":"25 min","cookTime":"40 min","totalTime":"1 hr 50 min","ingredients":[{"group":"For the frites","items":["2 lb (900 g) russet potatoes, about 3 large","2 qt (2 L) peanut or canola oil, for frying","1½ tsp (7 g) fine sea salt, for finishing"]},{"group":"For the steaks","items":["2 New York strip or sirloin steaks (10 oz / 285 g each, 1¼ in / 3 cm thick)","1½ tsp (7 g) kosher salt","1 tsp freshly ground black pepper","1 tbsp (15 ml) neutral oil"]},{"group":"Maitre d'hotel butter","items":["5 tbsp (70 g) unsalted butter, softened","2 tbsp finely chopped flat-leaf parsley","1 tsp (5 ml) fresh lemon juice","½ tsp (2 g) kosher salt","¼ tsp (1 g) freshly ground black pepper"]}],"instructions":[{"title":"Make the herb butter","text":"Mash the softened butter with the parsley, lemon juice, ½ tsp salt, and ¼ tsp pepper until evenly combined. Roll it into a log in plastic wrap about 1¼ inches (3 cm) across and refrigerate at least 30 minutes until firm. Cold butter melts slowly over the hot steak instead of instantly flooding the plate."},{"title":"Cut the potatoes evenly","text":"Peel the russets and square off the sides, then cut them into batons about ⅜ inch (1 cm) thick and as close to the same size as you can manage. Uneven fries cook unevenly, so the thin ones burn while the thick ones stay raw inside. Russets are essential here — their high starch and low moisture is what makes a fluffy interior possible."},{"title":"Soak away the surface starch","text":"Put the cut potatoes in a bowl of cold water and let them soak for 30 minutes, changing the water once if it clouds heavily. This rinses off loose surface starch that would otherwise make the fries stick together and turn gummy. Drain them and dry them thoroughly on kitchen towels — water and hot oil is a dangerous combination."},{"title":"Set up the fryer safely","text":"Pour the oil into a heavy 6-quart pot until it comes no more than a third of the way up the sides, and clip on a deep-fry thermometer. Never fill past a third; oil expands and foams violently when wet potatoes go in. Keep a lid and a box of baking soda nearby, and never use water on an oil fire."},{"title":"First fry at 325°F","text":"Heat the oil to 325°F (163°C) and fry the potatoes in three batches for 5 to 6 minutes each, until they are soft and pale blond but not browned. Move them with a spider to a paper-towel-lined rack. The first fry is about cooking the inside through, not color, so resist the urge to leave them longer."},{"title":"Rest the fries","text":"Let the blanched fries rest at room temperature for at least 20 minutes, or refrigerate them for up to 4 hours. This rest lets the surface dry and the interior set, which is why twice-fried fries stay crisp far longer than single-fried ones. Meanwhile, let the oil come back to temperature and season your steaks."},{"title":"Season and temper the steaks","text":"Pat the steaks completely dry and season on both sides and the edges with the 1½ tsp kosher salt and 1 tsp black pepper. Leave them at room temperature for 20 to 30 minutes so the centers are not fridge-cold. Get a cast-iron skillet heating on a second burner over medium-high for 4 to 5 minutes."},{"title":"Sear the steaks","text":"Add the tablespoon of oil to the hot skillet, wait for the shimmer, and lay the steaks in away from you. Sear 3½ to 4 minutes on the first side and 3 minutes on the second, then stand them on their fat edge for 30 seconds. You want an aggressive, steady sizzle the whole time and a deep brown crust when you flip."},{"title":"Pull and rest the steaks","text":"Check the center with an instant-read thermometer and pull at 125°F (52°C) for medium-rare or 135°F (57°C) for medium. Move them to a cutting board and rest 8 to 10 minutes while you finish the fries. Steak reheats badly, so the timing here matters: the steak rests exactly as long as the second fry takes."},{"title":"Second fry at 375°F","text":"Raise the oil to 375°F (190°C) and fry the rested potatoes in batches for 2 to 3 minutes each, until deep golden and audibly crisp when you stir them. Do not crowd the pot — too many at once drops the temperature and gives you greasy, limp fries. Let the oil come back to 375°F between batches."},{"title":"Salt the fries immediately","text":"Drain each batch onto a rack or paper towels and season right away with the fine sea salt while the surface is still glistening with oil. Salt only sticks in that first 20 seconds; add it later and it slides straight off. Toss them in a bowl so they season evenly."},{"title":"Plate and serve at once","text":"Set each steak on a warm plate, top with a ½-inch (1 cm) coin of the herb butter, and pile the frites alongside in a tall heap. Pour any board juices over the meat. This is a dish that waits for nobody — get it to the table while the fries are still crackling and the butter is only half melted."}],"tips":["Do the first fry up to 4 hours ahead and refrigerate the blanched fries. That turns this from a juggling act into a very manageable dinner.","A deep-fry or instant-read thermometer is genuinely required. Oil that is too cool gives you greasy fries; too hot and they brown before the inside cooks.","Peanut oil has the highest smoke point and the cleanest flavor, but canola works fine. Strain and reuse the cooled oil two or three times.","If you only have one burner free, fry first and keep the fries warm on a rack in a 200°F (95°C) oven, then sear the steaks last.","Maitre d'hotel butter freezes for 3 months; slice coins off the frozen log straight onto hot steak, fish, or vegetables."],"keyTemp":"Steak: pull at 125°F (52°C) for medium-rare, resting to 130 to 135°F (54 to 57°C). Oil: 325°F (163°C) for the first fry, 375°F (190°C) for the second.","pairing":"A simple butter-lettuce salad with mustard vinaigrette, and a cold Belgian-style beer or a Côtes du Rhône.","videoQuery":"steak frites double fried french fries","photoQuery":"steak frites herb butter plate","tags":["Date Night","French","Bistro"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"prime-rib-roast-au-jus","title":"Prime Rib Roast with Au Jus","emoji":"🍖","art":"roast","blurb":"A standing rib roast cooked low and slow, then blasted at the end for a crackling crust. This is the holiday centerpiece, and the low-oven method makes it almost impossible to overcook.","difficulty":"Advanced","servings":"8 servings","prepTime":"25 min","cookTime":"3 hr 15 min","totalTime":"4 hr 10 min","ingredients":[{"group":"For the roast","items":["1 bone-in standing rib roast, 3 to 4 ribs (7 to 8 lb / 3.2 to 3.6 kg)","4 tsp (20 g) kosher salt, about 1 tsp per 2 lb of meat","1 tbsp coarsely ground black pepper","2 tsp garlic powder","2 tbsp (28 g) unsalted butter, softened","1 tbsp chopped fresh rosemary and 1 tbsp chopped fresh thyme"]},{"group":"Au jus","items":["1 yellow onion, quartered","2 carrots, cut into 2-inch (5 cm) pieces","½ cup (120 ml) dry red wine or dry sherry","3 cups (720 ml) low-sodium beef stock","3 sprigs fresh thyme and 1 bay leaf","1 tbsp (14 g) cold unsalted butter","½ tsp kosher salt, plus more to taste"]}],"instructions":[{"title":"Dry brine 24 to 48 hours ahead","text":"Pat the roast completely dry and rub it all over with the 4 tsp kosher salt, including the ends and between the bones. Set it on a rack over a sheet pan and refrigerate uncovered for 24 to 48 hours. This is the most important step in the recipe: it seasons the interior, dries the surface for a better crust, and there is no shortcut that gets you the same result."},{"title":"Temper the roast","text":"Take the roast out of the fridge 2 to 3 hours before it goes in the oven and leave it on the counter. A cold 8-pound roast can add well over an hour of cooking time and will cook far less evenly. It is safe: the surface stays well below any danger zone concern for this window, and the interior barely climbs."},{"title":"Make the herb paste","text":"Mash the softened butter with the chopped rosemary, thyme, black pepper, and garlic powder into a rough paste. Smear it over the fat cap and the exposed meat ends, but not the bones. The butter helps the herbs adhere and browns into the crust during the final blast."},{"title":"Set the roasting pan","text":"Scatter the quartered onion and carrot pieces across the bottom of a roasting pan and set the roast on top, bone-side down, so the bones act as a natural rack. If you have a wire rack, use it and put the vegetables underneath. Insert a leave-in probe thermometer into the very center of the eye, avoiding bone and fat seams."},{"title":"Roast low at 250°F","text":"Heat the oven to 250°F (120°C) and roast, uncovered, until the center hits 118 to 120°F (48 to 49°C) for medium-rare. Plan on roughly 25 to 30 minutes per pound, so about 3 to 3½ hours for an 8-pound roast, but check early. A low oven cooks the meat evenly edge to edge instead of leaving a thick gray band under the crust."},{"title":"Trust the thermometer, not the clock","text":"Start checking at the 2½-hour mark, and every 20 minutes after that. Roast weight, bone-in versus boneless, oven calibration, and starting temperature all swing the timing by an hour or more. For medium, take it to 128°F (53°C); the final crust blast will add about 5 to 10°F (3 to 6°C) on top of whatever it reads now."},{"title":"Rest the roast, uncovered","text":"Pull the roast out, transfer it to a carving board, and let it rest 30 to 45 minutes while the oven heats up. It will hold its heat easily — a roast this size loses only a few degrees in that window. Leave it uncovered so the surface stays dry for the crust step."},{"title":"Build the jus base","text":"Set the roasting pan with its vegetables over two burners on medium heat, skim off all but 2 tablespoons of fat, and pour in the ½ cup wine. Scrape the pan hard with a wooden spoon to lift every browned bit and let it reduce by half, about 3 minutes. Add the 3 cups beef stock, thyme sprigs, and bay leaf and simmer 12 to 15 minutes."},{"title":"Blast the oven for the crust","text":"Crank the oven to 500°F (260°C) and let it fully preheat, which takes 15 to 20 minutes. Return the rested roast on a clean sheet pan and roast for 6 to 10 minutes, watching closely, until the exterior is deeply browned and crackling. Pull it the moment it looks right; at this temperature it goes from perfect to burnt in about 3 minutes."},{"title":"Finish the au jus","text":"Strain the jus through a fine-mesh sieve into a small saucepan, pressing the vegetables gently, and discard the solids. Skim any remaining fat off the surface, bring it to a simmer, and whisk in the cold tablespoon of butter until glossy. Taste and add the ½ tsp salt as needed — jus should be intensely beefy and thin, not thick like gravy."},{"title":"Carve off the bones","text":"Stand the roast on end and run a long knife down between the meat and the rib bones, following the curve, to release the whole eye in one piece. Cut the bone rack into individual ribs for anyone at the table who wants one, because they are the best part. Set the boneless roast flat on the board."},{"title":"Slice and serve","text":"Slice the roast across the grain into ½- to ¾-inch (1 to 2 cm) thick pieces, keeping the crust attached to each slice. Serve on warm plates with the au jus in a pitcher alongside and any board juices poured over. Prime rib cools fast, so warm the plates and get everyone seated before you start carving."}],"tips":["Buy the roast a few days early so you have time for the 24- to 48-hour dry brine. It is the difference between good prime rib and great prime rib.","Ask the butcher to cut the bones free and tie them back on. You get the flavor and insulation of bone-in, and carving becomes trivially easy.","A leave-in probe thermometer is not optional on a roast this expensive. Opening the oven to check repeatedly costs you both heat and accuracy.","Plan on about 1 pound of bone-in roast per person, or two people per rib. An 8-pound, 4-rib roast comfortably serves 8.","Serve horseradish cream alongside: stir ¼ cup prepared horseradish, ½ cup sour cream, 1 tsp lemon juice, and ¼ tsp salt together and chill for an hour."],"keyTemp":"Roast at 250°F (120°C) to 118 to 120°F (48 to 49°C) for medium-rare, then blast at 500°F (260°C); final temperature after the crust step is 128 to 132°F (53 to 56°C). Medium is 140°F (60°C).","pairing":"Yorkshire puddings, creamed spinach, and a serious Cabernet Sauvignon or Bordeaux.","videoQuery":"prime rib roast low temperature au jus","photoQuery":"prime rib roast sliced au jus","tags":["Holiday","Showstopper","Weekend"],"cat":"Steaks & Beef","catSlug":"steaks-and-beef","catEmoji":"🥩"},{"id":"pan-seared-scallops-brown-butter","title":"Pan-Seared Scallops with Brown Butter","emoji":"🐚","art":"scallop","blurb":"A deep golden crust on top, a barely-set sweet center, and a nutty brown butter pan sauce you spoon over at the last second. It is a restaurant plate that takes ten minutes.","difficulty":"Medium","servings":"2 servings","prepTime":"10 min","cookTime":"10 min","totalTime":"20 min","ingredients":[{"group":"For the scallops","items":["1 lb (450 g) dry-packed sea scallops (U-10 or U-12 size, about 10-12 scallops)","1 tsp kosher salt","1/2 tsp freshly ground black pepper","1 tbsp (15 ml) grapeseed or avocado oil"]},{"group":"Brown butter pan sauce","items":["4 tbsp (55 g) unsalted butter, cut into 4 pieces","2 garlic cloves, thinly sliced","1 tbsp (15 ml) fresh lemon juice, plus 1/2 tsp finely grated zest","1 tbsp (9 g) capers, drained (optional)","2 tbsp (8 g) chopped fresh flat-leaf parsley","1/4 tsp flaky sea salt, for finishing"]}],"instructions":[{"title":"Buy the right scallops","text":"Ask for dry-packed or dry sea scallops, which are sold without the phosphate solution that wet scallops swim in. Wet scallops look bright white and sit in milky liquid, and they will steam instead of sear no matter how hot your pan is. Dry scallops look slightly ivory or pinkish and feel tacky. This one purchase decision matters more than anything else you do tonight."},{"title":"Remove the side muscle","text":"Look along the side of each scallop for a small rectangular tab of firmer, slightly fibrous flesh. Pinch it and peel it away with your fingers — it comes off easily and takes two seconds per scallop. That muscle turns rubbery and chewy when cooked, so pulling it off is the difference between tender and stringy."},{"title":"Dry them hard","text":"Lay the scallops on a plate lined with a double layer of paper towels, then press another towel firmly on top. Let them sit uncovered for 10 minutes, changing the towel once if it soaks through. Surface water has to boil off before browning can start, and every drop you remove now is a second of searing you get back later. They should feel dry and slightly sticky to the touch."},{"title":"Season at the last minute","text":"Season the scallops with the 1 tsp kosher salt and 1/2 tsp pepper right before they hit the pan, not a moment earlier. Salt pulls moisture to the surface within a minute or two, which undoes all the drying you just did. Set the seasoned scallops near the stove so you can move fast."},{"title":"Get the pan properly hot","text":"Set a 12 in (30 cm) stainless steel or cast iron skillet over medium-high heat for 2-3 minutes, then add the 1 tbsp oil and swirl. The oil should shimmer and thin out, moving like water, with the first faint wisp of smoke. If it is billowing smoke, pull the pan off the heat for 30 seconds — too hot scorches the sugars before the inside warms through. Avoid nonstick here; it does not hold enough heat to build a real crust."},{"title":"Sear side one and do not touch","text":"Lay the scallops in the pan one at a time, working clockwise so you know which went in first, and leave at least 1 in (2.5 cm) between them. Crowding drops the pan temperature and traps steam. Do not move, poke, or peek for a full 2 to 3 minutes — you should hear a steady aggressive sizzle, not a quiet hiss. When the bottom edge has gone deep amber, they will release from the pan on their own."},{"title":"Flip and finish fast","text":"Flip each scallop with tongs or a thin fish spatula and cook just 60 to 90 seconds on the second side. A 1 1/2 in (4 cm) scallop needs about 4 minutes of total cooking, and the second side is only there to set it. Press the side gently: it should feel like the fleshy pad below your thumb, with a little give. Overcooked scallops feel firm and springy like a rubber eraser."},{"title":"Rest them off the heat","text":"Move the scallops to a warm plate, seared side up, and let them sit while you make the sauce. They carry over about 5°F (3°C) as they rest, drifting from 125°F to 130°F (52°C to 54°C) in the center, which is exactly where they are sweet and just barely translucent. Do not tent them with foil — trapped steam will soften the crust you just worked for."},{"title":"Brown the butter","text":"Turn the heat to medium, add the 4 tbsp butter to the same pan, and swirl constantly as it melts and foams. In 2 to 3 minutes the foam will subside, the milk solids on the bottom will turn the color of a hazelnut, and it will smell toasty and sweet. Brown butter goes from perfect to burnt in about 20 seconds, so keep the pan moving and trust your nose more than your eyes."},{"title":"Finish the sauce off heat","text":"Pull the pan off the burner, add the sliced garlic and swirl for 30 seconds in the residual heat so it perfumes the butter without scorching. Stir in the 1 tbsp lemon juice, the zest, the capers if using, and the parsley — the lemon will hiss and cut the richness. Taste and add a pinch more salt if it needs it."},{"title":"Plate and serve immediately","text":"Arrange the scallops seared side up on warm plates and spoon the brown butter over and around them, making sure the browned bits get divided fairly. Finish with the 1/4 tsp flaky salt. Scallops wait for no one — serve them within a minute or two, while the crust is still crisp against the soft center."}],"tips":["If your scallops release a puddle of liquid the second they hit the pan, they were wet-packed. Pour off the liquid, let the pan get hot again, and finish them — you will get flavor but not much crust.","Sear in two batches rather than crowding a small pan. Two perfect batches beat one steamed one, and the second batch cooks in the flavorful fat from the first.","No thermometer works well on something this thin — go by feel and by the clock. Four minutes total for 1 1/2 in scallops, five for anything bigger.","Brown butter can be made up to a week ahead and refrigerated. Rewarm it gently and add the lemon and herbs fresh, since acid and parsley fade fast.","Serve over creamy polenta, pea puree, or just good bread — you want something to catch the butter."],"keyTemp":"Pull at 125-130°F (52-54°C) in the center for sweet, just-set scallops; the FDA guideline for fully cooked shellfish is 145°F (63°C), which will be firmer.","pairing":"A cold glass of unoaked Chardonnay or Sancerre, with crusty bread and a simple arugula salad.","videoQuery":"how to pan sear scallops brown butter","photoQuery":"seared scallops brown butter plate","tags":["Date Night","30 Minutes","Cast Iron"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"garlic-butter-shrimp-scampi","title":"Garlic Butter Shrimp Scampi","emoji":"🍤","art":"shrimp","blurb":"Shrimp, a lot of garlic, white wine, lemon, and enough butter to make a sauce worth mopping up. This is the twenty-minute dinner you will make more than any other recipe in this chapter.","difficulty":"Easy","servings":"4 servings","prepTime":"10 min","cookTime":"15 min","totalTime":"25 min","ingredients":[{"group":"For the shrimp","items":["1 1/2 lb (680 g) large shrimp (16-20 count), peeled and deveined, tails on","1 tsp kosher salt","1/2 tsp freshly ground black pepper","1/2 tsp red pepper flakes","2 tbsp (30 ml) olive oil"]},{"group":"Garlic butter sauce","items":["6 tbsp (85 g) unsalted butter, cut into pieces","8 garlic cloves, thinly sliced (about 3 tbsp)","1/2 cup (120 ml) dry white wine such as Pinot Grigio or Sauvignon Blanc","3 tbsp (45 ml) fresh lemon juice, plus 1 tsp grated zest","1/4 cup (10 g) chopped fresh flat-leaf parsley","1 baguette (about 12 oz / 340 g), sliced and toasted, for serving"]}],"instructions":[{"title":"Thaw and dry the shrimp","text":"If your shrimp are frozen, put them in a colander under cold running water for 5 minutes, or in a bowl of cold water for 15 — never in warm water, which starts cooking the outside. Spread them on a towel-lined sheet pan and blot the tops dry as well. Wet shrimp drop the pan temperature and boil in their own liquid instead of picking up any color."},{"title":"Season and let them sit","text":"Toss the dried shrimp with the 1 tsp kosher salt, 1/2 tsp black pepper, and 1/2 tsp red pepper flakes in a bowl. Let them sit for 10 minutes at room temperature while you slice the garlic and squeeze the lemon. Slightly less-than-fridge-cold shrimp cook more evenly in the 90 seconds per side they get."},{"title":"Slice the garlic, do not mince it","text":"Thinly slice all 8 cloves rather than mincing them. Minced garlic has more cut surface and burns in a hot pan in under a minute, turning bitter and gritty. Slices hold their shape, sweeten as they cook, and end up as little tender chips in the sauce."},{"title":"Heat the skillet","text":"Set a 12 in (30 cm) skillet over medium-high heat and add the 2 tbsp olive oil. When the oil shimmers and a single shrimp laid in the pan sizzles immediately and steadily, you are ready. If it screams and smokes, back the heat down a notch — you want a confident sizzle, not a scorch."},{"title":"Sear the shrimp in one layer","text":"Lay the shrimp in the pan in a single layer without crowding, working in two batches if your pan is smaller than 12 in. Cook 60 to 90 seconds per side, until the bottoms are pink with a few golden spots and the flesh has just turned opaque at the edge. They will still be slightly underdone in the center and that is intentional — they finish in the sauce."},{"title":"Get them out of the pan","text":"Transfer the shrimp to a clean plate the moment the second side turns pink, and do not stack them in a pile. Shrimp go from tender to rubbery in about 30 seconds of extra heat, and the residual heat in a crowded plate keeps cooking them. This pull-and-return method is the single biggest reason home scampi comes out tough."},{"title":"Sweat the garlic in butter","text":"Lower the heat to medium, add 2 tbsp of the butter to the empty skillet, and add the sliced garlic. Stir constantly for 45 to 60 seconds, until the garlic is fragrant and just barely blonde at the edges. The second you see it turning tan, move to the next step — brown garlic tastes bitter and you cannot fix it."},{"title":"Deglaze with wine","text":"Pour in the 1/2 cup white wine and scrape the bottom of the pan with a wooden spoon to lift the browned bits, which are pure shrimp flavor. Simmer briskly for 2 to 3 minutes until the liquid has reduced by about half and no longer smells sharply of alcohol. If you skip this reduction the sauce tastes boozy and thin."},{"title":"Build the butter sauce","text":"Turn the heat to low and whisk in the remaining 4 tbsp butter one piece at a time, adding the next only when the last has melted. Adding cold butter slowly to a gently simmering liquid emulsifies it into a glossy sauce instead of a greasy slick. Stir in the 3 tbsp lemon juice and the zest, then taste for salt."},{"title":"Return the shrimp and warm through","text":"Slide the shrimp and any juices on the plate back into the pan and toss for 30 to 60 seconds, just long enough to heat them and coat them. They are done when they have curled into a loose C shape and are opaque all the way through. A tight O shape means they went too far."},{"title":"Finish and serve","text":"Kill the heat, scatter the 1/4 cup parsley over the top, and give one last toss. Serve straight from the skillet with plenty of toasted baguette for the sauce, or spoon it over 1 lb of cooked linguine if you want to stretch it to six people. Eat it right away — the sauce is at its best in the first ten minutes."}],"tips":["Buy shrimp with the shells on and peel them yourself if you have five extra minutes. Simmer the shells in the white wine for 10 minutes, strain, and use that wine for the sauce — it doubles the depth.","No wine in the house? Use 1/2 cup (120 ml) chicken or seafood stock plus 1 extra tsp of lemon juice. Do not use cooking wine, which is heavily salted.","If the sauce breaks and looks oily, pull it off the heat and whisk in 1 tbsp (15 ml) of cold water or a small cube of cold butter to bring it back together.","The shrimp can be peeled, seasoned, and refrigerated up to 6 hours ahead. Everything else comes together in the time it takes to toast the bread.","Frozen shrimp are almost always a better buy than thawed shrimp at the counter, which were frozen and thawed for you at some unknown hour."],"keyTemp":"Shrimp are done at 145°F (63°C) — opaque throughout and curled into a loose C. A tight O means overcooked.","pairing":"The same dry white you cooked with, plus a green salad and a lot of bread.","videoQuery":"garlic butter shrimp scampi skillet recipe","photoQuery":"shrimp scampi skillet garlic butter","tags":["30 Minutes","One Pan","Weeknight"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"maryland-crab-cakes-remoulade","title":"Maryland Crab Cakes with Remoulade","emoji":"🦀","art":"crab","blurb":"Almost all crab, barely any filler, held together with just enough binder to survive the pan. Make them once and you will never order crab cakes out again.","difficulty":"Medium","servings":"Makes 8 cakes","prepTime":"20 min","cookTime":"10 min","totalTime":"1 hr (includes 30 min chill)","ingredients":[{"group":"For the crab cakes","items":["1 lb (450 g) jumbo lump crabmeat, picked over for shell","1 large egg, beaten","1/4 cup (55 g) mayonnaise","1 tbsp (15 g) Dijon mustard","2 tsp (10 ml) Worcestershire sauce","1 1/2 tsp Old Bay seasoning","1 tsp (5 ml) fresh lemon juice","2 tbsp (8 g) chopped fresh flat-leaf parsley","3/4 cup (40 g) panko breadcrumbs, or 12 saltine crackers finely crushed","3 tbsp (42 g) unsalted butter plus 1 tbsp (15 ml) neutral oil, for frying","1 lemon (about 4 oz / 115 g), cut into 8 wedges, for serving"]},{"group":"Remoulade","items":["3/4 cup (165 g) mayonnaise","1 tbsp (15 g) whole grain or Creole mustard","1 tbsp (15 ml) fresh lemon juice","1 tbsp (10 g) minced cornichons or dill pickle","1 tbsp (10 g) minced shallot","2 tsp (10 ml) hot sauce such as Crystal or Tabasco","1 tsp (5 g) capers, minced","1/2 tsp smoked paprika","1/4 tsp kosher salt"]}],"instructions":[{"title":"Make the remoulade first","text":"Stir the 3/4 cup mayonnaise, mustard, 1 tbsp lemon juice, cornichons, shallot, hot sauce, capers, smoked paprika, and 1/4 tsp salt together in a small bowl. Cover and refrigerate while you make the cakes — 30 minutes minimum, and it is better the next day. The raw shallot mellows and the flavors marry into something that tastes like a sauce rather than a list of ingredients."},{"title":"Pick through the crab gently","text":"Spread the 1 lb crabmeat on a sheet pan and run your fingertips through it, feeling for shards of shell and cartilage, which are common even in expensive containers. Lift and separate rather than stirring, keeping the big lumps whole. Those intact lumps are the entire point of a good crab cake, and every time you stir you break them down into shreds."},{"title":"Whisk the binder separately","text":"In a large bowl, whisk the beaten egg, 1/4 cup mayonnaise, Dijon, Worcestershire, Old Bay, 1 tsp lemon juice, and parsley until completely smooth. Mixing the wet ingredients before the crab goes in means you only have to fold two or three times at the end. This is the trick that keeps the lumps intact."},{"title":"Fold in the crab and panko","text":"Add the crab and the 3/4 cup panko to the bowl and fold with a rubber spatula, scooping from the bottom and turning over, no more than 5 or 6 strokes. Stop the second everything looks moistened, even if it seems loose. The mixture should just barely hold when squeezed; a mixture that packs like meatloaf has too much binder and will taste like bread."},{"title":"Shape and chill","text":"Divide the mixture into 8 portions of about 3 oz (85 g) each and shape into pucks roughly 3 in (7.5 cm) wide and 1 in (2.5 cm) thick, handling them as little as possible. Set them on a parchment-lined sheet pan, cover, and refrigerate at least 30 minutes and up to 24 hours. Chilling firms the mayonnaise and egg so the cakes hold together in the pan — skip it and they will fall apart."},{"title":"Heat the pan and fat","text":"Set a 12 in (30 cm) cast iron or heavy stainless skillet over medium heat and add 2 tbsp of the butter along with the 1 tbsp oil, holding back the last tablespoon of butter for the second batch. The oil keeps the butter from burning while the butter does the browning. When the foam subsides and a stray breadcrumb sizzles steadily, the pan is ready — medium heat, not high, because these need time for the center to warm through."},{"title":"Fry the first side","text":"Lay 4 cakes in the pan with at least 1 in (2.5 cm) between them and cook undisturbed for 4 to 5 minutes. You are looking for a deep golden brown crust that comes up the sides about a quarter inch. Do not press them down with the spatula — squashing them pushes out the moisture that keeps the inside sweet and tender."},{"title":"Flip carefully","text":"Slide a thin spatula all the way under each cake, supporting it with your fingers or a second spatula, and turn it in one confident motion. Hesitating is what breaks crab cakes. Cook the second side 3 to 4 minutes, until equally browned and heated through to 145°F (63°C) in the center."},{"title":"Drain and repeat","text":"Move the finished cakes to a wire rack set over a sheet pan rather than onto paper towels, which trap steam and soften the crust. Wipe out any burnt crumbs, add the reserved 1 tbsp butter, and cook the second batch the same way. Keep the first batch warm in a 200°F (95°C) oven for up to 20 minutes."},{"title":"Serve with lemon and remoulade","text":"Plate two cakes per person with a generous spoonful of the chilled remoulade and two of the lemon wedges. Squeeze the lemon right before eating rather than at the stove — the acid wakes up the sweetness of the crab, but it also softens the crust if it sits. A pile of dressed greens on the side is all these need."}],"tips":["Jumbo lump is best but expensive. Backfin or lump is a fine, cheaper choice; skip claw meat, which is dark and stringy for cakes, and never use imitation crab here.","Shaped, uncooked cakes freeze beautifully. Freeze solid on a sheet pan, bag them, and cook from frozen over medium-low heat, adding 3-4 minutes per side.","To broil instead of fry, brush the tops with melted butter and broil 6 in (15 cm) from the element for 8-10 minutes, no flipping.","If your first cake breaks apart in the pan, fold 2 more tbsp of panko into the remaining mixture and chill another 15 minutes before trying again.","The remoulade doubles as a sandwich spread and a dip for fried shrimp — make a full batch even if you only need half."],"keyTemp":"Crabmeat is already cooked; heat the cakes to 145°F (63°C) in the center, with a deep golden crust on both sides.","pairing":"A crisp lager or dry Riesling, with corn on the cob or a simple tomato salad.","videoQuery":"maryland crab cakes recipe jumbo lump","photoQuery":"maryland crab cakes remoulade plate","tags":["Date Night","Make Ahead","Classic"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"broiled-lobster-tails-drawn-butter","title":"Broiled Lobster Tails with Drawn Butter","emoji":"🦞","art":"lobster","blurb":"Butterflied so the meat sits proud of the shell, brushed with butter, and under the broiler for eight minutes. It looks like a celebration and cooks faster than a baked potato.","difficulty":"Medium","servings":"4 servings","prepTime":"15 min","cookTime":"10 min","totalTime":"25 min","ingredients":[{"group":"For the lobster","items":["4 lobster tails, 6-8 oz (170-225 g) each, thawed if frozen","4 tbsp (55 g) unsalted butter, melted","2 garlic cloves, finely grated","1 tsp kosher salt","1/2 tsp sweet paprika","1/4 tsp freshly ground black pepper","1 tbsp (15 ml) fresh lemon juice","1 tbsp (4 g) chopped fresh parsley"]},{"group":"Drawn butter","items":["8 tbsp (115 g) unsalted butter, cut into pieces","1/2 tsp kosher salt","1 lemon (about 4 oz / 115 g), cut into wedges"]}],"instructions":[{"title":"Thaw the tails properly","text":"Move frozen tails to the refrigerator the night before, or seal them in a bag and submerge in cold water for 30 to 45 minutes, changing the water once. Never thaw lobster in warm water or the microwave, which turns the delicate outer layer to mush before the center is even soft. Fully thawed tails feel pliable and the meat springs back when pressed."},{"title":"Cut the top shell","text":"Set a tail belly-down on a cutting board and use sturdy kitchen shears to cut down the center of the top shell, from the wide open end to the base of the tail fan, stopping just before the fan itself. Cut through the shell only, not deep into the meat. Kitchen shears are worth digging out — a knife slips on the curved shell and this is how people cut themselves."},{"title":"Butterfly the meat","text":"Spread the shell open with your thumbs until you hear it crack, then slide your fingers underneath the meat and lift it up and out so it rests on top of the closed shell, leaving it attached at the tail fan. Press the empty shell halves back together underneath it. This piggyback presentation is what restaurants do, and it also lifts the meat closer to the broiler so it cooks evenly."},{"title":"Score and season","text":"Run a knife 1/4 in (6 mm) deep down the length of the exposed meat to help it cook evenly and open slightly as it heats. Rinse away the dark vein if you see one and pat the meat dry with a paper towel. Season all over with the 1 tsp kosher salt and 1/4 tsp pepper."},{"title":"Mix the garlic butter","text":"Stir the 4 tbsp melted butter with the grated garlic, 1/2 tsp paprika, and 1 tbsp lemon juice in a small bowl. Grating the garlic instead of mincing it means no chunks that can scorch under the broiler. Brush about two thirds of this mixture generously over the exposed meat, letting it pool in the split shell."},{"title":"Set up the broiler","text":"Position an oven rack so the top of the lobster meat will sit 5 to 6 in (13-15 cm) below the broiler element and preheat the broiler on high for a full 5 minutes. A cold broiler will not brown the butter or spot the meat. Arrange the tails on a foil-lined rimmed sheet pan, spaced 2 in (5 cm) apart."},{"title":"Broil and watch","text":"Broil for 8 to 10 minutes for 6-8 oz tails, roughly 1 minute per ounce, without flipping. Stay in the kitchen and look through the oven door at the 6 minute mark — broilers vary wildly and butter can go from golden to black quickly. The shells will turn bright red-orange and the meat will puff slightly and turn opaque white."},{"title":"Check for doneness","text":"Slide an instant-read thermometer into the thickest part of the tail from the side; it should read 140°F (60°C) for the classic tender texture, and the FDA guideline for fully cooked shellfish is 145°F (63°C). The meat should be opaque and pearly white all the way through with no translucent gray in the center. Pull them the moment they hit temperature, because lobster carries over and turns tough and squeaky fast."},{"title":"Make the drawn butter","text":"While the tails broil, melt the 8 tbsp butter in a small saucepan over low heat without stirring and let it sit for 2 minutes. The white milk solids sink and the foam rises; skim the foam and pour off the clear golden butter, leaving the milky layer behind. Season with the 1/2 tsp salt — this is drawn butter, and it stays clear and rich instead of going cloudy."},{"title":"Finish and serve hot","text":"Brush the tails with the reserved garlic butter, scatter the 1 tbsp parsley over the top, and serve immediately with the drawn butter in small warm bowls and lemon wedges alongside. Lobster loses its magic as it cools, so get it to the table straight from the oven. Give everyone a small fork and permission to use their fingers."}],"tips":["Cold-water tails from Maine or Canada are firmer and sweeter than warm-water tails, which can be mushy. If the packaging does not say, look for tails with clean white meat and no yellowing.","If the tails are larger than 8 oz (225 g), broil 6 in (15 cm) away for 10-12 minutes and check the temperature early — thickness matters more than weight.","Squeaky, rubbery lobster is overcooked lobster. There is no fixing it, so buy a thermometer and pull at 140°F (60°C).","Save the shells in the freezer. Simmered with onion, celery, and water for 45 minutes, they make a stock that turns a basic bisque or the cioppino in this chapter into something special.","Warm the serving plates in a 200°F (95°C) oven for a few minutes so the butter does not congeal on the plate."],"keyTemp":"Broil to 140°F (60°C) at the thickest part for tender lobster; 145°F (63°C) is the FDA fully-cooked guideline. Meat should be opaque white with no translucent center.","pairing":"Buttery Chardonnay or Champagne, with roasted asparagus and a baked potato.","videoQuery":"how to broil lobster tails butterflied","photoQuery":"broiled lobster tails drawn butter","tags":["Date Night","30 Minutes","Special Occasion"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"crispy-skin-pan-seared-salmon","title":"Crispy-Skin Pan-Seared Salmon","emoji":"🐟","art":"salmon","blurb":"Skin like a potato chip, flesh still rosy and silky in the middle. Once you learn the press-and-wait trick, this is a fifteen-minute dinner you can make half asleep.","difficulty":"Easy","servings":"4 servings","prepTime":"15 min","cookTime":"10 min","totalTime":"25 min","ingredients":[{"group":"Ingredients","items":["4 skin-on salmon fillets, 6 oz (170 g) each, about 1 in (2.5 cm) thick","1 1/2 tsp kosher salt","1/2 tsp freshly ground black pepper","1 tbsp (15 ml) grapeseed, avocado, or other neutral high-heat oil","2 tbsp (30 g) unsalted butter","3 sprigs fresh thyme","2 garlic cloves, lightly smashed","1 lemon (about 4 oz / 115 g), half juiced and half cut into wedges","1/2 tsp flaky sea salt, for finishing"]}],"instructions":[{"title":"Take the chill off","text":"Unwrap the fillets and let them sit at room temperature for 15 minutes before cooking. Ice-cold fish hitting a hot pan seizes up, cooks unevenly, and takes long enough that the outside overcooks before the middle warms. Fifteen minutes on the counter is safe and makes a noticeable difference in how evenly the fillet cooks."},{"title":"Dry the skin obsessively","text":"Blot both sides with paper towels, then go back to the skin side and press hard with a fresh towel until it feels almost papery. If you have the time, leave the fillets uncovered on a rack in the fridge for 30 minutes. Crisp skin is a moisture problem before it is a heat problem, and damp skin sticks to the pan and tears."},{"title":"Check for pin bones","text":"Run your fingertips along the center line of each fillet from the thick end toward the tail. If you feel the tips of small bones, pull them straight out with fish tweezers or clean needle-nose pliers, angling in the direction they point. It takes a minute now and saves an unpleasant surprise at the table."},{"title":"Season right before cooking","text":"Season both sides with the 1 1/2 tsp kosher salt and 1/2 tsp pepper immediately before the fish goes in the pan. Salting early draws beads of moisture to the surface of the skin, which is exactly what you have spent the last ten minutes fighting. Salt the skin a touch more heavily than the flesh — it seasons the crust."},{"title":"Heat the pan correctly","text":"Set a 12 in (30 cm) stainless steel or cast iron skillet over medium-high heat for 2 minutes, add the 1 tbsp oil, and swirl to coat. When the oil shimmers and moves like water with the first wisp of smoke, it is ready. Nonstick works in a pinch but will never give you the same crackling skin, since it cannot take this level of heat."},{"title":"Lay the fish in away from you","text":"Place each fillet skin side down, laying it into the pan away from your body so any splatter goes the other direction. Immediately press the top of each fillet firmly with a flexible spatula for 20 to 30 seconds. Salmon skin contracts the second it meets heat and curls the fillet into an arch, and this brief press keeps the whole skin flat against the pan."},{"title":"Leave it alone","text":"Cook skin side down for 4 to 5 minutes without moving the fish — this is about 70 percent of the total cooking time. Listen for a steady, even sizzle; if it goes quiet, raise the heat slightly, and if it starts spitting violently and smoking, lower it. Watch the side of the fillet: you will see the opaque pink line creep up from the bottom, and you want it about two thirds of the way up before you flip."},{"title":"Flip and add the butter","text":"Turn the fillets with a thin spatula — properly crisped skin releases without a fight — and add the 2 tbsp butter, thyme sprigs, and smashed garlic to the pan. The butter will foam immediately and start smelling nutty within a minute. Cook the second side just 1 to 2 minutes."},{"title":"Baste the top","text":"Tilt the pan toward you so the butter pools at the near edge and spoon it over the fillets continuously for about 60 seconds. Basting cooks the top gently with hot fat instead of direct pan heat, so the fish stays moist while it picks up the thyme and garlic. If the butter starts to smell burnt rather than nutty, pull the pan off the heat and keep spooning."},{"title":"Check the temperature","text":"Slide an instant-read thermometer into the thickest part from the side. For medium, with a rosy, silky center, pull at 125-130°F (52-54°C); the FDA guideline for fully cooked fish is 145°F (63°C), which gives a firmer, flakier fillet. Salmon carries over about 5°F (3°C) off the heat, so take it out a few degrees early."},{"title":"Rest and serve skin side up","text":"Rest the fillets on a warm plate skin side up for 2 to 3 minutes so the juices redistribute — never on a paper towel or under foil, both of which will steam the crust soft. Squeeze the lemon half over the flesh, finish with the 1/2 tsp flaky salt, and serve with the wedges. Spoon the thyme butter from the pan over the flesh, not the skin."}],"tips":["Farmed Atlantic salmon is fattier and more forgiving; wild sockeye and coho are leaner and go from perfect to dry in a minute, so pull them 5°F (3°C) earlier.","If the skin sticks when you try to flip, it is not ready. Give it another 30-45 seconds and it will release on its own.","Leftover salmon is excellent cold. Flake it into a salad or mash it with mayo, lemon, and dill for a sandwich rather than reheating it, which dries it out.","A splatter screen keeps this from becoming a cleanup project. Skip the lid, though, which traps steam and ruins the skin in seconds.","The same method works for arctic char, steelhead trout, and branzino fillets, all of which cook slightly faster."],"keyTemp":"Pull at 125-130°F (52-54°C) for a rosy medium center; the FDA fully-cooked guideline for fish is 145°F (63°C).","pairing":"Pinot Noir or a dry rosé, with roasted potatoes and a lemony green salad.","videoQuery":"crispy skin pan seared salmon technique","photoQuery":"crispy skin salmon fillet plated","tags":["30 Minutes","Weeknight","One Pan"],"cat":"Seafood & Shellfish","catSlug":"seafood-and-shellfish","catEmoji":"🦐"},{"id":"blackened-mahi-mahi","title":"Blackened Mahi Mahi","emoji":"🐠","art":"fish","blurb":"A dark, spicy crust from a screaming cast iron pan and a fillet that stays sweet and juicy underneath. Open a window, and make the Gulf Coast classic properly.","difficulty":"Medium","servings":"4 servings","prepTime":"10 min","cookTime":"15 min","totalTime":"25 min","ingredients":[{"group":"Blackening seasoning","items":["1 tbsp (7 g) sweet paprika","1 1/2 tsp kosher salt","1 tsp garlic powder","1 tsp onion powder","1 tsp dried thyme","1 tsp dried oregano","3/4 tsp cayenne pepper","3/4 tsp freshly ground black pepper","1/2 tsp white pepper"]},{"group":"For the fish","items":["4 skinless mahi mahi fillets, 6 oz (170 g) each, about 3/4 in (2 cm) thick","6 tbsp (85 g) unsalted butter, melted, plus 2 tbsp (30 g) for finishing","1 lemon (about 4 oz / 115 g), cut into wedges","2 tbsp (8 g) chopped fresh flat-leaf parsley"]}],"instructions":[{"title":"Mix the spice blend","text":"Whisk the paprika, 1 1/2 tsp salt, garlic powder, onion powder, thyme, oregano, cayenne, black pepper, and white pepper together in a shallow bowl. Crush the dried thyme and oregano between your palms as you add them to release their oils. Blackening is not about burning the fish — it is about toasting these spices in butter until they turn dark and smell like the inside of a good seafood shack."},{"title":"Prep the fish","text":"Pat the mahi fillets completely dry with paper towels on all sides. If any fillet is much thicker than 1 in (2.5 cm) at one end, slice it horizontally or fold the thin tail under so everything is roughly even. Uneven fillets are the reason one piece comes out perfect and the next comes out dry."},{"title":"Open a window first","text":"Turn your exhaust fan to high, open a window, and if you have a smoke detector directly above the stove, be ready for it. This technique genuinely smokes — that is where the flavor comes from. If your kitchen has no ventilation at all, do this on a grill side burner or outdoors on a camp stove instead."},{"title":"Preheat the cast iron","text":"Set a 12 in (30 cm) cast iron skillet over high heat and leave it there for 6 to 8 full minutes with nothing in it. The pan is ready when a drop of water
