 shimmers. Skip nonstick if you can — the browned bits that stick to stainless steel are the backbone of the sauce. If the butter turns dark brown immediately, the pan is too hot; pull it off for 20 seconds."},{"title":"Brown the first two cutlets","text":"Lay 2 cutlets in the pan and cook 3 minutes without moving them, until the underside is golden and releases easily from the pan. Flip and cook 2 minutes more. They should sizzle steadily and confidently, not scream or smoke. Crowding the pan drops the heat and steams the chicken gray, so do not try to fit all four."},{"title":"Cook the second batch","text":"Move the first two cutlets to a plate and repeat with the remaining two, adding another teaspoon of oil if the pan looks dry. Check the thickest cutlet with an instant-read thermometer: 165°F (74°C) means done. Tent the plate loosely with foil and let the chicken rest while you build the sauce."},{"title":"Deglaze with wine","text":"Pour the 1/2 cup white wine into the hot skillet and scrape the bottom hard with a wooden spoon as it bubbles — every brown fleck is concentrated chicken flavor. Let the wine reduce over medium-high heat for about 2 minutes, until it has cooked down by half and no longer smells sharply of alcohol. This step is what separates a real pan sauce from lemon butter."},{"title":"Build the sauce body","text":"Add the 3/4 cup chicken stock, 3 tbsp lemon juice, and 3 tbsp capers, and simmer briskly for 3 to 4 minutes until the liquid reduces to about 2/3 cup and coats the back of a spoon lightly. Rinsing the capers first keeps the sauce from turning aggressively salty. Taste it now — it should be bracingly lemony, because the butter is about to soften all of that."},{"title":"Mount the butter off the heat","text":"Take the skillet completely off the burner, wait 15 seconds, then add the 4 tbsp cold butter one piece at a time, swirling the pan constantly until each piece disappears. Cold butter added off direct heat emulsifies into a glossy sauce; butter dumped into a boiling pan splits into greasy pools. The sauce should look silky and slightly thickened, like warm cream."},{"title":"Return the chicken","text":"Slide the cutlets and any juices from the plate back into the skillet and turn them once to coat, keeping the pan off the heat or on the lowest possible setting. Ninety seconds is plenty to warm them through. Boiling the chicken in the sauce now would both overcook it and break the emulsion you just made."},{"title":"Finish and serve","text":"Stir in the 3 tbsp chopped parsley, taste, and add a pinch more salt or a squeeze of lemon if it feels flat. Serve straight from the skillet or on a warm platter with the lemon rounds tucked around, spooning the sauce generously over each cutlet. Piccata sauce thickens as it cools, so get it to the table right away."}],"tips":["No wine in the house? Use an extra 1/2 cup (120 ml) stock plus 1 extra tsp lemon juice. The sauce will be a little less complex but still excellent.","Bottled lemon juice tastes metallic here and there is nowhere to hide it. Squeeze real lemons — you need about a lemon and a half.","Veal or pork cutlets pounded to the same 1/4 in (6 mm) work identically; pork should hit 145°F (63°C) with a 3 minute rest.","If the sauce breaks and looks oily, pull it off the heat and whisk in 1 tbsp cold stock or an ice cube to bring it back together."],"keyTemp":"Chicken cutlets are done at 165°F (74°C) at the thickest point; pull them from the pan the moment they get there.","pairing":"Buttered angel hair or roasted asparagus, and the rest of the Pinot Grigio you cooked with.","videoQuery":"chicken piccata lemon caper pan sauce","photoQuery":"chicken piccata capers lemon skillet","tags":["30 Minutes","Weeknight","One Pan"],"cat":"Italian Classics","catSlug":"italian-classics","catEmoji":"🍝"},{"id":"chicken-marsala","title":"Chicken Marsala with Mushrooms","emoji":"🍷","art":"chicken","blurb":"Deeply browned mushrooms, sweet Marsala cooked down until it is almost syrupy, and cutlets that soak it all up. It is a thirty-five minute dinner that eats like a restaurant special.","difficulty":"Medium","servings":"4 servings","prepTime":"15 min","cookTime":"25 min","totalTime":"40 min","ingredients":[{"group":"For the chicken","items":["2 large boneless skinless chicken breasts (about 1 1/2 lb / 680 g total)","1 1/4 tsp kosher salt","1/2 tsp freshly ground black pepper","1/2 cup (65 g) all-purpose flour","3 tbsp (45 ml) extra-virgin olive oil"]},{"group":"Mushroom Marsala sauce","items":["10 oz (285 g) cremini mushrooms, sliced 1/4 in (6 mm) thick","2 tbsp (28 g) unsalted butter","2 medium shallots, finely chopped (about 1/2 cup / 70 g)","3 garlic cloves, minced","3/4 cup (180 ml) dry Marsala wine","1 cup (240 ml) low-sodium chicken stock","1/3 cup (80 ml) heavy cream","1 tsp fresh thyme leaves","3 tbsp (42 g) cold unsalted butter, cut into 3 pieces","2 tbsp (8 g) chopped fresh flat-leaf parsley"]}],"instructions":[{"title":"Make even cutlets","text":"Slice each breast horizontally into two thin pieces, then pound them between plastic wrap to an even 1/3 in (8 mm). You want 4 cutlets of the same thickness so they all finish at the same moment. Season both sides with the 1 1/4 tsp kosher salt and 1/2 tsp pepper."},{"title":"Dredge lightly","text":"Coat each cutlet in the 1/2 cup flour and tap off everything that is not clinging. The flour does two jobs: it browns fast for color, and the starch that sheds into the pan later helps thicken the Marsala sauce. A heavy, pasty coat will make the finished sauce cloudy and taste of raw flour."},{"title":"Sear the cutlets","text":"Heat 2 tbsp of the olive oil in a 12 in (30 cm) stainless skillet over medium-high until it shimmers, then cook 2 cutlets at a time for 3 minutes on the first side and 2 on the second, until deeply golden. Work in two batches so the pan stays hot. Move them to a plate — they will finish cooking in the sauce, so a little pink in the very center is fine at this stage."},{"title":"Brown the mushrooms hard","text":"Add the remaining 1 tbsp oil and the 2 tbsp butter to the same pan, then add the sliced mushrooms in one layer and leave them alone for 3 full minutes. They will release water and look sad, then the water will boil off and they will start to brown. Keep cooking 5 to 6 minutes more, stirring occasionally, until they are genuinely dark brown at the edges. Undercooked, gray mushrooms are the most common thing wrong with homemade marsala."},{"title":"Add shallots and garlic","text":"Stir in the chopped shallots with a pinch of salt and cook 2 minutes until softened and translucent, then add the minced garlic and cook just 30 seconds more until fragrant. Garlic added earlier would burn against the hot mushrooms and turn bitter. The pan bottom should now be covered in brown glaze."},{"title":"Deglaze with Marsala","text":"Pour in the 3/4 cup Marsala and immediately scrape the bottom of the pan with a wooden spoon while it bubbles hard. Let it reduce over medium-high heat for 3 to 4 minutes, until the liquid is thick, glossy, and reduced by about half. This is the flavor engine of the dish — rushing it leaves a raw, boozy sweetness that no amount of cream will fix."},{"title":"Simmer with stock","text":"Add the 1 cup chicken stock and 1 tsp thyme leaves and simmer over medium heat for 5 to 6 minutes, until the sauce reduces by roughly a third and lightly coats a spoon. Scrape the pan again as it reduces. The sauce should smell nutty and winey rather than sharp."},{"title":"Add the cream","text":"Stir in the 1/3 cup heavy cream and let it bubble gently for 2 minutes to thicken slightly and turn the sauce a soft caramel color. Traditional Marsala is often made without cream, but a small amount rounds off the sweetness of the wine beautifully. Do not let it hit a rolling boil or it can separate."},{"title":"Return the chicken","text":"Nestle the cutlets and every drop of resting juice back into the pan, spoon sauce over them, and simmer gently for 3 to 4 minutes. Check the thickest cutlet with a thermometer: you are looking for 165°F (74°C). The cutlets will drink up sauce as they finish, which is exactly what you want."},{"title":"Finish with cold butter","text":"Pull the pan off the heat and swirl in the 3 tbsp cold butter, one piece at a time, until the sauce turns glossy and slightly thicker. Taste and adjust with salt and a few grinds of pepper. Scatter the 2 tbsp parsley over the top and serve immediately, with plenty of sauce spooned over each piece."}],"tips":["Buy dry Marsala, not sweet, and never the salted cooking Marsala from the vinegar aisle. A drinkable bottle costs about ten dollars and lasts months.","Mixing in 4 oz (115 g) of sliced shiitake or rehydrated porcini with the cremini gives the sauce far more depth for almost no extra work.","Do not wash mushrooms under running water; wipe them with a damp towel so they brown instead of steaming.","The sauce can be made through the cream step a day ahead and refrigerated. Reheat gently, then sear fresh cutlets and combine.","If the sauce gets too thick while resting, loosen it with a splash of stock rather than water so you do not dilute the flavor."],"keyTemp":"Chicken is done at 165°F (74°C); simmer it in the sauce only until it reaches that, or it will go stringy.","pairing":"Creamy polenta or mashed potatoes to catch the sauce, with a glass of Barbera or the dry Marsala itself.","videoQuery":"chicken marsala mushrooms restaurant style","photoQuery":"chicken marsala mushroom sauce skillet","tags":["Date Night","One Pan","Weeknight"],"cat":"Italian Classics","catSlug":"italian-classics","catEmoji":"🍝"},{"id":"chicken-saltimbocca","title":"Chicken Saltimbocca alla Romana","emoji":"🥓","art":"chicken","blurb":"Sage leaves pressed onto thin cutlets, wrapped in prosciutto, and crisped in butter until the ham goes crackly. The name means jump in the mouth, and after one bite you will understand why.","difficulty":"Easy","servings":"4 servings","prepTime":"15 min","cookTime":"12 min","totalTime":"27 min","ingredients":[{"group":"For the cutlets","items":["2 large boneless skinless chicken breasts (about 1 1/2 lb / 680 g total)","1/2 tsp kosher salt","3/4 tsp freshly ground black pepper","12 large fresh sage leaves","8 thin slices prosciutto di Parma (about 4 oz / 115 g)","1/3 cup (45 g) all-purpose flour","2 tbsp (30 ml) extra-virgin olive oil","2 tbsp (28 g) unsalted butter"]},{"group":"Pan sauce","items":["1/2 cup (120 ml) dry white wine","1/2 cup (120 ml) low-sodium chicken stock","3 tbsp (42 g) cold unsalted butter, cut into 3 pieces","1 tbsp (15 ml) fresh lemon juice","1/4 tsp flaky sea salt, for finishing"]}],"instructions":[{"title":"Make four thin cutlets","text":"Slice each breast horizontally into two pieces, then pound them between plastic wrap to a very even 1/4 in (6 mm). Saltimbocca lives or dies on thinness — the prosciutto needs to crisp in the same 3 minutes the chicken takes to cook. Pat the cutlets completely dry with paper towels."},{"title":"Season carefully","text":"Season the cutlets with only the 1/2 tsp kosher salt and all of the 3/4 tsp pepper. Prosciutto is already very salty and it will season the whole dish as it cooks, so this is one of the rare times you deliberately underseason the meat. Pepper, on the other hand, you want plenty of."},{"title":"Layer sage and prosciutto","text":"Lay 3 sage leaves down the length of each cutlet, then drape 2 slices of prosciutto over the top so they overlap slightly and cover the surface almost completely. Press the prosciutto down firmly with your palm — the moisture from the chicken makes it stick without any toothpicks. Do not wrap the prosciutto all the way around; leaving the bottom bare lets that side brown properly."},{"title":"Flour only the bare side","text":"Dust the naked chicken side of each cutlet lightly with the flour and shake off the excess, leaving the prosciutto side completely bare. The floured side browns evenly, and the unfloured ham side crisps directly against the metal. Handle them gently so the sage stays put."},{"title":"Heat the pan","text":"Set a 12 in (30 cm) skillet over medium-high heat, add the 2 tbsp olive oil and 2 tbsp butter, and swirl until the butter has foamed and the foam has just started to settle. The combination gives you the browning power of oil and the flavor of butter without the butter scorching. It should shimmer, not smoke."},{"title":"Cook prosciutto side down","text":"Lay 2 cutlets prosciutto side down in the pan and press them flat with a spatula for the first 20 seconds so the ham makes full contact. Cook 2 1/2 to 3 minutes without moving, until the prosciutto is deep bronze and crisp at the edges. Resist flipping early; that crackly ham surface is the entire dish."},{"title":"Flip and finish","text":"Turn the cutlets over and cook 2 minutes more on the floured side, until golden. Check the thickest one with an instant-read thermometer and pull at 165°F (74°C). Move to a warm plate and cook the second pair the same way, adding a little more oil if the pan looks dry."},{"title":"Deglaze the pan","text":"Pour the 1/2 cup white wine into the empty skillet over medium-high heat and scrape up the browned bits with a wooden spoon. Let it bubble down for about 2 minutes, until reduced by half and no longer smelling boozy. There will be a lot of salty, sagey fond in that pan and you want all of it."},{"title":"Reduce with stock","text":"Add the 1/2 cup chicken stock and simmer 3 minutes until the liquid is reduced to roughly 1/3 cup and looks slightly syrupy. Taste it before adding any salt — prosciutto fond is salty enough that it usually needs none. This is a small, intense sauce, not a pool."},{"title":"Emulsify and serve","text":"Take the pan off the heat, swirl in the 3 tbsp cold butter piece by piece until glossy, then stir in the 1 tbsp lemon juice. Spoon the sauce around the cutlets rather than over them so the crisp prosciutto stays crisp. Finish with the flaky salt and serve right away, while the ham still crackles."}],"tips":["Ask the deli to slice the prosciutto thin but not paper-thin, and to layer it between parchment. Slices that are too delicate tear when you lift them.","Fresh sage only. Dried sage tastes dusty here and there are no other flavors to hide behind.","Veal scaloppine is the Roman original if you can find it — cook it exactly the same way, about 90 seconds per side.","Assemble the cutlets up to 4 hours ahead, cover, and refrigerate. Let them sit out 15 minutes before cooking so they cook evenly."],"keyTemp":"Chicken is safe at 165°F (74°C) at the thickest point; thin cutlets get there in about 5 minutes total.","pairing":"Sauteed spinach with garlic and a crisp Frascati or Vermentino.","videoQuery":"chicken saltimbocca prosciutto sage pan sauce","photoQuery":"chicken saltimbocca prosciutto sage plated","tags":["30 Minutes","Date Night","One Pan"],"cat":"Italian Classics","catSlug":"italian-classics","catEmoji":"🍝"},{"id":"chicken-cacciatore","title":"Chicken Cacciatore with Peppers","emoji":"🐔","art":"chicken","blurb":"Hunter's chicken — bone-in thighs braised with peppers, onions, wine, and tomatoes until the meat slides off the bone. It is a one-pot dinner that gets better the day after you make it.","difficulty":"Medium","servings":"4 servings","prepTime":"20 min","cookTime":"55 min","totalTime":"1 hr 15 min","ingredients":[{"group":"For the chicken","items":["8 bone-in, skin-on chicken thighs (about 3 lb / 1.35 kg)","2 tsp kosher salt","1 tsp freshly ground black pepper","2 tbsp (30 ml) extra-virgin olive oil"]},{"group":"The braise","items":["1 large yellow onion, sliced 1/4 in (6 mm) thick","1 red bell pepper, cut into 1/2 in (12 mm) strips","1 yellow bell pepper, cut into 1/2 in (12 mm) strips","8 oz (225 g) cremini mushrooms, quartered","4 garlic cloves, thinly sliced","1 tbsp (16 g) tomato paste","3/4 cup (180 ml) dry red wine, such as Chianti","1 can (28 oz / 794 g) whole peeled tomatoes, crushed by hand","2 sprigs fresh rosemary","3 sprigs fresh thyme","1 bay leaf","1/4 tsp red pepper flakes","1/3 cup (45 g) pitted Kalamata or Gaeta olives, halved","3 tbsp (12 g) chopped fresh flat-leaf parsley"]}],"instructions":[{"title":"Dry and season the thighs","text":"Pat the chicken thighs completely dry with paper towels, then season all over with the 2 tsp kosher salt and 1 tsp pepper. If you have 30 extra minutes, let them sit on a rack in the fridge uncovered — dry skin browns and wet skin steams. Take them out of the fridge about 20 minutes before cooking."},{"title":"Brown the skin properly","text":"Heat the 2 tbsp olive oil in a 12 in (30 cm) Dutch oven or deep skillet over medium-high until it shimmers, then lay in the thighs skin side down, 4 at a time. Cook 6 to 8 minutes without touching them, until the skin is deep golden brown and releases from the pan on its own. If the skin sticks, it is not ready to flip. Brown the second side for 3 minutes, then move all the thighs to a plate."},{"title":"Pour off excess fat","text":"Spoon off all but about 2 tbsp of the rendered fat, leaving every bit of the browned residue on the bottom of the pot. Chicken thighs give up a surprising amount of fat and leaving it all in makes a greasy braise. That brown layer on the pot is pure flavor and it goes into the sauce in two minutes."},{"title":"Soften the vegetables","text":"Add the sliced onion and both bell peppers with a pinch of salt and cook over medium heat for 7 to 8 minutes, stirring often, until they are limp and just beginning to color at the edges. The salt pulls water out of the vegetables, which loosens the fond so you can scrape it up. Do not rush this into a hard sear; you want them sweet and soft."},{"title":"Brown the mushrooms","text":"Add the quartered mushrooms and cook 5 minutes more over medium-high, stirring only occasionally so they get some real color. They will release liquid first and then start to brown once it evaporates. Stir in the sliced garlic and the 1/4 tsp red pepper flakes and cook 45 seconds until fragrant."},{"title":"Cook the tomato paste","text":"Push the vegetables to one side, add the 1 tbsp tomato paste to the bare spot, and fry it for 60 to 90 seconds, stirring, until it darkens from bright red to brick. Cooking the paste this way removes its tinny raw edge and builds a deep savory base. Then stir it through the vegetables."},{"title":"Deglaze with red wine","text":"Pour in the 3/4 cup red wine and scrape the bottom of the pot hard while it bubbles. Simmer 3 to 4 minutes until reduced by half and the sharp alcohol smell is gone. Under-reduced wine leaves the whole braise tasting thin and acidic, so let it cook down properly."},{"title":"Add tomatoes and herbs","text":"Stir in the hand-crushed tomatoes with their juice, the rosemary and thyme sprigs, and the bay leaf. Bring everything to a gentle simmer. Crushing whole tomatoes by hand gives you a rustic sauce with real texture instead of the uniform slurry you get from a can of crushed."},{"title":"Nestle the chicken back in","text":"Return the thighs and any juices to the pot skin side up, arranging them so the skin stays above the sauce line. Half-submerged chicken keeps its browned skin instead of turning to wet rubber. The liquid should come about two-thirds of the way up the thighs; add 1/4 cup water if it is much lower."},{"title":"Braise low and slow","text":"Cover with the lid slightly ajar and simmer over low heat for 35 to 40 minutes, adjusting so the surface barely blips rather than boils. Thighs are safe at 165°F (74°C) but they are genuinely tender closer to 185°F (85°C), when the connective tissue has melted. A hard boil will tighten the meat, so keep it lazy."},{"title":"Finish with olives","text":"Fish out the rosemary and thyme stems and the bay leaf, then stir the halved olives into the sauce around the chicken and simmer uncovered for 5 more minutes. Adding olives at the end keeps them bright and firm instead of leaching salt through the whole pot. Taste the sauce and adjust the salt now."},{"title":"Rest and serve","text":"Let the pot sit off the heat for 10 minutes so the sauce thickens slightly and the chicken reabsorbs its juices. Scatter the 3 tbsp parsley over everything just before serving. Bring it to the table in the pot with plenty of bread — this is a dish that wants to be eaten out of the middle."}],"tips":["Cacciatore is genuinely better on day two. Cool it, refrigerate, and reheat gently on the stove; crisp the skin under the broiler for 2 minutes if you want it back.","Bone-in thighs are non-negotiable for flavor. Boneless thighs work in a pinch but cut the braise to 20 minutes and expect a thinner sauce.","If your sauce is watery at the end, lift out the chicken and boil the sauce hard for 5 minutes to reduce before serving.","A 2 in (5 cm) piece of Parmesan rind dropped in with the tomatoes adds savory depth for free. Remove it before serving.","White wine and no peppers gives you the lighter Tuscan version; both are traditional depending on which part of Italy you ask."],"keyTemp":"Thighs are safe at 165°F (74°C) but braise them to about 185°F (85°C) for meat that pulls off the bone.","pairing":"Soft polenta or crusty bread, and a glass of the same Chianti that went into the pot.","videoQuery":"chicken cacciatore braised peppers tomatoes","photoQuery":"chicken cacciatore dutch oven peppers","tags":["One Pot","Comfort Food","Make Ahead"],"cat":"Italian Classics","catSlug":"italian-classics","catEmoji":"🍝"},{"id":"eggplant-parmigiana","title":"Eggplant Parmigiana","emoji":"🍆","art":"veggie","blurb":"Layers of silky roasted eggplant, long-simmered tomato, torn basil, and three cheeses that set into clean, tall squares. Made properly it tastes rich without ever being greasy.","difficulty":"Medium","servings":"6 servings","prepTime":"40 min","cookTime":"1 hr 15 min","totalTime":"2 hr 25 min","ingredients":[{"group":"For the eggplant","items":["3 lb (1.35 kg) globe eggplant (about 3 medium)","1 tbsp kosher salt, for drawing out moisture","1/3 cup (80 ml) extra-virgin olive oil"]},{"group":"Tomato sauce","items":["3 tbsp (45 ml) extra-virgin olive oil","5 garlic cloves, thinly sliced","2 cans (28 oz / 794 g each) whole peeled San Marzano tomatoes, crushed by hand","1 tsp kosher salt","1/2 tsp red pepper flakes","1 cup (25 g) fresh basil leaves, divided"]},{"group":"To assemble","items":["16 oz (450 g) low-moisture whole-milk mozzarella, coarsely shredded","1 1/2 cups (150 g) finely grated Parmigiano-Reggiano","1 cup (250 g) whole-milk ricotta, drained 30 minutes if wet","1 large egg, beaten"]}],"instructions":[{"title":"Slice and salt the eggplant","text":"Trim the eggplants and cut them lengthwise into 1/3 in (8 mm) planks — thinner slices collapse into mush and thicker ones stay spongy. Lay them on racks set over sheet pans and sprinkle both sides with the 1 tbsp kosher salt. Let them sweat for 30 minutes, until you see beads of moisture on the surface. Salting pulls out water so the finished dish is not soupy and seasons the eggplant from the inside."},{"title":"Start the sauce","text":"While the eggplant sweats, warm the 3 tbsp olive oil and sliced garlic in a large saucepan over medium-low for 3 minutes, until the garlic is fragrant and pale gold. Add both cans of hand-crushed tomatoes, 1 tsp salt, and the 1/2 tsp red pepper flakes. Bring to a simmer, then cook uncovered over low heat for 40 to 45 minutes."},{"title":"Reduce it properly","text":"Stir the sauce every 10 minutes and let it reduce until a spoon dragged across the bottom leaves a trail that closes slowly, roughly the texture of loose jam. You should end with about 5 cups. A thin, watery sauce is the single biggest cause of eggplant parm that slumps into a puddle on the plate. Stir in half the basil off the heat."},{"title":"Dry and oil the slices","text":"Press the eggplant slices firmly between paper towels or a clean kitchen towel to remove the surface water and most of the salt. Brush both sides lightly with the 1/3 cup olive oil — brushing uses a fraction of the oil that frying does, and eggplant will absorb every drop you give it. They should look glossy, not swimming."},{"title":"Roast until tender","text":"Heat the oven to 425°F (220°C) and roast the slices on parchment-lined sheet pans for 20 to 25 minutes, flipping once halfway, until they are golden brown and completely floppy. Undercooked eggplant stays rubbery and bitter no matter how long the casserole bakes, so cook it all the way now. Let the slices cool for 10 minutes."},{"title":"Mix the ricotta","text":"Stir the 1 cup ricotta with the beaten egg and 1/2 cup (50 g) of the Parmigiano until smooth. The egg binds the ricotta so it sets into distinct creamy layers rather than running out when you cut a square. If your ricotta looked watery in the tub, drain it in a sieve for 30 minutes first."},{"title":"Lower the oven and build","text":"Reduce the oven to 375°F (190°C). Spread 1 cup of sauce across the bottom of a 9x13 in (23x33 cm) baking dish so nothing sticks. Lay down a snug single layer of eggplant, slightly overlapping, covering the whole surface. Gaps in the layers are where the finished dish falls apart."},{"title":"Layer it up","text":"Spread half the ricotta mixture over the eggplant, then a third of the remaining sauce, a third of the mozzarella, and a scattering of Parmigiano and torn basil. Repeat with a second layer of eggplant, the rest of the ricotta, more sauce, and more cheese. Finish with a third layer of eggplant, the last of the sauce, and all the remaining mozzarella and Parmigiano on top."},{"title":"Bake covered","text":"Cover the dish with foil tented so it does not touch the cheese, set it on a rimmed sheet pan to catch drips, and bake for 35 minutes. Covering it first heats everything through gently and lets the layers meld without the top browning too early. You should hear it bubbling when you pull it out."},{"title":"Uncover and brown","text":"Remove the foil and bake 20 to 25 minutes more, until the top is blistered and deep golden in spots and the sauce is bubbling around the edges. The center should register 165°F (74°C) on a thermometer, which tells you the whole casserole is hot through. If the top is pale, run it under the broiler for 90 seconds."},{"title":"Rest before cutting","text":"Let the dish rest on a rack for at least 25 minutes, and 40 is better. This is not optional — hot eggplant parm is molten and will slide apart the moment a knife touches it, while a rested one cuts into clean squares. Scatter the remaining fresh basil over the top just before serving."}],"tips":["Modern eggplant is bred to be far less bitter, so the salting step is mostly about removing water. Do not skip it anyway — water is the enemy here.","Assemble the whole dish a day ahead, refrigerate unbaked, and add 15 minutes to the covered bake time. It genuinely improves overnight.","Roasting instead of frying uses about a quarter of the oil and makes a dish that is rich rather than heavy. Fried is traditional if you want it.","Fresh mozzarella packed in water will flood the layers. Use the low-moisture block, or tear fresh mozzarella and drain it on towels for an hour first.","Leftovers cut cleanly when cold. Reheat squares at 350°F (175°C) for 20 minutes rather than microwaving."],"keyTemp":"Bake until the center of the casserole reads 165°F (74°C) and the edges bubble; then rest 25 minutes before cutting.","pairing":"A bitter green salad with lemon vinaigrette and a bottle of Aglianico or Nero d'Avola.","videoQuery":"eggplant parmigiana roasted layers baked","photoQuery":"eggplant parmigiana baked dish slice","tags":["Vegetarian","Make Ahead","Comfort Food"],"cat":"Italian Classics","catSlug":"italian-classics","catEmoji":"🍝"},{"id":"sunday-gravy-meatballs","title":"Sunday Gravy with Meatballs","emoji":"🍖","art":"sauce","blurb":"A big pot of tomato sauce simmered all afternoon with meatballs, sausage, and pork ribs until it turns dark and glossy. Start it after breakfast and let the smell take care of the rest of the day.","difficulty":"Medium","servings":"8 servings","prepTime":"45 min","cookTime":"3 hr 45 min","totalTime":"4 hr 30 min","ingredients":[{"group":"For the meatballs","items":["1 lb (450 g) ground beef, 80/20","1/2 lb (225 g) ground pork","1 1/2 cups (75 g) torn day-old white bread, crusts removed","3/4 cup (180 ml) whole milk","2 large eggs, beaten","3/4 cup (75 g) finely grated Parmigiano-Reggiano","4 garlic cloves, minced","1/3 cup (13 g) chopped fresh flat-leaf parsley","2 tsp kosher salt","1 tsp freshly ground black pepper","3 tbsp (45 ml) extra-virgin olive oil, for browning"]},{"group":"For the gravy","items":["1 1/2 lb (680 g) bone-in country-style pork ribs","1 lb (450 g) sweet Italian sausage links","1 large yellow onion, finely chopped","6 garlic cloves, thinly sliced","1/4 cup (65 g) tomato paste","1 cup (240 ml) dry red wine","3 cans (28 oz / 794 g each) whole peeled San Marzano tomatoes, crushed by hand","2 cups (480 ml) water","2 tsp kosher salt, plus more to taste","1/2 tsp red pepper flakes","1 Parmigiano-Reggiano rind, about 3 in (8 cm)","1 cup (25 g) fresh basil leaves"]}],"instructions":[{"title":"Make a panade","text":"Tear the bread into small pieces, cover it with the 3/4 cup milk in a bowl, and let it soak 10 minutes until completely soft. Mash it into a paste with a fork. This milk-and-bread paste is called a panade, and it is the reason great meatballs are tender — the starch traps moisture that would otherwise squeeze out as the meat proteins tighten."},{"title":"Mix the meatballs gently","text":"Add the ground beef, ground pork, beaten eggs, 3/4 cup Parmigiano, minced garlic, parsley, 2 tsp salt, and 1 tsp pepper to the panade. Mix with your hands just until you no longer see streaks of egg, about 30 seconds. Overmixing develops the proteins and gives you meatballs with the texture of a hot dog, so stop early."},{"title":"Roll and chill","text":"With wet hands, roll the mixture into 16 to 18 balls about 2 in (5 cm) across, roughly the size of a golf ball, setting them on a sheet pan. Wet hands stop the mixture sticking to you. Chill them for 20 minutes if you have time; cold meatballs hold their shape much better when they hit hot oil."},{"title":"Brown the meatballs","text":"Heat the 3 tbsp olive oil in a large Dutch oven over medium-high and brown the meatballs in two or three batches, about 5 minutes each, turning to get color on several sides. They do not need to be cooked through — they will finish in the sauce for hours. Crowding the pot steams them gray, so give each batch room. Set them aside on a plate."},{"title":"Brown the pork and sausage","text":"In the same pot, brown the country-style ribs on all sides, about 8 minutes total, then set them aside and brown the sausage links for 5 minutes until well colored. Every one of these browning steps leaves fond on the bottom of the pot, and the layered fond from three different meats is what makes Sunday gravy taste different from ordinary marinara."},{"title":"Sweat the aromatics","text":"Pour off all but 3 tbsp of fat, then add the chopped onion with a pinch of salt and cook over medium heat 8 minutes until soft and translucent, scraping the bottom as the onion releases water. Add the sliced garlic and 1/2 tsp red pepper flakes and cook 1 minute more. Do not let the garlic brown or the whole pot will carry a bitter edge for hours."},{"title":"Caramelize the tomato paste","text":"Stir in the 1/4 cup tomato paste and cook it for 3 to 4 minutes, stirring constantly, until it darkens to a deep brick red and starts to stick to the pot. This step concentrates the tomato sugars and drives off the raw canned flavor. It smells noticeably sweeter and rounder when it is ready."},{"title":"Deglaze with wine","text":"Add the 1 cup red wine and scrape every bit of stuck-on fond loose with a wooden spoon while it bubbles. Simmer 4 to 5 minutes until the wine has reduced by about half and lost its sharp alcohol smell. The pot bottom should be clean and the liquid should look dark and glossy."},{"title":"Build the pot","text":"Add the three cans of hand-crushed tomatoes, the 2 cups water, 2 tsp salt, and the Parmesan rind, then return the ribs and sausage to the pot. Bring it up to a simmer, then drop the heat until the surface just barely blips once or twice a second. A rolling boil will scorch the bottom and turn the tomatoes bitter."},{"title":"Simmer, then add the meatballs","text":"Simmer partly covered for 2 hours, stirring every 30 minutes and scraping the bottom each time. Then gently lower the meatballs in, submerging them, and continue to simmer for 1 hour and 15 minutes more. Adding them partway through means they absorb sauce without falling apart over the full cooking time."},{"title":"Check the meats","text":"The pork ribs are ready when the meat pulls away from the bone with no resistance, around 195°F (91°C) internal, and the sausages should read at least 160°F (71°C). Pull the ribs out, shred the meat off the bones, discard the bones and any cartilage, and stir the meat back in. Slice the sausages into thick coins and return them too."},{"title":"Finish and season","text":"Fish out the Parmesan rind, then tear the basil leaves in and stir. Taste carefully and adjust with salt — after four hours the sauce is concentrated, so add in small pinches. If it tastes sharp, a 1/2 tsp of sugar or an extra splash of olive oil will round it out."},{"title":"Serve in courses","text":"Traditionally the sauce goes on pasta first and the meats come out on a platter afterward as the second course. Spoon a ladle of gravy over each serving and put the platter of meatballs, sausage, and shredded pork in the middle of the table. Give everyone bread; there will be sauce left on every plate."}],"tips":["Sunday gravy freezes beautifully for 3 months. Freeze the sauce and meats together in quart containers, leaving an inch of headroom.","Use 80/20 beef, not lean. Fat is what keeps the meatballs from turning into dry pellets over a long simmer.","If you only have one afternoon and no ribs, the recipe still works with just meatballs and sausage. Cut the initial simmer to 1 hour.","A scorched bottom ruins the whole pot and cannot be fixed. Set a timer to stir every 30 minutes and never let it boil.","Bake the meatballs at 425°F (220°C) for 15 minutes instead of frying if you want a cleaner kitchen; you lose a little crust but save a lot of splatter."],"keyTemp":"Ground meat is safe at 160°F (71°C), but the ribs want 195°F (91°C) to shred; the meatballs finish far past safe during the long simmer.","pairing":"Rigatoni or a big bowl of ziti, plenty of bread, and a jug of Sangiovese.","videoQuery":"italian sunday gravy meatballs sausage pork","photoQuery":"sunday gravy meatballs sausage pot","tags":["Weekend Project","Make Ahead","Comfort Food"],"cat":"Italian Classics","catSlug":"italian-classics","catEmoji":"🍝"},{"id":"osso-buco-alla-milanese","title":"Osso Buco alla Milanese","emoji":"🥩","art":"stew","blurb":"Veal shanks braised for three hours until the meat gives way to a spoon, finished with a bright hit of gremolata. The marrow in the center of the bone is the best bite on the plate.","difficulty":"Advanced","servings":"4 servings","prepTime":"30 min","cookTime":"3 hr","totalTime":"3 hr 30 min","ingredients":[{"group":"For the shanks","items":["4 cross-cut veal shanks, 1 1/2 in (4 cm) thick (about 3 1/2 lb / 1.6 kg total)","2 tsp kosher salt","1 tsp freshly ground black pepper","1/2 cup (65 g) all-purpose flour","3 tbsp (45 ml) extra-virgin olive oil","2 tbsp (28 g) unsalted butter","4 ft (1.2 m) kitchen twine, for tying"]},{"group":"The braise","items":["1 large yellow onion, finely diced","2 medium carrots, finely diced (about 1 cup / 130 g)","2 celery stalks, finely diced (about 1 cup / 120 g)","4 garlic cloves, minced","2 tbsp (32 g) tomato paste","1 1/2 cups (360 ml) dry white wine","2 cups (480 ml) low-sodium veal or chicken stock","1 can (14 oz / 400 g) whole peeled tomatoes, crushed by hand","2 bay leaves","4 sprigs fresh thyme","1 strip lemon peel, 3 in (8 cm)"]},{"group":"Gremolata","items":["1/3 cup (13 g) finely chopped fresh flat-leaf parsley","2 tsp finely grated lemon zest (from 2 lemons)","2 garlic cloves, very finely minced","1/4 tsp flaky sea salt"]}],"instructions":[{"title":"Tie the shanks","text":"Wrap a length of kitchen twine around the outside circumference of each shank and tie it snugly, like a belt. Veal shanks are ringed by a band of connective tissue that contracts as it cooks and will pull the whole shank apart into a loose mess. The twine keeps each one in a neat round for three hours. Pat them completely dry afterward."},{"title":"Season and flour","text":"Season the shanks all over with the 2 tsp kosher salt and 1 tsp pepper, then dredge them in the 1/2 cup flour and knock off the excess. The thin flour coat browns quickly and, over the long braise, thickens the sauce to exactly the right body. Only flour them right before they go in the pan, or the coating turns to glue."},{"title":"Sear hard","text":"Heat the 3 tbsp olive oil and 2 tbsp butter in a heavy Dutch oven over medium-high until the butter foam subsides. Brown the shanks 5 to 6 minutes per side, in two batches, until they are a deep even brown with no pale patches. This is the most important flavor step in the dish and it cannot be rushed. Set them on a plate; they will look almost cooked, but they are nowhere near done."},{"title":"Start the soffritto","text":"Lower the heat to medium and add the diced onion, carrot, and celery to the pot with a pinch of salt. Cook 10 to 12 minutes, stirring often, until everything is soft and the onion is translucent with just a little golden color. Dice them small and evenly so they melt into the sauce rather than showing up as chunks. Scrape the bottom as the vegetables give up their water."},{"title":"Add garlic and tomato paste","text":"Stir in the minced garlic and cook 45 seconds, then add the 2 tbsp tomato paste and cook 2 to 3 minutes more, stirring, until it darkens to brick red and coats the vegetables. Cooking the paste out removes its raw, tinny taste. The whole pot should smell sweet and deeply savory now."},{"title":"Deglaze with white wine","text":"Pour in the 1 1/2 cups white wine and scrape the bottom of the pot with a wooden spoon while it bubbles hard. Simmer 5 to 6 minutes until the wine has reduced by roughly half. White wine, not red, is the Milanese tradition — it keeps the sauce light enough that the veal still tastes like veal."},{"title":"Build the braising liquid","text":"Add the 2 cups stock, the hand-crushed tomatoes, the bay leaves, thyme sprigs, and lemon peel, and bring to a gentle simmer. Heat the oven to 325°F (165°C) while this comes up. Taste the liquid; it should be pleasantly seasoned but not salty, because it will reduce and concentrate over the next three hours."},{"title":"Return the shanks","text":"Nestle the shanks into the pot in a single layer, standing them so the marrow bones stay upright and the marrow does not slide out. The liquid should come about two-thirds of the way up the meat, not cover it — add a splash of stock if you are short. Spoon a little liquid over the exposed tops."},{"title":"Braise in the oven","text":"Cover with a tight lid and transfer to the 325°F (165°C) oven for 2 hours and 30 minutes to 3 hours. Check at the 2 hour mark: the liquid should be barely trembling, not bubbling. If it is boiling, drop the oven to 300°F (150°C), since a hard braise squeezes the meat fibers tight and makes veal stringy instead of silky."},{"title":"Test for doneness","text":"The shanks are ready when a fork slides into the meat with no resistance and the meat has pulled visibly away from the bone, around 200°F (93°C) internal. This is well past any food-safety threshold — collagen only melts into gelatin in that 190°F to 205°F (88°C to 96°C) window. If it is still tight, give it another 30 minutes and check again."},{"title":"Reduce the sauce","text":"Carefully lift the shanks onto a warm platter and snip off the twine. Fish out the bay leaves, thyme stems, and lemon peel, then simmer the sauce on the stovetop over medium-high for 8 to 10 minutes until it thickens enough to coat a spoon. Skim off any orange fat that rises. Taste and adjust the salt."},{"title":"Make the gremolata","text":"Chop the parsley, lemon zest, and garlic together on a board until they are fine and well mixed, then stir in the flaky salt. Making it at the last minute matters — the volatile oils in raw garlic and lemon zest fade within about 20 minutes. This raw, sharp mixture is what cuts through three hours of richness."},{"title":"Serve with a marrow spoon","text":"Spoon sauce over each shank, scatter the gremolata generously on top, and set the platter down with small spoons or the handle end of a teaspoon for digging out the marrow. Osso buco means bone with a hole, and that hole is the point. Serve immediately, while everything is hot enough that the marrow is soft."}],"tips":["Ask the butcher for center-cut hind shanks 1 1/2 in (4 cm) thick. Thin shanks dry out and end-cut shanks have almost no marrow.","Osso buco is better made a day ahead. Cool it in its sauce, refrigerate, lift off the solid fat, and reheat at 325°F (165°C) for 40 minutes covered.","Beef shanks are a third of the price and work with the same method, though they need about 30 extra minutes and taste heartier.","Never let the braise boil. If you hear active bubbling through the lid, lower the oven 25 degrees — a trembling surface makes silky meat.","Make the gremolata within 20 minutes of serving. Chopped ahead, it goes dull and slightly bitter."],"keyTemp":"Braise to roughly 200°F (93°C) internal — fork-tender, far past the 145°F (63°C) safety point, which is where collagen turns to gelatin.","pairing":"Risotto alla Milanese is the classic partner, with a Barolo or a good Nebbiolo.","videoQuery":"osso buco veal shanks braised gremolata","photoQuery":"osso buco veal shank gremolata plate","tags":["Weekend Project","Braised","Special Occasion"],"cat":"Italian Classics","catSlug":"italian-classics","catEmoji":"🍝"},{"id":"crispy-duck-breast-cherry-gastrique","title":"Crispy Duck Breast with Cherry Gastrique","emoji":"🦆","art":"chicken","blurb":"Skin rendered until it shatters like glass, meat the color of a rose, and a sweet-sour cherry sauce that cuts straight through the richness. This is the dish that makes people ask where you learned to cook.","difficulty":"Medium","servings":"2 servings","prepTime":"15 min","cookTime":"30 min","totalTime":"55 min","ingredients":[{"group":"For the duck","items":["2 boneless Pekin duck breasts, skin on (about 8 oz / 225 g each)","1 1/2 tsp kosher salt","1/2 tsp freshly ground black pepper","2 thyme sprigs"]},{"group":"Cherry gastrique","items":["1/3 cup (67 g) granulated sugar","1/3 cup (80 ml) red wine vinegar","1/4 cup (60 ml) ruby port or dry red wine","1/2 cup (120 ml) chicken or duck stock","1 cup (140 g) pitted sweet cherries, fresh or frozen, halved","1 tbsp (14 g) cold unsalted butter","1/4 tsp kosher salt"]}],"instructions":[{"title":"Trim and score the skin","text":"Pat the duck breasts completely dry and trim any flaps of skin or fat that hang past the meat. With a sharp knife held at a shallow angle, cut a crosshatch through the skin and fat about 1/4 in (6 mm) apart, stopping before you reach the red meat — if you see meat in the cuts you have gone too deep and juice will leak out and steam the skin. Those channels give the fat a road to escape by, which is the whole secret to crisp duck."},{"title":"Salt and rest the duck","text":"Season both sides with the 1 1/2 tsp kosher salt and 1/2 tsp pepper, then set the breasts skin side up on a rack over a plate. Refrigerate uncovered for at least 30 minutes and up to 24 hours. Cold dry air pulls water out of the skin, and dry skin browns while wet skin steams. If you are short on time, even 30 minutes makes a visible difference."},{"title":"Start in a cold pan","text":"Lay the duck skin side down in a dry, cold 10 in (25 cm) stainless or cast iron skillet — no oil, no preheating. Then turn the burner to medium-low. Starting cold lets the fat melt slowly and evenly instead of seizing the skin shut, and it is the single most common thing home cooks get wrong with duck."},{"title":"Render low and slow","text":"Let the duck sit undisturbed for 12 to 15 minutes over medium-low heat. You want a lazy, steady bubbling sound, never a violent sizzle or any smoke — if it gets loud, drop the heat. Every 4 to 5 minutes, carefully pour the rendered fat into a heatproof jar so the skin is frying in a thin film, not swimming in a deep pool. You should end up with 1/4 to 1/3 cup of gorgeous duck fat; save it for potatoes."},{"title":"Check the skin, then flip","text":"Lift a breast with tongs and look: the skin should be evenly deep golden brown, thin, and stiff, and the fat layer beneath it should have shrunk to almost nothing. If it is still pale or soft in the middle, give it another 3 to 4 minutes. When it looks right, flip the breasts over and add the thyme sprigs to the pan."},{"title":"Finish on the flesh side","text":"Cook flesh side down for just 2 to 4 minutes over medium heat, spooning a little of the hot fat over the top as it goes. Check the thickest part with an instant-read thermometer and pull the duck at 130°F (54°C) for a rosy medium-rare. Duck is a red meat and is meant to be served pink; cooked past 150°F (66°C) it turns dry and livery."},{"title":"Rest the duck","text":"Move the breasts to a cutting board, skin side up, and rest them 8 to 10 minutes. The internal temperature will coast up to about 135°F (57°C) and the juices will settle back into the fibers instead of running out on your board. Never tent duck with foil — trapped steam will soften the crackling skin you just spent 15 minutes building."},{"title":"Make the caramel","text":"Wipe out a small saucepan, add the 1/3 cup sugar in an even layer, and set it over medium heat. Do not stir; just swirl the pan occasionally as the edges melt and the sugar turns from clear to straw to a deep amber, which takes about 4 to 6 minutes. Amber is where the flavor is, but it goes to burnt fast, so pull it the moment it smells like toasted caramel rather than coffee."},{"title":"Deglaze with vinegar","text":"Stand back and pour in the 1/3 cup red wine vinegar all at once — it will hiss violently and throw off sharp-smelling steam, and the caramel will seize into a hard lump. That is completely normal. Keep it over medium heat and stir for 1 to 2 minutes until the lump dissolves back into a smooth syrup. This sweet-sour base is what gastrique means."},{"title":"Build and reduce the sauce","text":"Add the 1/4 cup port and 1/2 cup stock and simmer briskly for 6 to 8 minutes, until the sauce has reduced by about half and coats the back of a spoon. Drag your finger through it — the line should hold for a second before closing. Stir in the cherries and simmer 3 more minutes, just until they soften but still hold their shape."},{"title":"Mount with butter","text":"Take the pan off the heat, add the 1 tbsp cold butter, and swirl the pan until it disappears into the sauce and gives it a glossy sheen. Season with the 1/4 tsp salt and taste: it should hit sweet, then sour, then savory, in that order. If it is too sharp add a pinch of sugar; too sweet, a few drops more vinegar."},{"title":"Slice and plate","text":"Slice each breast against the grain into 1/4 in (6 mm) planks, cutting straight down through the skin with a sharp knife so the crust does not tear. Spoon a shallow pool of gastrique slightly off-center on two warm plates, then fan the duck slices over the sauce with the crisp skin facing up and visible. Scatter the cherries around, add a few flakes of salt on the meat, and serve at once. Never pour sauce over the skin — that is how you undo all of it."}],"tips":["Save the rendered duck fat in a jar in the fridge for up to 3 months. Roast potatoes in it at 425°F (220°C) and you will understand why cooks hoard the stuff.","Frozen cherries work beautifully here and need no thawing — just add them straight to the reducing sauce and give them an extra minute.","The gastrique can be made up to 5 days ahead through the reduction step. Rewarm it gently, then add the cherries and butter fresh so the sauce stays glossy.","If your skin is browning fast but still thick and soft underneath, your heat is too high. Move the pan off the burner for a minute and go back at a lower setting; rendering is a patience game.","No port on hand? Use dry red wine plus 1 tsp sugar, or even a splash of balsamic vinegar cut with water."],"keyTemp":"Pull the duck at 130°F (54°C) for medium-rare; it will rest up to about 135°F (57°C). Duck breast is safe and best served pink — do not take it past 150°F (66°C).","pairing":"A cool glass of Pinot Noir and a pile of duck-fat roasted potatoes or a bitter greens salad.","videoQuery":"how to cook duck breast crispy skin gastrique","photoQuery":"sliced duck breast cherry sauce plate","tags":["Date Night","Restaurant at Home","Cast Iron"],"cat":"Chef-Level Signatures","catSlug":"chef-level-signatures","catEmoji":"👨‍🍳"},{"id":"seared-scallops-cauliflower-puree","title":"Seared Scallops with Cauliflower Puree","emoji":"🐚","art":"scallop","blurb":"Silky white puree, deeply caramelized scallops, and a nutty brown butter poured over at the table. It looks like a tasting menu course and takes about forty-five minutes.","difficulty":"Medium","servings":"2 servings","prepTime":"15 min","cookTime":"30 min","totalTime":"45 min","ingredients":[{"group":"Cauliflower puree","items":["1 medium head cauliflower (about 1 1/2 lb / 680 g), cut into small florets","1 1/2 cups (360 ml) whole milk","2 tbsp (28 g) unsalted butter","1/4 cup (60 ml) heavy cream, warmed","3/4 tsp kosher salt, plus more to taste","1 pinch white pepper"]},{"group":"For the scallops","items":["10 to 12 dry-packed sea scallops (about 1 lb / 450 g, U-10 or U-12)","3/4 tsp kosher salt","1/4 tsp freshly ground black pepper","1 tbsp (15 ml) grapeseed or avocado oil"]},{"group":"Hazelnut brown butter","items":["4 tbsp (55 g) unsalted butter, cut into 4 pieces","3 tbsp (25 g) toasted hazelnuts, roughly chopped","1 tbsp (15 ml) fresh lemon juice","1 tbsp (3 g) snipped chives","1/2 tsp flaky sea salt, for finishing"]}],"instructions":[{"title":"Cook cauliflower in milk","text":"Put the cauliflower florets in a 3 qt (3 L) saucepan with the 1 1/2 cups milk, the 2 tbsp butter, and the 3/4 tsp salt. Bring to a bare simmer over medium heat and cook 14 to 18 minutes, stirring now and then so the milk does not scorch on the bottom. The cauliflower is ready when a knife slides through a floret with zero resistance — undercooked cauliflower will never blend smooth, no matter how long you run the blender."},{"title":"Blend the puree silky","text":"Drain the cauliflower, saving the milk. Blend the florets with the 1/4 cup warm cream and about 1/3 cup (80 ml) of the reserved milk on high for a full 60 to 90 seconds. Add more milk a tablespoon at a time until it moves like thick pancake batter and falls off the spatula in a ribbon. Season with the white pepper and more salt to taste, then keep it warm in the covered pot over the lowest heat."},{"title":"Pull the side muscle","text":"Look along the side of each scallop for a small rectangular tab of firmer, slightly fibrous flesh. Pinch it and peel it away with your fingers; it takes two seconds each. That muscle turns rubbery and stringy when cooked, so removing it is the difference between silky and chewy."},{"title":"Dry the scallops hard","text":"Lay the scallops on a doubled paper towel, press another towel firmly on top, and leave them uncovered for 10 minutes. Change the towel once if it soaks through. Surface water has to boil away before browning can even begin, so every drop you blot now is a second of real searing you get back later. They should feel dry and slightly tacky."},{"title":"Season at the last second","text":"Season the scallops with the 3/4 tsp kosher salt and 1/4 tsp pepper right before they go in the pan, not a minute earlier. Salt draws moisture back to the surface within about 60 seconds, which quietly undoes all your blotting. Set the seasoned scallops in a row next to the stove so you can load the pan quickly."},{"title":"Get the pan properly hot","text":"Heat a 12 in (30 cm) stainless or cast iron skillet over medium-high for 2 to 3 minutes, then add the 1 tbsp oil and swirl to coat. The oil should shimmer and run thin like water with the very first wisp of smoke. If it is billowing smoke, pull the pan off the burner for 30 seconds — scorched fat tastes acrid. Skip nonstick here; it does not hold enough heat to build a crust."},{"title":"Sear and do not touch","text":"Lay the scallops in one at a time, working clockwise so you know which went in first, leaving 1 in (2.5 cm) between them. Do not move, poke, or peek for 2 to 3 full minutes — you want a steady aggressive sizzle, not a quiet hiss. When the bottom edge has gone deep amber, each scallop will release from the pan on its own. If it sticks, it is not ready."},{"title":"Flip and finish","text":"Turn each scallop with a thin spatula and cook just 60 to 90 seconds on the second side, which is only there to set the interior. Press the side gently: it should feel like the fleshy pad below your thumb, with a little give. Pull them at 125 to 130°F (52 to 54°C) in the center for a sweet, barely translucent middle. Firm and springy means overcooked."},{"title":"Brown the butter","text":"Move the scallops to a warm plate, seared side up, and turn the heat to medium. Add the 4 tbsp butter to the same pan and swirl constantly as it melts, foams, and quiets down. In 2 to 3 minutes the milk solids on the bottom will turn hazelnut brown and it will smell toasty and sweet. Brown butter goes from perfect to burnt in about 20 seconds, so trust your nose over your eyes."},{"title":"Finish the butter off heat","text":"Pull the pan off the burner and stir in the hazelnuts, the 1 tbsp lemon juice, and the chives. The lemon will hiss and instantly cut the richness, and the residual heat is enough to warm the nuts without burning them. Taste and add a pinch of salt if it needs it."},{"title":"Plate it like a restaurant","text":"Spoon a generous pool of warm puree into the center of each warm plate and drag the back of the spoon through it to make a wide comma-shaped swoosh. Arrange 5 or 6 scallops along the puree, seared side up, spaced evenly so each one is visible. Spoon the hazelnut brown butter over and around them, finish with the 1/2 tsp flaky salt on the scallops only, and serve immediately while the crust is still crisp."}],"tips":["Buy dry-packed scallops. Wet-packed ones sit in a phosphate solution, leak liquid the moment they hit the pan, and will never brown properly.","The puree can be made 3 days ahead and refrigerated. Rewarm it gently with a splash of milk, whisking, and it comes right back to silky.","If your puree is grainy, it is either undercooked cauliflower or an underworked blender. Give it another 60 seconds on high before you add more liquid.","Sear in two batches rather than crowding a small pan. Two great batches beat one steamed one, and the second batch benefits from a hotter pan.","Toast the hazelnuts at 350°F (175°C) for 8 to 10 minutes and rub off the skins in a towel — it takes ten minutes and doubles their flavor."],"keyTemp":"Pull the scallops at 125 to 130°F (52 to 54°C) for a sweet, just-set center. The FDA guideline for fully cooked shellfish is 145°F (63°C), which will be noticeably firmer.","pairing":"A cold, mineral white like Sancerre or Chablis, with a thin slice of grilled sourdough to chase the brown butter.","videoQuery":"seared scallops cauliflower puree brown butter","photoQuery":"seared scallops cauliflower puree plate","tags":["Date Night","Restaurant at Home","Under an Hour"],"cat":"Chef-Level Signatures","catSlug":"chef-level-signatures","catEmoji":"👨‍🍳"},{"id":"filet-mignon-bordelaise","title":"Filet Mignon with Bordelaise Sauce","emoji":"🥩","art":"steak","blurb":"Thick, tender filets with a dark crust, sitting in a glossy red wine sauce that took an hour of quiet reducing and tastes like a hundred dollars. This is the classic French steakhouse plate, done properly at home.","difficulty":"Medium","servings":"4 servings","prepTime":"15 min","cookTime":"45 min","totalTime":"1 hr 10 min","ingredients":[{"group":"For the steaks","items":["4 center-cut filet mignon steaks (6 oz / 170 g each, 1 1/2 in / 4 cm thick)","2 tsp kosher salt","1 tsp coarsely ground black pepper","1 tbsp (15 ml) grapeseed or canola oil","2 tbsp (28 g) unsalted butter","3 thyme sprigs and 2 smashed garlic cloves"]},{"group":"Bordelaise sauce","items":["2 tbsp (28 g) unsalted butter","2 medium shallots, finely minced (about 1/3 cup / 50 g)","1 1/2 cups (360 ml) dry red wine, ideally a Bordeaux or Cabernet","1 1/2 cups (360 ml) veal or good beef stock","1 tsp (5 g) tomato paste","1 thyme sprig, 1 bay leaf, and 6 crushed black peppercorns","3 tbsp (42 g) cold unsalted butter, cut into cubes","1/2 tsp kosher salt, plus more to taste"]}],"instructions":[{"title":"Salt the steaks early","text":"Pat the filets bone dry and season all over, including the sides, with the 2 tsp kosher salt and 1 tsp pepper. Set them on a rack over a sheet pan and refrigerate uncovered for at least 45 minutes and up to 24 hours. The salt first pulls moisture out, then the meat reabsorbs it seasoned all the way through, and the surface dries so it can brown. Take them out 30 minutes before cooking so the centers are not ice cold."},{"title":"Sweat the shallots","text":"Melt the 2 tbsp butter in a 2 qt (2 L) saucepan over medium-low heat and add the minced shallots with a pinch of salt. Cook gently for 4 to 5 minutes, stirring, until they are soft and translucent but not browned. Browned shallots turn the sauce bitter and cloudy, so keep the heat modest and stop the moment they go glassy."},{"title":"Reduce the wine to almost nothing","text":"Stir in the 1 tsp tomato paste and cook 30 seconds until it darkens, then pour in the 1 1/2 cups red wine and add the thyme, bay leaf, and crushed peppercorns. Simmer briskly over medium heat for 12 to 15 minutes until only about 1/4 cup (60 ml) of syrupy liquid remains. This step burns off the raw alcohol and concentrates the wine into something deep and sweet rather than sharp."},{"title":"Add stock and reduce again","text":"Pour in the 1 1/2 cups veal or beef stock and simmer over medium-low for 20 to 25 minutes, until the sauce has reduced to about 3/4 cup (180 ml) and coats the back of a spoon. Drag your finger through the coating: the line should hold for a beat before closing. Strain through a fine sieve into a small clean pot, pressing on the solids, and set it aside off the heat."},{"title":"Heat the pan properly","text":"Set a 12 in (30 cm) cast iron skillet over medium-high heat for 4 to 5 minutes, until a drop of water skitters and vanishes instantly. Preheat the oven to 400°F (205°C) at the same time. Add the 1 tbsp oil and swirl — it should shimmer with the first thread of smoke. A properly hot pan is what gives you crust in 3 minutes instead of gray meat in 8."},{"title":"Sear the flat sides","text":"Lay the filets in the pan without crowding, leaving at least 1 1/2 in (4 cm) between them, and press each one down for the first few seconds so the whole face makes contact. Sear 2 1/2 to 3 minutes without moving them; you want a loud steady roar, not smoke pouring off. Flip and sear the second side another 2 1/2 minutes, until both faces are deep brown all the way to the edges."},{"title":"Roll the edges","text":"Filets are tall, so use tongs to stand each one on its rounded side and roll it around the pan for 30 to 45 seconds per section until the whole perimeter is browned. Untouched sides are pale and taste boiled next to the seared faces. Work quickly here so the centers do not run away from you."},{"title":"Baste with butter and herbs","text":"Drop in the 2 tbsp butter, the thyme sprigs, and the smashed garlic and let the butter foam. Tilt the pan toward you and spoon the foaming butter over the steaks continuously for about 60 seconds. The butter should be sputtering and smell nutty and herbal — if it is smoking black, the heat is too high, so pull the pan off for a moment."},{"title":"Finish in the oven","text":"Slide the whole skillet into the 400°F (205°C) oven and roast 4 to 7 minutes depending on thickness. Start checking at 4 minutes with an instant-read thermometer pushed into the center from the side. Pull the steaks at 125°F (52°C) for medium-rare or 133°F (56°C) for medium — these are pull temperatures, not final ones."},{"title":"Rest the steaks","text":"Move the filets to a warm plate or board and let them rest for 8 to 10 minutes, loosely tented if your kitchen is cold. They will carry over about 5 to 8°F (3 to 4°C), landing at a final 130 to 135°F (54 to 57°C) for medium-rare. Cutting early dumps the juices onto the board and leaves the meat dry, so this wait genuinely matters."},{"title":"Mount the sauce with cold butter","text":"Warm the strained sauce over low heat until it steams but does not boil, then take it off the burner and whisk in the 3 tbsp cold butter one cube at a time. Each cube should melt into a glossy emulsion before the next one goes in; if you rush it or let it boil, the sauce will break and look oily. Season with the 1/2 tsp salt and taste for balance."},{"title":"Plate and pour","text":"Spoon 2 to 3 tablespoons of bordelaise slightly off-center onto each warm plate and set a rested filet on top so the sauce frames it rather than drowning it. Add a small pile of something creamy at the two o'clock position — potato puree or spinach — and keep one third of the plate empty so the food has room to breathe. Finish with a few flakes of salt on the meat and serve immediately with the rest of the sauce in a small pitcher."}],"tips":["The sauce is better made a day ahead. Reduce and strain it, refrigerate, then rewarm and mount with cold butter right before serving — never reheat a mounted sauce, it will break.","Use a wine you would happily drink. Cooking does not fix a bad bottle, it concentrates it, and cooking wine from the supermarket is salted and harsh.","If you cannot find veal stock, reduce 3 cups (720 ml) of good beef stock down to 1 1/2 cups first — the extra body is what makes a bordelaise cling.","Traditional bordelaise finishes with poached beef marrow. If you can get a marrow bone, poach 2 oz (55 g) of diced marrow in the sauce for 2 minutes at the end.","A broken sauce can often be saved: whisk 1 tbsp (15 ml) of hot water into it off the heat, drop by drop, to bring the emulsion back together."],"keyTemp":"Pull filets at 125°F (52°C) for medium-rare or 133°F (56°C) for medium; after a 10 minute rest they finish at 130 to 135°F (54 to 57°C) and 138 to 140°F (59 to 60°C) respectively.","pairing":"The same red you reduced into the sauce, plus potato puree and a handful of buttered haricots verts.","videoQuery":"filet mignon bordelaise sauce red wine reduction","photoQuery":"filet mignon red wine sauce plated","tags":["Date Night","Restaurant at Home","Cast Iron"],"cat":"Chef-Level Signatures","catSlug":"chef-level-signatures","catEmoji":"👨‍🍳"},{"id":"butter-poached-lobster-tails","title":"Butter-Poached Lobster Tails","emoji":"🦞","art":"lobster","blurb":"Lobster gently cooked in a warm bath of emulsified butter comes out sweeter and more tender than boiling could ever manage. No sous vide machine, no immersion circulator, just a small pot and a thermometer.","difficulty":"Medium","servings":"2 servings","prepTime":"15 min","cookTime":"20 min","totalTime":"35 min","ingredients":[{"group":"For the lobster","items":["4 cold-water lobster tails (5 to 6 oz / 140 to 170 g each), thawed if frozen","2 tbsp (36 g) kosher salt, for the blanching water","1/2 tsp kosher salt, for seasoning the meat","1 lemon, cut into wedges"]},{"group":"Beurre monte poaching butter","items":["3 tbsp (45 ml) water","1 lb (450 g) unsalted butter, cut into 1 tbsp pieces and kept cold","2 garlic cloves, smashed","2 tarragon sprigs (or 3 thyme sprigs)","1/2 tsp kosher salt","1 tsp (5 ml) fresh lemon juice"]}],"instructions":[{"title":"Blanch to release the shells","text":"Bring a large pot of water with the 2 tbsp kosher salt to a rolling boil, then drop the tails in for exactly 60 to 90 seconds. This is not cooking them, it is loosening the meat from the shell so it slides out whole. Pull them immediately into a bowl of ice water and leave them 2 minutes to stop the cooking cold. Skip this step and you will end up shredding the meat trying to pry it free."},{"title":"Remove the meat whole","text":"Set a cooled tail on the cutting board and snip down both sides of the soft underside shell with kitchen shears. Peel back the flap and lift the meat out in one piece, using your thumb to work it loose from the wide end. Pull out the dark digestive vein along the back with the tip of a knife, then pat the meat completely dry and season it with the 1/2 tsp kosher salt."},{"title":"Set up the butter bath","text":"Pour the 3 tbsp water into a small deep saucepan, 1 1/2 to 2 qt (1.5 to 2 L), and bring it to a simmer over medium heat. The pot needs to be small and deep so the butter is deep enough to actually submerge the lobster — a wide skillet will spread it too thin. Have a clip-on or instant-read thermometer ready, because temperature control is the entire technique here."},{"title":"Build the beurre monte","text":"Turn the heat to low and whisk in the cold butter one or two pieces at a time, adding the next only after the last has melted and the mixture looks like glossy cream. Never let it boil — above about 190°F (88°C) the emulsion breaks and separates into oil and milky solids. Keep whisking steadily and you will end up with roughly 2 cups of thick, opaque, sauce-like butter, not a clear puddle of grease."},{"title":"Hold the temperature","text":"Add the smashed garlic, the tarragon, and the 1/2 tsp salt, then adjust the burner to hold the butter between 160 and 180°F (71 and 82°C). On most home stoves that means the lowest setting, with the pot pulled halfway off the burner whenever it climbs. Check the thermometer every couple of minutes; this range is warm enough to cook lobster gently but cool enough that the proteins never seize and toughen."},{"title":"Poach the tails","text":"Slip the lobster meat into the butter, making sure each piece is fully submerged, and poach for 6 to 8 minutes depending on thickness. Turn the pieces once halfway through with a spoon. The meat will go from translucent to opaque ivory and firm up slightly, and it should stay glossy and plump rather than shrinking and curling tight."},{"title":"Check for doneness","text":"Push an instant-read thermometer into the thickest part of a tail; you are looking for 135 to 140°F (57 to 60°C). At that point the meat is just set, sweet, and yielding — the FDA guideline for fully cooked shellfish is 145°F (63°C), which is firmer. If your thermometer will not read a piece that thin, press it: it should feel like a ripe plum, springy but not hard."},{"title":"Rest in the butter","text":"Take the pot off the heat and let the lobster sit in the warm butter for 2 to 3 minutes while you get the plates ready. It will hold at serving temperature without overcooking as long as the butter stays under 150°F (66°C). Stir the 1 tsp lemon juice into the butter now, off the heat, so the acid brightens it without threatening the emulsion."},{"title":"Reduce a little sauce","text":"Ladle about 1/3 cup (80 ml) of the poaching butter into a small warm bowl and whisk in a teaspoon of the lobster juices from the bottom of the pot. That is your sauce, and it is already perfect — do not reduce it or heat it further. The rest of the butter can be strained and saved."},{"title":"Slice and plate","text":"Cut each tail on a slight bias into 4 or 5 thick medallions, or leave them whole if you want the shape to show. Fan the medallions in a slight arc across the upper half of two warm plates, overlapping them like fallen dominoes so every cut face catches the light. Spoon the warm butter sauce over the meat, add a few torn tarragon leaves and a lemon wedge at the edge, and serve right away."}],"tips":["Strain and refrigerate the leftover butter — it keeps for 2 weeks and is spectacular tossed with pasta, brushed on corn, or used to poach fish or shrimp another night.","Cold-water tails (Maine, Canadian) are sweeter and firmer than warm-water ones, which can be mushy. Look for tails whose shell is hard and whose meat is white, not gray.","If your butter breaks and turns oily, take it off the heat, add 1 tbsp (15 ml) cold water, and whisk hard — it will usually pull back together.","You can poach in a smaller amount of butter by using a narrow pot and turning the pieces every 90 seconds, but keep at least enough to half-cover them.","The same beurre monte poaches shrimp in 3 minutes and thick fish fillets in 10 to 12 — this technique is worth learning for more than lobster."],"keyTemp":"Hold the butter at 160 to 180°F (71 to 82°C) and pull the lobster at 135 to 140°F (57 to 60°C) for tender, just-set meat; the FDA guideline for fully cooked shellfish is 145°F (63°C).","pairing":"A buttery Chardonnay or a glass of Champagne, with asparagus and a lemon wedge on the side.","videoQuery":"butter poached lobster tail beurre monte no sous vide","photoQuery":"butter poached lobster tail medallions plate","tags":["Date Night","Restaurant at Home","Under an Hour"],"cat":"Chef-Level Signatures","catSlug":"chef-level-signatures","catEmoji":"👨‍🍳"}],"categories":[{"slug":"steaks-and-beef","name":"Steaks & Beef","emoji":"🥩","blurb":"Everything here is built on the same two skills: get the meat properly dry and properly salted, then cook it to a number instead of to a guess.","count":16},{"slug":"seafood-and-shellfish","name":"Seafood & Shellfish","emoji":"🦐","blurb":"Seafood is the fastest good dinner there is — most of these are done in the time it takes to boil water, and the rest are the kind of weekend pot that makes the whole apartment smell like a harbor town.","count":16},{"slug":"italian-classics","name":"Italian Classics","emoji":"🍝","blurb":"The Sunday-afternoon side of Italian cooking — golden cutlets, slow braises, risotto stirred with a glass of wine in your other hand, and dough that fills the whole apartment with the smell of a good bakery.","count":8},{"slug":"chef-level-signatures","name":"Chef-Level Signatures","emoji":"👨‍🍳","blurb":"These are the plates you would pay real money for in a room with cloth napkins — lacquered duck skin, scallops on a cloud of cauliflower, a Wellington that gets a gasp when you slice it. None of it is magic; it is a handful of careful steps done in the right order, and you can absolutely do this.","count":4}]}</script>

<script>
(function(){
'use strict';
/* Hand-drawn dish illustrations, rendered as inline SVG.
   No network, no external files - these work on a plane, in a basement, forever.
   art(key, seed) -> SVG string sized to a 400x260 viewBox. */

function hash(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < String(s).length; i++) { h ^= String(s).charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rng(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
const R = (n, d = 1) => Number(n.toFixed(d));

/* ---------- shared primitives ---------- */

const shadow = (cx = 200, cy = 205, rx = 132, ry = 18) =>
  `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#sh)"/>`;

const plate = (cx = 200, cy = 168, rx = 132, ry = 50, c = '#ffffff', inner = '#f2ede4') =>
  `${shadow(cx, cy + 34, rx * 0.94, 16)}
   <ellipse cx="${cx}" cy="${cy + 12}" rx="${rx}" ry="${ry}" fill="#d9d2c6"/>
   <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${c}"/>
   <ellipse cx="${cx}" cy="${cy + 2}" rx="${rx * 0.79}" ry="${ry * 0.76}" fill="${inner}"/>`;

/* bowl: returns {back, front} so food can be sandwiched between */
function bowl(cx = 200, top = 128, rx = 122, depth = 92, outer = '#ffffff', inner = '#ece5d9') {
  const back = `${shadow(cx, top + depth + 4, rx * 0.8, 15)}
    <path d="M${cx - rx},${top} Q${cx},${top + depth * 1.9} ${cx + rx},${top} Z" fill="${outer}"/>
    <path d="M${cx - rx},${top} Q${cx},${top + depth * 1.9} ${cx + rx},${top} Z" fill="url(#bowlSh)"/>
    <ellipse cx="${cx}" cy="${top}" rx="${rx}" ry="${rx * 0.29}" fill="${inner}"/>`;
  const front = `<ellipse cx="${cx}" cy="${top}" rx="${rx}" ry="${rx * 0.29}" fill="none" stroke="#ffffff" stroke-width="7" opacity=".95"/>
    <path d="M${cx - rx + 8},${top + 14} Q${cx},${top + depth * 1.55} ${cx + rx - 8},${top + 14}" fill="none" stroke="#00000010" stroke-width="6"/>`;
  return { back, front, clip: `<ellipse cx="${cx}" cy="${top}" rx="${rx - 4}" ry="${(rx - 4) * 0.29}"/>` };
}

const skillet = () => `${shadow(196, 208, 128, 17)}
  <rect x="300" y="128" width="96" height="17" rx="8" fill="#3b3b40"/>
  <rect x="300" y="128" width="96" height="7" rx="3.5" fill="#55555c"/>
  <ellipse cx="196" cy="150" rx="136" ry="54" fill="#33333a"/>
  <ellipse cx="196" cy="143" rx="136" ry="54" fill="#4a4a52"/>
  <ellipse cx="196" cy="145" rx="120" ry="45" fill="#2c2c33"/>
  <ellipse cx="196" cy="143" rx="120" ry="45" fill="#3a3a42"/>`;

const board = () => `${shadow(200, 206, 140, 16)}
  <path d="M60,112 h280 a14,14 0 0 1 14,14 v52 a14,14 0 0 1 -14,14 h-280 a14,14 0 0 1 -14,-14 v-52 a14,14 0 0 1 14,-14 z" fill="#b98551"/>
  <path d="M60,112 h280 a14,14 0 0 1 14,14 v10 h-308 v-10 a14,14 0 0 1 14,-14 z" fill="#c9975f"/>
  <g stroke="#a8763f" stroke-width="2" opacity=".55">
    <path d="M62,132 h276"/><path d="M62,152 h276"/><path d="M62,172 h276"/></g>`;

const steam = (x, y, r) => {
  let s = '';
  for (let i = 0; i < 3; i++) {
    const dx = x + (i - 1) * 34, o = 0.5 - i * 0.08, w = 16 + r() * 8;
    s += `<path d="M${dx},${y} c-${w},-16 ${w},-28 0,-46 c-${w * 0.7},-14 ${w * 0.7},-22 0,-34"
            fill="none" stroke="#ffffff" stroke-opacity="${R(o, 2)}" stroke-width="6" stroke-linecap="round"/>`;
  }
  return s;
};

const herb = (x, y, s = 1, c = '#3f8b4a') =>
  `<g transform="translate(${x},${y}) scale(${s})" fill="${c}">
     <path d="M0,0 C-2,-16 -2,-30 0,-40 C2,-30 2,-16 0,0 z"/>
     <ellipse cx="-8" cy="-12" rx="8" ry="4.5" transform="rotate(-28 -8 -12)"/>
     <ellipse cx="8" cy="-19" rx="8" ry="4.5" transform="rotate(28 8 -19)"/>
     <ellipse cx="-8" cy="-26" rx="7" ry="4" transform="rotate(-28 -8 -26)"/>
     <ellipse cx="7" cy="-33" rx="6.5" ry="3.8" transform="rotate(28 7 -33)"/>
   </g>`;

const lemon = (x, y, s = 1) =>
  `<g transform="translate(${x},${y}) scale(${s})">
     <circle r="19" fill="#f7d13a"/><circle r="15" fill="#fdf0a8"/>
     <g stroke="#f2c02a" stroke-width="2">
       <path d="M0,0 L0,-14"/><path d="M0,0 L13,-6"/><path d="M0,0 L9,11"/>
       <path d="M0,0 L-9,11"/><path d="M0,0 L-13,-6"/></g>
   </g>`;

const scatter = (r, n, x0, y0, w, h, colors, rad = 3) => {
  let s = '';
  for (let i = 0; i < n; i++) {
    s += `<circle cx="${R(x0 + r() * w)}" cy="${R(y0 + r() * h)}" r="${R(rad * (0.6 + r() * 0.8))}"
           fill="${colors[Math.floor(r() * colors.length)]}" opacity="${R(0.65 + r() * 0.35, 2)}"/>`;
  }
  return s;
};

const grillMarks = (x, y, w, h, angle = -14, n = 4, c = '#2a1408') => {
  let s = `<g transform="rotate(${angle} ${x + w / 2} ${y + h / 2})" opacity=".55">`;
  for (let i = 0; i < n; i++) {
    s += `<rect x="${x + 6 + i * (w - 12) / n}" y="${y}" width="7" height="${h}" rx="3.5" fill="${c}"/>`;
  }
  return s + '</g>';
};

/* ---------- the dishes ---------- */

const D = {};

/* Steak is by far the most repeated drawing in the book (a whole chapter of it),
   so it gets three genuinely different plates rather than one image ten times. */
D.steak = (r, v) => {
  if (v === 1) {                                  // sliced and fanned on a board
    let slices = '';
    for (let i = 0; i < 6; i++) {
      const x = 128 + i * 28, a = -14 + i * 5;
      slices += `<g transform="translate(${x},150) rotate(${a})">
        <rect x="-16" y="-38" width="32" height="76" rx="12" fill="#4f2610"/>
        <rect x="-13" y="-35" width="26" height="70" rx="10" fill="#8f4420"/>
        <ellipse cx="0" cy="0" rx="9" ry="26" fill="#c4506a"/>
        <ellipse cx="0" cy="-1" rx="5.5" ry="20" fill="#dd8390"/>
        <rect x="-13" y="-35" width="26" height="8" rx="4" fill="#6b3417"/>
      </g>`;
    }
    return `${board()}${slices}
      ${herb(316, 128, 0.7)}
      ${scatter(r, 12, 100, 186, 200, 12, ['#f0e3c0', '#3f8b4a'], 2.2)}`;
  }
  if (v === 2) {                                  // plated with a sauce swoosh
    return `${plate(200, 172, 134, 48)}
      <path d="M92,168 C120,140 180,132 232,142 C268,149 292,164 300,176 C262,186 120,186 92,168 z" fill="#5c2412" opacity=".55"/>
      <g transform="translate(0,-10)">
        <path d="M112,152 C112,122 150,108 198,108 C250,108 288,122 288,152 C288,178 250,190 198,190 C150,190 112,178 112,152 z" fill="#5a2c13"/>
        <path d="M118,148 C118,120 154,108 198,108 C246,108 282,120 282,148 C282,172 246,182 198,182 C154,182 118,172 118,148 z" fill="#8a441c"/>
        ${grillMarks(132, 116, 132, 58, -10, 3)}
        <path d="M156,144 C164,130 180,126 198,126 C220,126 238,132 244,146 C236,158 220,162 198,162 C176,162 162,156 156,144 z" fill="#c4506a" opacity=".85"/>
        <rect x="184" y="94" width="34" height="15" rx="6" fill="#fbe9a8"/>
        <rect x="184" y="94" width="34" height="6" rx="3" fill="#fdf4cf"/>
      </g>
      ${herb(300, 150, 0.75)}
      ${scatter(r, 10, 130, 176, 150, 14, ['#f0e3c0', '#2f1b0c'], 2.4)}`;
  }
  return `${skillet()}                             <!-- whole steak in the pan -->
  <g transform="translate(0,-4)">
    <path d="M96,150 C96,116 140,100 196,100 C258,100 300,116 300,150 C300,180 256,194 196,194 C140,194 96,180 96,150 z" fill="#5a2c13"/>
    <path d="M100,146 C100,114 142,98 196,98 C256,98 296,114 296,146 C296,174 254,188 196,188 C142,188 100,174 100,146 z" fill="#7d3d18"/>
    <path d="M112,140 C112,116 148,104 196,104 C246,104 284,116 284,140 C284,162 246,174 196,174 C148,174 112,162 112,140 z" fill="#94491d"/>
    ${grillMarks(120, 108, 156, 62)}
    <path d="M150,138 C158,124 176,120 196,120 C220,120 240,126 246,140 C238,152 220,156 196,156 C172,156 156,150 150,138 z" fill="#c4506a" opacity=".85"/>
    <path d="M160,136 C168,126 180,124 196,124 C214,124 230,128 236,138 C228,146 214,150 196,150 C176,150 164,144 160,136 z" fill="#d96f80" opacity=".8"/>
    <path d="M170,96 C186,90 214,90 232,96 C224,102 186,102 170,96 z" fill="#efe6cf"/>
    <rect x="182" y="86" width="34" height="14" rx="6" fill="#fbe9a8"/>
    <rect x="182" y="86" width="34" height="6" rx="3" fill="#fdf4cf"/>
  </g>
  ${herb(268, 120, 0.85)}
  ${scatter(r, 9, 120, 168, 160, 18, ['#f0e3c0', '#e3d3a8'], 2)}`;
};

D.roast = r => `${board()}

  let out = svg;
  for (const id of ids) {

    out = out.replace(new RegExp(`\\bid="${esc}"`, 'g'), `id="${id}-${uid}"`)

}

  <g transform="translate(${nudge},0) rotate(${spin} 200 150)">${body}</g>
</svg>`;
  return namespaceIds(svg, uid);
}
